<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
  <h2>Transaction History</h2>
  <div id="historyList"></div>
  <button onclick="goBack()">Back</button>
</div>

<script type="module">

import { db } from "./firebase.js";
import {
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

/////////////////////////////////////////////////////
// CURRENT USER
/////////////////////////////////////////////////////

let user = sessionStorage.getItem("loggedInUser");

if (!user) {
  window.location.href = "login.html";
}

/////////////////////////////////////////////////////
// LOAD HISTORY FROM FIREBASE
/////////////////////////////////////////////////////

async function loadHistory() {

  const depSnap = await getDocs(collection(db, "deposits"));
  const witSnap = await getDocs(collection(db, "withdrawals"));

  let deposits = depSnap.docs.map(d => d.data());
  let withdrawals = witSnap.docs.map(d => d.data());

  let history = [];

  // convert deposits
  deposits.forEach(d => {
    if (d.user === user) {
      history.push({
        type: "deposit",
        status: d.status,
        amount: d.amount,
        time: d.time
      });
    }
  });

  // convert withdrawals
  withdrawals.forEach(w => {
    if (w.user === user) {
      history.push({
        type: "withdrawal",
        status: w.status,
        amount: w.amount,
        time: w.time,
        wallet: w.wallet
      });
    }
  });

  render(history);
}

/////////////////////////////////////////////////////
// RENDER UI
/////////////////////////////////////////////////////

function render(history) {

  let list = document.getElementById("historyList");
  list.innerHTML = "";

  if (history.length === 0) {
    list.innerHTML = "<p>No history yet</p>";
    return;
  }

  history.reverse().forEach(item => {

    let div = document.createElement("div");
    div.classList.add("card");

    let color =
      item.type === "deposit" ? "green" :
      item.type === "withdrawal" ? "red" : "black";

    div.innerHTML = `
      <h4 style="color:${color}">
        ${item.type.toUpperCase()} - ${item.status.toUpperCase()}
      </h4>

      <p><b>Amount:</b> ${item.amount || 0} USDT</p>

      ${item.wallet ? `<p><b>Wallet:</b> ${item.wallet}</p>` : ""}

      <p><small>${new Date(item.time).toLocaleString()}</small></p>
    `;

    list.appendChild(div);
  });
}

/////////////////////////////////////////////////////
// NAVIGATION
/////////////////////////////////////////////////////

function goBack() {
  window.location.href = "dashboard.html";
}

window.goBack = goBack;

loadHistory();

</script>

</body>
</html>
