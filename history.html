<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Prevent back button after logout -->
  <script>
    if (window.history && window.history.pushState) {
      window.history.pushState(null, null, window.location.href);
      window.onpopstate = function() {
        window.history.pushState(null, null, window.location.href);
      };
    }
  </script>
  
  <style>
    /* SAME DARK THEME */
    body {
      background: #0f0f1a;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }
    
    .history-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    
    .back-btn {
      background: #1a1a2e;
      border: 1px solid #2a2a4e;
      color: #aaa;
      padding: 12px 24px;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 20px;
      font-size: 14px;
      transition: 0.3s;
    }
    
    .back-btn:hover {
      background: #2a2a4e;
      color: white;
    }
    
    .history-header {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .history-header h2 {
      color: #33b5e5;
      margin: 0;
      font-size: 24px;
    }
    
    .history-header p {
      color: #888;
      margin: 8px 0 0 0;
      font-size: 14px;
    }
    
    .history-card {
      background: #1a1a2e;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 15px;
      border: 1px solid #2a2a4e;
      transition: 0.3s;
    }
    
    .history-card:hover {
      border-color: #444;
      transform: translateX(5px);
    }
    
    .history-card h4 {
      margin: 0 0 10px 0;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    /* Type colors */
    .history-card.deposit h4 {
      color: #00c851;
    }
    .history-card.withdrawal h4 {
      color: #ff4444;
    }
    .history-card.investment h4 {
      color: #ffbb33;
    }
    .history-card.transfer h4 {
      color: #33b5e5;
    }
    
    .history-card p {
      margin: 5px 0;
      color: #aaa;
      font-size: 14px;
    }
    
    .history-card .amount {
      color: white;
      font-size: 18px;
      font-weight: bold;
    }
    
    .history-card .time {
      color: #666;
      font-size: 12px;
      margin-top: 10px;
    }
    
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
    }
    
    .status-badge.pending {
      background: rgba(255, 187, 51, 0.2);
      color: #ffbb33;
      border: 1px solid #ffbb33;
    }
    
    .status-badge.completed {
      background: rgba(0, 200, 81, 0.2);
      color: #00c851;
      border: 1px solid #00c851;
    }
    
    .status-badge.active {
      background: rgba(51, 181, 229, 0.2);
      color: #33b5e5;
      border: 1px solid #33b5e5;
    }
    
    .no-history {
      text-align: center;
      color: #666;
      padding: 40px;
    }
    
    .filter-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    .filter-tab {
      background: #1a1a2e;
      border: 1px solid #2a2a4e;
      color: #aaa;
      padding: 10px 20px;
      border-radius: 20px;
      cursor: pointer;
      transition: 0.3s;
    }
    
    .filter-tab:hover, .filter-tab.active {
      background: #2a2a4e;
      color: white;
      border-color: #444;
    }
  </style>
</head>

<body>

<div class="history-container">

  <button class="back-btn" onclick="goBack()">⬅ Back to Dashboard</button>

  <div class="history-header">
    <h2>📋 Transaction History</h2>
    <p>All your deposits, withdrawals, transfers & investments</p>
  </div>
  
  <div class="filter-tabs">
    <button class="filter-tab active" onclick="filterHistory('all')">All</button>
    <button class="filter-tab" onclick="filterHistory('deposit')">Deposits</button>
    <button class="filter-tab" onclick="filterHistory('withdrawal')">Withdrawals</button>
    <button class="filter-tab" onclick="filterHistory('transfer')">Transfers</button>
    <button class="filter-tab" onclick="filterHistory('investment')">Investments</button>
  </div>

  <div id="historyList">Loading...</div>

</div>

<script type="module">

import { auth, db } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/////////////////////////////////////////////////////
// AUTH CHECK - EXACTLY AS YOU HAD IT
/////////////////////////////////////////////////////

let currentUsername = null;
let allHistory = [];

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.replace("login.html");
    return;
  }
  
  currentUsername = sessionStorage.getItem("loggedInUser");
  if (!currentUsername) {
    window.location.replace("login.html");
    return;
  }
  
  loadHistory();
});

/////////////////////////////////////////////////////
// LOAD HISTORY - EXACTLY AS YOU HAD IT + TRANSFERS ADDED
/////////////////////////////////////////////////////

async function loadHistory() {
  const list = document.getElementById("historyList");
  
  try {
    list.innerText = "Loading history...";
    
    // Get deposits
    const depSnap = await get(ref(db, 'deposits'));
    let deposits = [];
    if (depSnap.exists()) {
      depSnap.forEach((childSnap) => {
        deposits.push(childSnap.val());
      });
    }
    
    // Get withdrawals
    const witSnap = await get(ref(db, 'withdrawals'));
    let withdrawals = [];
    if (witSnap.exists()) {
      witSnap.forEach((childSnap) => {
        withdrawals.push(childSnap.val());
      });
    }
    
    // Get investments
    const invSnap = await get(ref(db, 'investments'));
    let investments = [];
    if (invSnap.exists()) {
      invSnap.forEach((childSnap) => {
        investments.push(childSnap.val());
      });
    }
    
    // ✅ GET TRANSFERS (NEW!)
    const transSnap = await get(ref(db, 'transfers'));
    let transfers = [];
    if (transSnap.exists()) {
      transSnap.forEach((childSnap) => {
        transfers.push(childSnap.val());
      });
    }
    
    let history = [];
    
    // Add deposits
    deposits.forEach(d => {
      if (d.user === currentUsername) {
        history.push({
          type: "deposit",
          status: d.status,
          amount: d.amount,
          time: d.time,
          coin: d.coin
        });
      }
    });
    
    // Add withdrawals
    withdrawals.forEach(w => {
      if (w.user === currentUsername) {
        history.push({
          type: "withdrawal",
          status: w.status,
          amount: w.amount,
          time: w.time,
          wallet: w.wallet
        });
      }
    });
    
    // Add investments
    investments.forEach(i => {
      if (i.user === currentUsername) {
        history.push({
          type: "investment",
          status: i.status,
          amount: i.amount,
          time: i.investTime,
          plan: i.plan,
          profit: (i.amount * i.profitPercent).toFixed(2),
          hours: i.hours
        });
      }
    });
    
    // ✅ ADD TRANSFERS TO HISTORY (NEW!)
    transfers.forEach(t => {
      if (t.from === currentUsername || t.to === currentUsername) {
        history.push({
          type: "transfer",
          status: t.status || "completed",
          amount: t.amount,
          time: t.timestamp || t.time,
          from: t.from,
          to: t.to,
          direction: t.from === currentUsername ? "sent" : "received"
        });
      }
    });
    
    allHistory = history;
    render(history);
    
  } catch (err) {
    list.innerHTML = "<p class='no-history'>Error loading history</p>";
    console.error(err);
  }
}

/////////////////////////////////////////////////////
// FILTER HISTORY (NEW FEATURE!)
/////////////////////////////////////////////////////

function filterHistory(type) {
  // Update active tab
  document.querySelectorAll('.filter-tab').forEach(tab => {
    tab.classList.remove('active');
  });
  event.target.classList.add('active');
  
  if (type === 'all') {
    render(allHistory);
  } else {
    const filtered = allHistory.filter(item => item.type === type);
    render(filtered);
  }
}

/////////////////////////////////////////////////////
// RENDER - SAME LOGIC, NEW DARK DESIGN
/////////////////////////////////////////////////////

function render(history) {
  let list = document.getElementById("historyList");
  list.innerHTML = "";

  if (history.length === 0) {
    list.innerHTML = "<p class='no-history'>No history yet</p>";
    return;
  }

  // Sort by time (newest first)
  history.sort((a, b) => b.time - a.time);

  history.forEach(item => {
    let div = document.createElement("div");
    div.classList.add("history-card", item.type);

    // Icons for each type
    let icon = {
      deposit: "⬇️",
      withdrawal: "⬆️",
      investment: "📈",
      transfer: "💸"
    }[item.type] || "💰";

    // Status badge class
    let statusClass = item.status === "pending" ? "pending" : 
                      item.status === "active" ? "active" : "completed";

    // Build content based on type
    let extraContent = "";
    
    if (item.type === "deposit" && item.coin) {
      extraContent = `<p>Coin: ${item.coin}</p>`;
    }
    
    if (item.type === "withdrawal" && item.wallet) {
      extraContent = `<p>Wallet: ${item.wallet.substring(0, 15)}...</p>`;
    }
    
    if (item.type === "investment") {
      extraContent = `
        <p>Plan: ${item.plan}</p>
        <p>Expected Profit: $${item.profit}</p>
        <p>Duration: ${item.hours} hours</p>
      `;
    }
    
    if (item.type === "transfer") {
      extraContent = `
        <p>Direction: ${item.direction === "sent" ? "📤 Sent" : "📥 Received"}</p>
        <p>${item.direction === "sent" ? "To" : "From"}: ${item.direction === "sent" ? item.to : item.from}</p>
      `;
    }

    div.innerHTML = `
      <h4>${icon} ${item.type.toUpperCase()}</h4>
      <p class="amount">$${item.amount || 0}</p>
      <span class="status-badge ${statusClass}">${item.status}</span>
      ${extraContent}
      <p class="time">${new Date(item.time).toLocaleString()}</p>
    `;

    list.appendChild(div);
  });
}

/////////////////////////////////////////////////////
// NAVIGATION - FIXED
/////////////////////////////////////////////////////

function goBack() { 
  window.location.href = "dashboard.html"; 
}

window.goBack = goBack;
window.filterHistory = filterHistory;

</script>
</body>
</html>
