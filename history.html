<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Prevent back button after logout -->
  <script>
    if (window.history && window.history.pushState) {
      window.history.pushState(null, null, window.location.href);
      window.onpopstate = function() {
        window.history.pushState(null, null, window.location.href);
      };
    }
  </script>
</head>

<body>

<div class="container">
  <h2>Transaction History</h2>
  <div id="historyList">Loading...</div>
  <button onclick="goBack()">Back</button>
</div>

<script type="module">

import { auth, db } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/////////////////////////////////////////////////////
// AUTH CHECK
/////////////////////////////////////////////////////

let currentUsername = null;

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.replace("login.html");
    return;
  }
  
  currentUsername = sessionStorage.getItem("loggedInUser");
  if (!currentUsername) {
    window.location.replace("login.html");
    return;
  }
  
  // Load history after auth confirmed
  loadHistory();
});

/////////////////////////////////////////////////////
// LOAD HISTORY FROM REALTIME DATABASE
/////////////////////////////////////////////////////

async function loadHistory() {
  const list = document.getElementById("historyList");
  
  try {
    list.innerText = "Loading history...";
    
    // Get deposits
    const depSnap = await get(ref(db, 'deposits'));
    let deposits = [];
    if (depSnap.exists()) {
      depSnap.forEach((childSnap) => {
        deposits.push(childSnap.val());
      });
    }
    
    // Get withdrawals
    const witSnap = await get(ref(db, 'withdrawals'));
    let withdrawals = [];
    if (witSnap.exists()) {
      witSnap.forEach((childSnap) => {
        withdrawals.push(childSnap.val());
      });
    }
    
    let history = [];
    
    // Add deposits
    deposits.forEach(d => {
      if (d.user === currentUsername) {
        history.push({
          type: "deposit",
          status: d.status,
          amount: d.amount,
          time: d.time
        });
      }
    });
    
    // Add withdrawals
    withdrawals.forEach(w => {
      if (w.user === currentUsername) {
        history.push({
          type: "withdrawal",
          status: w.status,
          amount: w.amount,
          time: w.time,
          wallet: w.wallet
        });
      }
    });
    
    render(history);
    
  } catch (err) {
    list.innerHTML = "<p style='color:red'>Error loading history</p>";
    console.error(err);
  }
}

/////////////////////////////////////////////////////
// RENDER UI
/////////////////////////////////////////////////////

function render(history) {
  let list = document.getElementById("historyList");
  list.innerHTML = "";

  if (history.length === 0) {
    list.innerHTML = "<p>No history yet</p>";
    return;
  }

  // Sort by time (newest first)
  history.sort((a, b) => b.time - a.time);

  history.forEach(item => {
    let div = document.createElement("div");
    div.classList.add("card");
    div.style.marginBottom = "10px";
    div.style.padding = "15px";
    div.style.border = "1px solid #ddd";
    div.style.borderRadius = "8px";

    let color = item.type === "deposit" ? "green" : "red";
    let icon = item.type === "deposit" ? "⬇️" : "⬆️";

    div.innerHTML = `
      <h4 style="color:${color}; margin:0 0 10px 0;">
        ${icon} ${item.type.toUpperCase()} - ${item.status.toUpperCase()}
      </h4>
      <p style="margin:5px 0;"><b>Amount:</b> $${item.amount || 0}</p>
      ${item.wallet ? `<p style="margin:5px 0;"><b>Wallet:</b> ${item.wallet}</p>` : ""}
      <p style="margin:5px 0; color:#666;"><small>${new Date(item.time).toLocaleString()}</small></p>
    `;

    list.appendChild(div);
  });
}

/////////////////////////////////////////////////////
// NAVIGATION (USES REPLACE!)
/////////////////////////////////////////////////////

function goBack() {
  window.location.replace("dashboard.html");
}

window.goBack = goBack;

</script>

</body>
</html>
