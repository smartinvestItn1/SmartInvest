<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <button onclick="goHome()">🏠 Home</button>

  <form onsubmit="signup(event)">

    <h2>Create Account</h2>

    <input id="username" placeholder="Username" required><br>
    <input id="email" placeholder="Email" required><br>

    <input id="password" type="password" placeholder="Password" required><br>
    <input id="confirm" type="password" placeholder="Confirm Password" required><br>

    <button type="submit">Sign Up</button>

  </form>

  <p onclick="goLogin()" class="link">
    Already have an account? Login
  </p>

</div>

<script>

function signup(event) {
  event.preventDefault();

  let username = document.getElementById("username").value.trim();
  let email = document.getElementById("email").value.trim();
  let password = document.getElementById("password").value.trim();
  let confirm = document.getElementById("confirm").value.trim();

  if (!username || !email || !password || !confirm) {
    alert("Please fill all fields");
    return;
  }

  if (password !== confirm) {
    alert("Passwords do not match");
    return;
  }

  let users = JSON.parse(localStorage.getItem("users")) || [];

  // ✅ FIX 1: case-insensitive username check
  let exists = users.find(u =>
    String(u.username).toLowerCase() === String(username).toLowerCase()
  );

  if (exists) {
    alert("User already exists");
    return;
  }

  // ✅ FIX 2: force consistent data format
  let newUser = {
    username: String(username),
    email: String(email),
    password: String(password),
    balance: Number(0),
    pending: Number(0),
    plan: "None",
    image: "",
    role: "user"
  };

  users.push(newUser);

  // ✅ FIX 3: safe storage
  localStorage.setItem("users", JSON.stringify(users));

  // ✅ DEBUG (you can remove later)
  console.log("Users saved:", users);

  alert("Account created successfully");

  // ✅ FIX 4: better redirect (prevents back issues)
  window.location.replace("login.html");
}

function goHome() {
  window.location.href = "index.html";
}

function goLogin() {
  window.location.href = "login.html";
                                              }
</script>

</body>
</html>
