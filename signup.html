<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <button onclick="goHome()">🏠 Home</button>

  <form onsubmit="signup(event)">

    <h2>Create Account</h2>

    <input id="username" placeholder="Username" required><br>
    <input id="email" placeholder="Email" required><br>

    <input id="password" type="password" placeholder="Password" required><br>
    <input id="confirm" type="password" placeholder="Confirm Password" required><br>

    <button type="submit">Sign Up</button>

  </form>

  <p onclick="goLogin()" class="link">
    Already have an account? Login
  </p>

</div>

<script type="module" src="firebase.js"></script>

<script type="module">

import { db } from "./firebase.js";
import { collection, addDoc, getDocs } 
from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

/////////////////////////////////////////////////////
// SIGNUP
/////////////////////////////////////////////////////

async function signup(event) {
  event.preventDefault();

  let username = document.getElementById("username").value.trim();
  let email = document.getElementById("email").value.trim();
  let password = document.getElementById("password").value.trim();
  let confirm = document.getElementById("confirm").value.trim();

  if (!username || !email || !password || !confirm) {
    alert("Please fill all fields");
    return;
  }

  if (password !== confirm) {
    alert("Passwords do not match");
    return;
  }

  // check if user exists
  const usersSnap = await getDocs(collection(db, "users"));

  let exists = false;

  usersSnap.forEach(doc => {
    const u = doc.data();
    if (u.username === username) {
      exists = true;
    }
  });

  if (exists) {
    alert("User already exists");
    return;
  }

  // create user in Firebase
  await addDoc(collection(db, "users"), {
    username,
    email,
    password,
    balance: 0,
    plan: "None",
    wallet: "",
    createdAt: Date.now()
  });

  alert("Account created successfully");

  window.location.replace("login.html");
}

/////////////////////////////////////////////////////
// NAVIGATION (IMPORTANT FIX)
/////////////////////////////////////////////////////

function goHome() {
  window.location.href = "index.html";
}

function goLogin() {
  window.location.href = "login.html";
}

/////////////////////////////////////////////////////
// EXPOSE TO HTML
/////////////////////////////////////////////////////

window.signup = signup;
window.goHome = goHome;
window.goLogin = goLogin;

</script>

</body>
</html>
