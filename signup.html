<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <button onclick="window.location.href='index.html'">🏠 Home</button>
  
  <form id="signupForm">
    <h2>Create Account</h2>
    <input id="username" placeholder="Username" required><br>
    <input id="email" type="email" placeholder="Email" required><br>
    <input id="password" type="password" placeholder="Password (min 6 chars)" required><br>
    <input id="confirm" type="password" placeholder="Confirm Password" required><br>
    <button type="submit" id="signupBtn">Sign Up</button>
    <p id="result" style="color:red; font-weight:bold; margin-top:10px; min-height:20px;"></p>
  </form>
  
  <p onclick="window.location.href='login.html'" style="color:blue; text-decoration:underline; cursor:pointer;">
    Already have an account? Login
  </p>
</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const form = document.getElementById("signupForm");
const result = document.getElementById("result");

form.onsubmit = async function(event) {
  event.preventDefault();
  
  // STEP 1: Get values
  let username = document.getElementById("username").value.trim();
  let email = document.getElementById("email").value.trim();
  let password = document.getElementById("password").value.trim();
  let confirm = document.getElementById("confirm").value.trim();
  
  // STEP 2: Simple validation
  if (!username || !email || !password || !confirm) {
    result.style.color = "red";
    result.innerText = "Please fill all fields!";
    return false;
  }
  
  if (password !== confirm) {
    result.style.color = "red";
    result.innerText = "Passwords do not match!";
    return false;
  }
  
  if (password.length < 6) {
    result.style.color = "red";
    result.innerText = "Password must be 6+ characters!";
    return false;
  }
  
  // STEP 3: Show loading
  result.style.color = "blue";
  result.innerText = "Creating account... (please wait)";
  
  // STEP 4: Set timeout - if nothing happens in 15 seconds, show error
  let timeoutId = setTimeout(() => {
    result.style.color = "red";
    result.innerText = "Connection too slow. Check your internet and try again.";
  }, 15000);
  
  try {
    // STEP 5: Create Firebase Auth user
    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;
    
    // STEP 6: Save to Firestore
    result.innerText = "Saving your data...";
    
    await addDoc(collection(db, "users"), {
      uid: user.uid,
      username: username,
      email: email,
      balance: 0,
      pending: 0,
      plan: "None",
      wallet: "",
      image: "",
      role: "user",
      createdAt: Date.now()
    });
    
    // SUCCESS! Clear timeout
    clearTimeout(timeoutId);
    
    result.style.color = "green";
    result.innerText = "✅ Account created! Redirecting...";
    
    setTimeout(() => {
      window.location.href = "login.html";
    }, 1500);
    
  } catch (error) {
    // Clear timeout
    clearTimeout(timeoutId);
    
    result.style.color = "red";
    
    // Simple error messages
    if (error.code === "auth/email-already-in-use") {
      result.innerText = "This email is already used. Try logging in.";
    } else if (error.code === "auth/invalid-email") {
      result.innerText = "Invalid email address.";
    } else if (error.code === "auth/weak-password") {
      result.innerText = "Password too weak. Use 6+ characters.";
    } else if (error.code === "auth/too-many-requests") {
      result.innerText = "Too many tries. Wait 10 minutes.";
    } else if (error.code === "auth/network-request-failed") {
      result.innerText = "No internet! Check your connection.";
    } else {
      result.innerText = "Error: " + error.message;
    }
  }
  
  return false;
};
</script>

</body>
</html>
