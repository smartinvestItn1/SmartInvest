<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Prevent back button after logout -->
  <script>
    if (window.history && window.history.pushState) {
      window.history.pushState(null, null, window.location.href);
      window.onpopstate = function() {
        window.history.pushState(null, null, window.location.href);
      };
    }
  </script>
  
  <style>
    body {
      background: #0f0f1a;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .signup-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }
    
    .home-btn {
      background: transparent;
      border: 1px solid #2a2a4e;
      color: #aaa;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 20px;
      font-size: 14px;
      transition: 0.3s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .home-btn:hover {
      background: #2a2a4e;
      color: white;
    }
    
    .signup-card{
  background: linear-gradient(145deg,#1a1a2e,#151525);
  border-radius:24px;
  padding:40px;
  border:1px solid #2a2a4e;
  box-shadow:
    0 20px 50px rgba(0,0,0,.5),
    inset 0 1px 1px rgba(255,255,255,.05);
  transition:.3s ease;
}

.signup-card:hover{
  transform:translateY(-4px);
}
    
    .signup-header {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .signup-header h2 {
      color: #00c851;
      margin: 0;
      font-size: 28px;
    }
    
    .signup-header p {
      color: #888;
      margin: 10px 0 0 0;
      font-size: 14px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group label {
      display: block;
      color: #888;
      font-size: 12px;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    
    .form-input::placeholder {
      color: #666;
    }
    
    .signup-btn {
      width: 100%;
      padding: 18px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #00c851, #00b248);
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 10px;
    }
    .form-input{
  width:100%;
  padding:15px;
  border-radius:14px;
  border:1px solid #2a2a4e;
  background:#0f0f1a;
  color:#fff;
  font-size:16px;
  box-sizing:border-box;
  transition:0.3s ease;

  box-shadow:0 0 0 rgba(0,0,0,0);
}

/* normal hover glow */
.form-input:hover{
  border-color:#444;
  box-shadow:0 0 10px rgba(255,255,255,0.05);
}

/* ACTIVE GLOW (THIS IS THE IMPORTANT PART) */
.form-input:focus{
  outline:none;
  border-color:#00c851;
  box-shadow:
    0 0 12px rgba(0,200,81,0.35),
    0 0 25px rgba(0,200,81,0.15);
  transform:translateY(-1px);
      }
    
    #result {
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      margin-top: 15px;
      font-weight: bold;
      font-size: 14px;
      display: none;
    }
    
    #result.show {
      display: block;
    }
    
    #result.success {
      background: rgba(0, 200, 81, 0.2);
      color: #00c851;
      border: 1px solid #00c851;
    }
    
    #result.error {
      background: rgba(255, 68, 68, 0.2);
      color: #ff4444;
      border: 1px solid #ff4444;
    }
    
    #result.loading {
      background: rgba(51, 181, 229, 0.2);
      color: #33b5e5;
      border: 1px solid #33b5e5;
    }
    
    .login-link {
      text-align: center;
      margin-top: 25px;
      color: #888;
      font-size: 14px;
    }
    
    .login-link a {
      color: #00c851;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    
    .login-link a:hover {
      text-decoration: underline;
    }
    
    .divider {
      display: flex;
      align-items: center;
      margin: 25px 0;
      color: #444;
      font-size: 12px;
    }
    
    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #2a2a4e;
    }
    
    .divider span {
      padding: 0 15px;
    }
    .signup-btn{
  box-shadow:0 10px 25px rgba(0,200,81,.25);
}

.signup-btn:hover{
  box-shadow:0 15px 35px rgba(0,200,81,.4);
    }
  </style>
</head>
<body>

<div class="signup-container">

  <button class="home-btn" onclick="goHome()">🏠 Home</button>

  <div class="signup-card">
    
    <div class="signup-header">
      <h2>Create Account</h2>
      <p>Join SmartInvest and start growing your wealth</p>
    </div>
    
    <form id="signupForm">
      
      <div class="form-group">
        <label>Username</label>
        <input id="username" class="form-input" placeholder="Choose a username" required>
      </div>
      
      <div class="form-group">
        <label>Email Address</label>
        <input id="email" class="form-input" type="email" placeholder="Enter your email" required>
      </div>
      
      <div class="form-group">
        <label>Password</label>
        <input id="password" class="form-input" type="password" placeholder="Min 6 characters" required>
      </div>
      
      <div class="form-group">
        <label>Confirm Password</label>
        <input id="confirm" class="form-input" type="password" placeholder="Confirm your password" required>
      </div>
      
      <button type="submit" class="signup-btn">Create Account</button>
      
      <p id="result"></p>
      
    </form>
    
    <div class="divider"><span>OR</span></div>
    
    <div class="login-link">
      Already have an account? <a onclick="goLogin()">Sign In</a>
    </div>
    
  </div>

</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { ref, set, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

document.getElementById("signupForm").onsubmit = async function(event) {
  event.preventDefault();
  
  let username = document.getElementById("username").value.trim();
  let email = document.getElementById("email").value.trim();
  let password = document.getElementById("password").value.trim();
  let confirm = document.getElementById("confirm").value.trim();
  let result = document.getElementById("result");
  
  if (!username || !email || !password || !confirm) {
    result.className = "show error";
    result.innerText = "❌ Please fill all fields!";
    return false;
  }
  
  if (password !== confirm) {
    result.className = "show error";
    result.innerText = "❌ Passwords do not match!";
    return false;
  }
  
  if (password.length < 6) {
    result.className = "show error";
    result.innerText = "❌ Password must be 6+ characters!";
    return false;
  }
  
  result.className = "show loading";
  result.innerText = "⏳ Creating account...";
  
  try {
    const userSnapshot = await get(ref(db, 'users/' + username));
    if (userSnapshot.exists()) {
      result.className = "show error";
      result.innerText = "❌ Username already taken!";
      return false;
    }
    
    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;
    
    result.className = "show loading";
    result.innerText = "⏳ Saving your data...";
    
    // Generate unique account ID
    let accountId = "eP" + Math.floor(100000 + Math.random() * 900000);
    
    await set(ref(db, 'users/' + username), {
      uid: user.uid,
      username: username,
      email: email,
      accountId: accountId,
      balance: 0,
      pending: 0,
      plan: "None",
      wallet: "",
      image: "",
      role: username === "admin" ? "admin" : "user",
      adminFlags: {
        canInvest: true,
        canWithdraw: true,
        blockReason: ""
      },
      createdAt: Date.now()
    });
    
    result.className = "show success";
    result.innerText = `✅ Account created! Your ID: ${accountId}\nRedirecting...`;
    
    setTimeout(() => {
      window.location.href = "login.html";
    }, 2000);
    
  } catch (error) {
    result.className = "show error";
    
    if (error.code === "auth/email-already-in-use") {
      result.innerText = "❌ Email already used. Try logging in.";
    } else if (error.code === "auth/invalid-email") {
      result.innerText = "❌ Invalid email.";
    } else if (error.code === "auth/weak-password") {
      result.innerText = "❌ Password too weak.";
    } else if (error.code === "auth/too-many-requests") {
      result.innerText = "❌ Too many tries. Wait 10 minutes.";
    } else {
      result.innerText = "❌ Error: " + error.message;
    }
  }
  
  return false;
};

function goHome() { window.location.href = "index.html"; }
function goLogin() { window.location.href = "login.html"; }

window.goHome = goHome;
window.goLogin = goLogin;

</script>
</body>
</html>
