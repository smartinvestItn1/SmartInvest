<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <button onclick="window.location.href='index.html'">🏠 Home</button>
  
  <form id="signupForm">
    <h2>Create Account</h2>
    <input id="username" placeholder="Username" required><br>
    <input id="email" type="email" placeholder="Email" required><br>
    <input id="password" type="password" placeholder="Password (min 6 chars)" required><br>
    <input id="confirm" type="password" placeholder="Confirm Password" required><br>
    <button type="submit">Sign Up</button>
    <p id="result" style="color:red; font-weight:bold; margin-top:10px;"></p>
  </form>
  
  <p onclick="window.location.href='login.html'" style="color:blue; text-decoration:underline; cursor:pointer;">
    Already have an account? Login
  </p>
</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { ref, set, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

document.getElementById("signupForm").onsubmit = async function(event) {
  event.preventDefault();
  
  let username = document.getElementById("username").value.trim();
  let email = document.getElementById("email").value.trim();
  let password = document.getElementById("password").value.trim();
  let confirm = document.getElementById("confirm").value.trim();
  let result = document.getElementById("result");
  
  if (!username || !email || !password || !confirm) {
    result.innerText = "Please fill all fields!";
    return false;
  }
  
  if (password !== confirm) {
    result.innerText = "Passwords do not match!";
    return false;
  }
  
  if (password.length < 6) {
    result.innerText = "Password must be 6+ characters!";
    return false;
  }
  
  result.style.color = "blue";
  result.innerText = "Creating account...";
  
  try {
    // Check if username exists
    const userSnapshot = await get(ref(db, 'users/' + username));
    if (userSnapshot.exists()) {
      result.style.color = "red";
      result.innerText = "Username already taken!";
      return false;
    }
    
    // Create Firebase Auth user
    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;
    
    result.innerText = "Saving your data...";
    
    // Save to Realtime Database
    await set(ref(db, 'users/' + username), {
      uid: user.uid,
      username: username,
      email: email,
      balance: 0,
      pending: 0,
      plan: "None",
      wallet: "",
      image: "",
      role: "user",
      createdAt: Date.now()
    });
    
    result.style.color = "green";
    result.innerText = "✅ Account created! Redirecting...";
    
    setTimeout(() => {
      window.location.href = "login.html";
    }, 1500);
    
  } catch (error) {
    result.style.color = "red";
    
    if (error.code === "auth/email-already-in-use") {
      result.innerText = "Email already used. Try logging in.";
    } else if (error.code === "auth/invalid-email") {
      result.innerText = "Invalid email.";
    } else if (error.code === "auth/weak-password") {
      result.innerText = "Password too weak.";
    } else if (error.code === "auth/too-many-requests") {
      result.innerText = "Too many tries. Wait 10 minutes.";
    } else {
      result.innerText = "Error: " + error.message;
    }
  }
  
  return false;
};
</script>

</body>
</html>
