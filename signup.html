<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — SmartInvest</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- EmailJS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

  <!-- Prevent back button after logout -->
  <script>
    if (window.history && window.history.pushState) {
      window.history.pushState(null, null, window.location.href);
      window.onpopstate = function() {
        window.history.pushState(null, null, window.location.href);
      };
    }
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f0f1a;
      color: #e8e8ec;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .signup-wrapper {
      width: 100%;
      max-width: 440px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #666680;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 32px;
      transition: color 0.2s ease;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    .back-link:hover {
      color: #ffbb33;
    }

    .back-link svg {
      width: 16px;
      height: 16px;
    }

    .signup-card {
      background: rgba(25, 25, 40, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 24px;
      padding: 40px 36px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    .signup-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .signup-header .logo-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #00c851, #00b248);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 24px;
    }

    .signup-header h2 {
      color: #fff;
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .signup-header p {
      color: #666680;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      color: #8888a0;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      background: rgba(15, 15, 30, 0.6);
      color: #fff;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      transition: all 0.25s ease;
    }

    .form-group input::placeholder {
      color: #444460;
    }

    .form-group input:focus {
      outline: none;
      border-color: #00c851;
      box-shadow: 0 0 0 3px rgba(0, 200, 81, 0.1);
      background: rgba(15, 15, 30, 0.8);
    }

    .signup-btn {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #00c851, #00b248);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.25s ease;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.3px;
    }

    .signup-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 200, 81, 0.35);
    }

    .signup-btn:active {
      transform: scale(0.98);
    }

    #result {
      text-align: center;
      padding: 12px 16px;
      border-radius: 10px;
      margin-top: 16px;
      font-weight: 600;
      font-size: 13px;
      display: none;
      font-family: 'Inter', sans-serif;
    }

    #result.show {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #result.success {
      background: rgba(0, 200, 81, 0.12);
      color: #00c851;
      border: 1px solid rgba(0, 200, 81, 0.25);
    }

    #result.error {
      background: rgba(255, 68, 68, 0.12);
      color: #ff4444;
      border: 1px solid rgba(255, 68, 68, 0.25);
    }

    #result.loading {
      background: rgba(51, 181, 229, 0.12);
      color: #33b5e5;
      border: 1px solid rgba(51, 181, 229, 0.25);
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 28px 0;
      color: #444460;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.06);
    }

    .divider span {
      padding: 0 16px;
    }

    .login-link {
      text-align: center;
      color: #666680;
      font-size: 14px;
    }

    .login-link a {
      color: #ffbb33;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .login-link a:hover {
      color: #ff8800;
    }

    /* Floating particles background */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(0, 200, 81, 0.15);
      border-radius: 50%;
      animation: float 15s infinite ease-in-out;
    }

    .particle:nth-child(1) { left: 10%; top: 80%; animation-delay: 0s; }
    .particle:nth-child(2) { left: 20%; top: 20%; animation-delay: 2s; }
    .particle:nth-child(3) { left: 35%; top: 60%; animation-delay: 4s; }
    .particle:nth-child(4) { left: 50%; top: 10%; animation-delay: 6s; }
    .particle:nth-child(5) { left: 65%; top: 70%; animation-delay: 8s; }
    .particle:nth-child(6) { left: 80%; top: 30%; animation-delay: 10s; }
    .particle:nth-child(7) { left: 90%; top: 85%; animation-delay: 12s; }
    .particle:nth-child(8) { left: 15%; top: 40%; animation-delay: 14s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.3; }
      50% { transform: translateY(-40px) scale(1.5); opacity: 0.8; }
    }

    .signup-wrapper {
      position: relative;
      z-index: 1;
    }

    @media (max-width: 480px) {
      .signup-card {
        padding: 32px 24px;
        border-radius: 20px;
      }
      .signup-header h2 {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>

<!-- Background Particles -->
<div class="particles">
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
</div>

<div class="signup-wrapper">

  <button class="back-link" onclick="goHome()">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
    </svg>
    Back to Home
  </button>

  <div class="signup-card">

    <div class="signup-header">
      <div class="logo-icon">🚀</div>
      <h2>Create Account</h2>
      <p>Join SmartInvest and start growing your wealth</p>
    </div>

    <form id="signupForm">

      <div class="form-group">
        <label>Username</label>
        <input id="username" placeholder="Choose a username" required>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input id="email" type="email" placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input id="password" type="password" placeholder="Min 6 characters" required>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input id="confirm" type="password" placeholder="Confirm your password" required>
      </div>

      <button type="submit" class="signup-btn">Create Account</button>

      <p id="result"></p>

    </form>

    <div class="divider"><span>OR</span></div>

    <div class="login-link">
      Already have an account? <a onclick="goLogin()">Sign In</a>
    </div>

  </div>

</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { ref, set, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/////////////////////////////////////////////////////
// EMAILJS INIT
/////////////////////////////////////////////////////
emailjs.init("adbMnb80leKvWnxdc");

function notifyAdmin(subject, message) {
  emailjs.send("service_eud67cl", "template_xmmwgim", {
    subject: subject,
    message: message
  }).then(() => {
    console.log("Signup notification sent");
  }).catch((err) => {
    console.error("Email failed:", err);
  });
}

document.getElementById("signupForm").onsubmit = async function(event) {
  event.preventDefault();
  
  let username = document.getElementById("username").value.trim();
  let email = document.getElementById("email").value.trim();
  let password = document.getElementById("password").value.trim();
  let confirm = document.getElementById("confirm").value.trim();
  let result = document.getElementById("result");
  
  if (!username || !email || !password || !confirm) {
    result.className = "show error";
    result.innerText = "❌ Please fill all fields!";
    return false;
  }
  
  if (password !== confirm) {
    result.className = "show error";
    result.innerText = "❌ Passwords do not match!";
    return false;
  }
  
  if (password.length < 6) {
    result.className = "show error";
    result.innerText = "❌ Password must be 6+ characters!";
    return false;
  }
  
  result.className = "show loading";
  result.innerText = "⏳ Creating account...";
  
  try {
    const userSnapshot = await get(ref(db, 'users/' + username));
    if (userSnapshot.exists()) {
      result.className = "show error";
      result.innerText = "❌ Username already taken!";
      return false;
    }
    
    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;
    
    result.className = "show loading";
    result.innerText = "⏳ Saving your data...";
    
    // Generate unique account ID
    let accountId = "eP" + Math.floor(100000 + Math.random() * 900000);
    
    await set(ref(db, 'users/' + username), {
      uid: user.uid,
      username: username,
      email: email,
      accountId: accountId,
      balance: 0,
      pending: 0,
      plan: "None",
      wallet: "",
      image: "",
      role: username === "admin" ? "admin" : "user",
      adminFlags: {
        canInvest: true,
        canWithdraw: true,
        blockReason: ""
      },
      createdAt: Date.now()
    });
    
    // ===== SEND SIGNUP NOTIFICATION =====
    notifyAdmin(
      "🆕 New User Signup — " + username,
      "New user just registered!\n\n" +
      "Username: " + username +
      "\nEmail: " + email +
      "\nAccount ID: " + accountId +
      "\nTime: " + new Date().toLocaleString() +
      "\nRole: " + (username === "admin" ? "Admin" : "User")
    );
    
    result.className = "show success";
    result.innerText = `✅ Account created! Your ID: ${accountId}\nRedirecting...`;
    
    setTimeout(() => {
      window.location.href = "login.html";
    }, 2000);
    
  } catch (error) {
    result.className = "show error";
    
    if (error.code === "auth/email-already-in-use") {
      result.innerText = "❌ Email already used. Try logging in.";
    } else if (error.code === "auth/invalid-email") {
      result.innerText = "❌ Invalid email.";
    } else if (error.code === "auth/weak-password") {
      result.innerText = "❌ Password too weak.";
    } else if (error.code === "auth/too-many-requests") {
      result.innerText = "❌ Too many tries. Wait 10 minutes.";
    } else {
      result.innerText = "❌ Error: " + error.message;
    }
  }
  
  return false;
};

function goHome() { window.location.href = "index.html"; }
function goLogin() { window.location.href = "login.html"; }

window.goHome = goHome;
window.goLogin = goLogin;
</script>

</body>
 </html>
