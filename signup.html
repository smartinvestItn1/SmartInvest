<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <button onclick="goHome()">🏠 Home</button>

  <form onsubmit="signup(event)">

    <h2>Create Account</h2>

    <input id="username" placeholder="Username" required><br>
    <input id="email" placeholder="Email" required><br>

    <input id="password" type="password" placeholder="Password" required><br>
    <input id="confirm" type="password" placeholder="Confirm Password" required><br>

    <button type="submit">Sign Up</button>

  </form>

  <p onclick="goLogin()" class="link">
    Already have an account? Login
  </p>

</div>

<script>

function signup(event) {
  event.preventDefault();

  let username = document.getElementById("username").value.trim();
  let email = document.getElementById("email").value.trim();
  let password = document.getElementById("password").value.trim();
  let confirm = document.getElementById("confirm").value.trim();

  if (!username || !email || !password || !confirm) {
    alert("Please fill all fields");
    return;
  }

  if (password !== confirm) {
    alert("Passwords do not match");
    return;
  }

  /////////////////////////////////////////////////////
  // LOCALSTORAGE REMOVED (NO SAVING ANYMORE)
  /////////////////////////////////////////////////////

  alert("Signup system not connected yet");

  window.location.replace("login.html");
}

function goHome() {
  window.location.href = "index.html";
}

function goLogin() {
  window.location.href = "login.html";
}

</script>

</body>
</html>
