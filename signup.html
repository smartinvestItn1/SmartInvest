<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <button onclick="window.location.href='index.html'">🏠 Home</button>
  
  <form id="signupForm">
    <h2>Create Account</h2>
    <input id="username" placeholder="Username" required><br>
    <input id="email" type="email" placeholder="Email" required><br>
    <input id="password" type="password" placeholder="Password (min 6 chars)" required><br>
    <input id="confirm" type="password" placeholder="Confirm Password" required><br>
    <button type="submit" id="signupBtn">Sign Up</button>
    <p id="result" style="color:red; font-weight:bold; margin-top:10px;"></p>
  </form>
  
  <p onclick="window.location.href='login.html'" style="color:blue; text-decoration:underline; cursor:pointer;">
    Already have an account? Login
  </p>
</div>

<script type="module">
// Firebase imports
import { auth, db } from "./firebase.js";
import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Get elements
const form = document.getElementById("signupForm");
const result = document.getElementById("result");

// Attach event listener DIRECTLY (no window. assignment needed)
form.onsubmit = async function(event) {
  event.preventDefault();
  
  // Show loading
  result.style.color = "blue";
  result.innerText = "Creating account... Please wait";
  
  try {
    // Get values
    let username = document.getElementById("username").value.trim();
    let email = document.getElementById("email").value.trim();
    let password = document.getElementById("password").value.trim();
    let confirm = document.getElementById("confirm").value.trim();
    
    // Validation
    if (!username || !email || !password || !confirm) {
      result.style.color = "red";
      result.innerText = "Please fill all fields";
      return false;
    }
    
    if (password !== confirm) {
      result.style.color = "red";
      result.innerText = "Passwords do not match";
      return false;
    }
    
    if (password.length < 6) {
      result.style.color = "red";
      result.innerText = "Password must be at least 6 characters";
      return false;
    }
    
    // Check username exists
    result.innerText = "Checking username...";
    const q = query(collection(db, "users"), where("username", "==", username));
    const querySnapshot = await getDocs(q);
    
    if (!querySnapshot.empty) {
      result.style.color = "red";
      result.innerText = "Username already taken";
      return false;
    }
    
    // Create Firebase Auth user
    result.innerText = "Creating your account...";
    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;
    
    // Save to Firestore
    result.innerText = "Saving your data...";
    await addDoc(collection(db, "users"), {
      uid: user.uid,
      username: username,
      email: email,
      balance: 0,
      pending: 0,
      plan: "None",
      wallet: "",
      image: "",
      role: "user",
      createdAt: Date.now()
    });
    
    // SUCCESS!
    result.style.color = "green";
    result.innerText = "✅ Account created! Redirecting to login...";
    
    setTimeout(() => {
      window.location.href = "login.html";
    }, 1500);
    
  } catch (error) {
    result.style.color = "red";
    
    let msg = error.message;
    if (error.code === "auth/email-already-in-use") msg = "This email is already registered. Please login instead.";
    if (error.code === "auth/invalid-email") msg = "Invalid email address";
    if (error.code === "auth/weak-password") msg = "Password is too weak. Use at least 6 characters.";
    if (error.code === "auth/too-many-requests") msg = "Too many attempts. Wait 10 minutes and try again.";
    if (error.code === "auth/network-request-failed") msg = "No internet connection. Check your network.";
    
    result.innerText = "❌ " + msg;
    console.error(error);
  }
  
  return false; // Prevent form submission
};
</script>

</body>
</html>
