<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transfer — SmartInvest</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    if (window.history && window.history.pushState) {
      window.history.pushState(null, null, window.location.href);
      window.onpopstate = function() {
        window.history.pushState(null, null, window.location.href);
      };
    }
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-weight: 700 !important;
    }

    body {
      background: #0f0f1a;
      color: #e8e8ec;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    /* Background particles */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(51, 181, 229, 0.12);
      border-radius: 50%;
      animation: float 15s infinite ease-in-out;
    }

    .particle:nth-child(1) { left: 10%; top: 80%; animation-delay: 0s; }
    .particle:nth-child(2) { left: 20%; top: 20%; animation-delay: 2s; }
    .particle:nth-child(3) { left: 35%; top: 60%; animation-delay: 4s; }
    .particle:nth-child(4) { left: 50%; top: 10%; animation-delay: 6s; }
    .particle:nth-child(5) { left: 65%; top: 70%; animation-delay: 8s; }
    .particle:nth-child(6) { left: 80%; top: 30%; animation-delay: 10s; }
    .particle:nth-child(7) { left: 90%; top: 85%; animation-delay: 12s; }
    .particle:nth-child(8) { left: 15%; top: 40%; animation-delay: 14s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.3; }
      50% { transform: translateY(-40px) scale(1.5); opacity: 0.8; }
    }

    .transfer-wrapper {
      position: relative;
      z-index: 1;
      max-width: 480px;
      margin: 0 auto;
      padding: 20px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #666680;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 28px;
      transition: color 0.2s ease;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    .back-link:hover {
      color: #ffbb33;
    }

    .back-link svg {
      width: 16px;
      height: 16px;
    }

    .transfer-card {
      background: rgba(25, 25, 40, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 24px;
      padding: 36px 32px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    .transfer-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .transfer-header .logo-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #33b5e5, #2a9fd6);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 24px;
    }

    .transfer-header h2 {
      color: #fff;
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .transfer-header p {
      color: #666680;
      margin: 8px 0 0 0;
      font-size: 14px;
    }

    .balance-display {
      background: rgba(15, 15, 30, 0.6);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(10px);
    }

    .balance-display h3 {
      color: #8888a0;
      margin: 0 0 8px 0;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
    }

    .balance-display p {
      color: #00c851;
      margin: 0;
      font-size: 28px;
      font-weight: 700;
    }

    .info-box {
      background: rgba(51, 181, 229, 0.08);
      border: 1px solid rgba(51, 181, 229, 0.25);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
    }

    .info-box p {
      margin: 0;
      color: #33b5e5;
      font-size: 13px;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      color: #8888a0;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      background: rgba(15, 15, 30, 0.6);
      color: #fff;
      font-size: 15px;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
      transition: all 0.25s ease;
    }

    .form-input::placeholder {
      color: #444460;
    }

    .form-input:focus {
      outline: none;
      border-color: #33b5e5;
      box-shadow: 0 0 0 3px rgba(51, 181, 229, 0.1);
      background: rgba(15, 15, 30, 0.8);
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(15, 15, 30, 0.8);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
      font-family: 'Inter', sans-serif;
      position: relative;
      overflow: hidden;
      letter-spacing: 0.3px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 15px rgba(51, 181, 229, 0.15), inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .submit-btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
      transition: left 0.5s ease;
    }

    .submit-btn:hover::before {
      left: 100%;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(51, 181, 229, 0.3), 0 8px 25px rgba(0,0,0,0.2);
      border-color: rgba(51, 181, 229, 0.4);
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    .submit-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
      filter: grayscale(100%) brightness(0.6);
      border-color: rgba(255, 255, 255, 0.03) !important;
      background: rgba(10, 10, 20, 0.95) !important;
      color: #333340 !important;
    }

    #result {
      text-align: center;
      padding: 14px 16px;
      border-radius: 10px;
      margin-top: 20px;
      font-weight: 700;
      font-size: 13px;
      display: none;
      font-family: 'Inter', sans-serif;
    }

    #result.show {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #result.success {
      background: rgba(0, 200, 81, 0.12);
      color: #00c851;
      border: 1px solid rgba(0, 200, 81, 0.25);
    }

    #result.error {
      background: rgba(255, 68, 68, 0.12);
      color: #ff4444;
      border: 1px solid rgba(255, 68, 68, 0.25);
    }

    #result.loading {
      background: rgba(51, 181, 229, 0.12);
      color: #33b5e5;
      border: 1px solid rgba(51, 181, 229, 0.25);
    }

    /* ===== SUCCESS ANIMATION OVERLAY ===== */
    .success-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 15, 26, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 24px;
      animation: overlayIn 0.4s ease forwards;
    }

    .success-overlay.active {
      display: flex;
    }

    @keyframes overlayIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .success-circle {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00c851, #00a844);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 40px rgba(0, 200, 81, 0.4), 0 0 80px rgba(0, 200, 81, 0.2);
      animation: circlePop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      position: relative;
    }

    @keyframes circlePop {
      0% { transform: scale(0); opacity: 0; }
      60% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .success-circle svg {
      width: 48px;
      height: 48px;
      color: #fff;
      stroke-dasharray: 50;
      stroke-dashoffset: 50;
      animation: checkDraw 0.5s ease 0.4s forwards;
    }

    @keyframes checkDraw {
      to { stroke-dashoffset: 0; }
    }

    .success-text {
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      opacity: 0;
      transform: translateY(10px);
      animation: textSlide 0.5s ease 0.6s forwards;
    }

    .success-subtext {
      color: #8888a0;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      opacity: 0;
      transform: translateY(10px);
      animation: textSlide 0.5s ease 0.8s forwards;
    }

    @keyframes textSlide {
      to { opacity: 1; transform: translateY(0); }
    }

    /* Confetti particles */
    .confetti-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: -1;
    }

    .confetti {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 2px;
      opacity: 0;
      animation: confettiFall 2.5s ease-out forwards;
    }

    .confetti:nth-child(1) { left: 10%; background: #00c851; animation-delay: 0s; transform: rotate(45deg); }
    .confetti:nth-child(2) { left: 20%; background: #33b5e5; animation-delay: 0.1s; transform: rotate(15deg); }
    .confetti:nth-child(3) { left: 30%; background: #ffbb33; animation-delay: 0.2s; transform: rotate(75deg); }
    .confetti:nth-child(4) { left: 40%; background: #ff4444; animation-delay: 0.15s; transform: rotate(30deg); }
    .confetti:nth-child(5) { left: 50%; background: #00c851; animation-delay: 0.25s; transform: rotate(60deg); }
    .confetti:nth-child(6) { left: 60%; background: #33b5e5; animation-delay: 0.05s; transform: rotate(20deg); }
    .confetti:nth-child(7) { left: 70%; background: #ffbb33; animation-delay: 0.3s; transform: rotate(50deg); }
    .confetti:nth-child(8) { left: 80%; background: #ff4444; animation-delay: 0.1s; transform: rotate(80deg); }
    .confetti:nth-child(9) { left: 90%; background: #00c851; animation-delay: 0.2s; transform: rotate(10deg); }
    .confetti:nth-child(10) { left: 15%; background: #33b5e5; animation-delay: 0.35s; transform: rotate(40deg); }
    .confetti:nth-child(11) { left: 25%; background: #ffbb33; animation-delay: 0.15s; transform: rotate(65deg); }
    .confetti:nth-child(12) { left: 75%; background: #ff4444; animation-delay: 0.25s; transform: rotate(25deg); }

    @keyframes confettiFall {
      0% { top: -10%; opacity: 1; transform: translateX(0) rotate(0deg); }
      100% { top: 110%; opacity: 0; transform: translateX(60px) rotate(720deg); }
    }

    .redirect-hint {
      margin-top: 12px;
      color: #444460;
      font-size: 12px;
      font-weight: 700;
      opacity: 0;
      animation: textSlide 0.5s ease 1s forwards;
    }

    @media (max-width: 480px) {
      .transfer-card {
        padding: 28px 20px;
      }
      .transfer-header h2 {
        font-size: 20px;
      }
      .success-text {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

<!-- Background Particles -->
<div class="particles">
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
</div>

<!-- Success Animation Overlay -->
<div class="success-overlay" id="successOverlay">
  <div class="confetti-container">
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
  </div>
  <div class="success-circle">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 13l4 4L19 7" />
    </svg>
  </div>
  <div class="success-text" id="successText">Transfer Successful!</div>
  <div class="success-subtext" id="successSubtext">Your money has been sent</div>
  <div class="redirect-hint">Redirecting to dashboard...</div>
</div>

<div class="transfer-wrapper">

  <button class="back-link" onclick="goBack()">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
    </svg>
    Back to Dashboard
  </button>

  <div class="transfer-card">

    <div class="transfer-header">
      <div class="logo-icon">💸</div>
      <h2>Transfer</h2>
      <p>Send money to another user</p>
    </div>

    <div class="balance-display">
      <h3>Your Balance</h3>
      <p>$<span id="userBalance">0.00</span></p>
    </div>

    <div class="info-box">
      <p>ℹ️ Enter the recipient's Account ID and amount to transfer. Transfers are instant and cannot be reversed.</p>
    </div>

    <div class="form-group">
      <label>Recipient Account ID</label>
      <input id="recipientId" class="form-input" type="text" placeholder="e.g., eP240198">
    </div>

    <div class="form-group">
      <label>Amount (USD)</label>
      <input id="transferAmount" class="form-input" type="number" placeholder="Enter amount">
    </div>

    <button class="submit-btn" onclick="submitTransfer()">Send Money</button>

    <p id="result"></p>

  </div>

</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { ref, get, update, push } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

let currentUsername = null;
let userData = null;
let userBalance = 0;

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  currentUsername = sessionStorage.getItem("loggedInUser");
  if (!currentUsername) {
    window.location.href = "login.html";
    return;
  }

  const userSnap = await get(ref(db, 'users/' + currentUsername));
  if (userSnap.exists()) {
    userData = userSnap.val();
    userBalance = userData.balance || 0;
    document.getElementById("userBalance").innerText = userBalance.toFixed(2);
  }
});

async function submitTransfer() {
  let recipientId = document.getElementById("recipientId").value.trim();
  let amount = Number(document.getElementById("transferAmount").value);
  let result = document.getElementById("result");

  if (!recipientId) {
    result.className = "show error";
    result.innerText = "❌ Enter recipient Account ID";
    return;
  }

  if (!amount || amount <= 0) {
    result.className = "show error";
    result.innerText = "❌ Enter valid amount";
    return;
  }

  if (amount > userBalance) {
    result.className = "show error";
    result.innerText = `❌ Insufficient balance! You have $${userBalance.toFixed(2)}`;
    return;
  }

  if (recipientId === (userData.accountId || "")) {
    result.className = "show error";
    result.innerText = "❌ Cannot transfer to yourself";
    return;
  }

  try {
    result.className = "show loading";
    result.innerText = "⏳ Processing transfer...";

    // Find recipient by account ID
    const usersSnap = await get(ref(db, 'users'));
    let recipientUsername = null;
    let recipientData = null;

    usersSnap.forEach((childSnap) => {
      let data = childSnap.val();
      if (data.accountId === recipientId) {
        recipientUsername = childSnap.key;
        recipientData = data;
      }
    });

    if (!recipientUsername) {
      result.className = "show error";
      result.innerText = "❌ Account ID not found";
      return;
    }

    if (!confirm(`Send $${amount} to ${recipientData.username || recipientId}?\n\nThis cannot be undone.`)) {
      result.style.display = "none";
      return;
    }

    // Perform transfer
    let senderNewBalance = userBalance - amount;
    let recipientNewBalance = (recipientData.balance || 0) + amount;

    let updates = {};
    updates['users/' + currentUsername + '/balance'] = senderNewBalance;
    updates['users/' + recipientUsername + '/balance'] = recipientNewBalance;

    // Save transfer record
    let transferRecord = {
      from: currentUsername,
      to: recipientUsername,
      fromAccountId: userData.accountId || "",
      toAccountId: recipientId,
      amount: amount,
      timestamp: Date.now(),
      status: "completed"
    };

    let transferRef = push(ref(db, 'transfers'));
    updates['transfers/' + transferRef.key] = transferRecord;

    await update(ref(db), updates);

    // Update local
    userBalance = senderNewBalance;
    document.getElementById("userBalance").innerText = userBalance.toFixed(2);
    document.getElementById("recipientId").value = "";
    document.getElementById("transferAmount").value = "";

    // Show success animation overlay
    showSuccessAnimation(amount, recipientData.username || recipientId);

  } catch (error) {
    result.className = "show error";
    result.innerText = "❌ Error: " + error.message;
  }
}

function showSuccessAnimation(amount, recipientName) {
  const overlay = document.getElementById("successOverlay");
  const successText = document.getElementById("successText");
  const successSubtext = document.getElementById("successSubtext");

  successText.innerText = `Transfer Successful!`;
  successSubtext.innerText = `$${amount} sent to ${recipientName}`;

  overlay.classList.add("active");

  // Redirect to dashboard after 3 seconds
  setTimeout(() => {
    window.location.href = "dashboard.html";
  }, 3000);
}

function goBack() {
  window.location.href = "dashboard.html";
}

window.goBack = goBack;
window.submitTransfer = submitTransfer;
</script>

</body>
    </html>
