<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Support</title>
  <link rel="stylesheet" href="style.css">
  
  <style>
    body {
      background: #0f0f1a;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .contact-container {
      max-width: 450px;
      width: 100%;
      padding: 20px;
    }
    
    .contact-card {
      background: #1a1a2e;
      border-radius: 20px;
      padding: 40px;
      border: 1px solid #2a2a4e;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }
    
    .contact-card h2 {
      color: #00c851;
      margin: 0 0 10px 0;
      font-size: 28px;
    }
    
    .contact-card .subtitle {
      color: #888;
      margin: 0 0 30px 0;
      font-size: 14px;
    }
    
    .whatsapp-icon {
      width: 80px;
      height: 80px;
      margin: 20px auto;
      background: linear-gradient(135deg, #25d366, #128c7e);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      box-shadow: 0 5px 20px rgba(37, 211, 102, 0.3);
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    
    .phone-number {
      color: #ffbb33;
      font-size: 24px;
      font-weight: bold;
      margin: 20px 0;
      letter-spacing: 1px;
    }
    
    .availability {
      color: #00c851;
      font-size: 14px;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .availability::before {
      content: "🟢";
      font-size: 10px;
    }
    
    .whatsapp-btn {
      width: 100%;
      padding: 18px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #25d366, #128c7e);
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 25px;
    }
    
    .whatsapp-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(37, 211, 102, 0.4);
    }
    
    .nav-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    
    .nav-btn {
      padding: 12px 24px;
      border-radius: 10px;
      border: 1px solid #2a2a4e;
      background: #0f3460;
      color: #aaa;
      font-size: 14px;
      cursor: pointer;
      transition: 0.3s;
    }
    
    .nav-btn:hover {
      background: #2a2a4e;
      color: white;
    }
    
    .info-box {
      background: rgba(51, 181, 229, 0.1);
      border: 1px solid #33b5e5;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 25px;
    }
    
    .info-box p {
      margin: 0;
      color: #33b5e5;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="contact-container">

  <div class="contact-card">

    <h2>📞 Customer Support</h2>
    <p class="subtitle">We're here to help you 24/7</p>

    <div class="whatsapp-icon">💬</div>

    <div class="availability">Available Now</div>

    <div class="phone-number">+234 916 916 5200</div>

    <div class="info-box">
      <p>💡 Click the button below to chat with us directly on WhatsApp. We typically respond within minutes.</p>
    </div>

    <button class="whatsapp-btn" onclick="openWhatsApp()">
      💬 Chat on WhatsApp
    </button>

    <div class="nav-buttons">
      <button class="nav-btn" onclick="goHome()">🏠 Home</button>
      <button class="nav-btn" onclick="goBack()">⬅ Dashboard</button>
    </div>

  </div>

</div>

<script>

function openWhatsApp() {
  let number = "2349169165200";

  let message = encodeURIComponent(
    "Hello SmartInvest Support, I need help with my account."
  );

  let url = `https://wa.me/${number}?text=${message}`;

  window.open(url, "_blank");
}

function goHome() {
  window.location.href = "index.html";
}

function goBack() {
  window.location.href = "dashboard.html";
}

</script>
</body>
  </html>
