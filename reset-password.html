<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — SmartInvest</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f0f1a;
      color: #e8e8ec;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .reset-wrapper {
      width: 100%;
      max-width: 420px;
    }

    .reset-card {
      background: rgba(25, 25, 40, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 24px;
      padding: 40px 36px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    .reset-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .reset-header .logo-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #ffbb33, #ff8800);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 24px;
    }

    .reset-header h2 {
      color: #fff;
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .reset-header p {
      color: #666680;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      color: #8888a0;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .password-wrapper {
      position: relative;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      background: rgba(15, 15, 30, 0.6);
      color: #fff;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      transition: all 0.25s ease;
    }

    .form-group input::placeholder {
      color: #444460;
    }

    .form-group input:focus {
      outline: none;
      border-color: #ffbb33;
      box-shadow: 0 0 0 3px rgba(255, 187, 51, 0.1);
      background: rgba(15, 15, 30, 0.8);
    }

    .password-wrapper input {
      padding-right: 50px;
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #666680;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s ease;
    }

    .toggle-password:hover {
      color: #ffbb33;
    }

    .toggle-password svg {
      width: 20px;
      height: 20px;
    }

    .reset-btn {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #ffbb33, #ff8800);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.25s ease;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.3px;
    }

    .reset-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 187, 51, 0.35);
    }

    .reset-btn:active {
      transform: scale(0.98);
    }

    #result {
      text-align: center;
      padding: 12px 16px;
      border-radius: 10px;
      margin-top: 16px;
      font-weight: 600;
      font-size: 13px;
      display: none;
      font-family: 'Inter', sans-serif;
    }

    #result.show {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #result.success {
      background: rgba(0, 200, 81, 0.12);
      color: #00c851;
      border: 1px solid rgba(0, 200, 81, 0.25);
    }

    #result.error {
      background: rgba(255, 68, 68, 0.12);
      color: #ff4444;
      border: 1px solid rgba(255, 68, 68, 0.25);
    }

    .login-link {
      text-align: center;
      margin-top: 24px;
      color: #666680;
      font-size: 14px;
    }

    .login-link a {
      color: #ffbb33;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .login-link a:hover {
      color: #ff8800;
    }

    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(255, 187, 51, 0.15);
      border-radius: 50%;
      animation: float 15s infinite ease-in-out;
    }

    .particle:nth-child(1) { left: 10%; top: 80%; animation-delay: 0s; }
    .particle:nth-child(2) { left: 20%; top: 20%; animation-delay: 2s; }
    .particle:nth-child(3) { left: 35%; top: 60%; animation-delay: 4s; }
    .particle:nth-child(4) { left: 50%; top: 10%; animation-delay: 6s; }
    .particle:nth-child(5) { left: 65%; top: 70%; animation-delay: 8s; }
    .particle:nth-child(6) { left: 80%; top: 30%; animation-delay: 10s; }
    .particle:nth-child(7) { left: 90%; top: 85%; animation-delay: 12s; }
    .particle:nth-child(8) { left: 15%; top: 40%; animation-delay: 14s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.3; }
      50% { transform: translateY(-40px) scale(1.5); opacity: 0.8; }
    }

    .reset-wrapper {
      position: relative;
      z-index: 1;
    }

    @media (max-width: 480px) {
      .reset-card {
        padding: 32px 24px;
        border-radius: 20px;
      }
      .reset-header h2 {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>

<div class="particles">
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
</div>

<div class="reset-wrapper">

  <div class="reset-card">

    <div class="reset-header">
      <div class="logo-icon">🔐</div>
      <h2>Reset Password</h2>
      <p>Enter your new password below</p>
    </div>

    <form id="resetForm">

      <div class="form-group">
        <label>New Password</label>
        <div class="password-wrapper">
          <input id="new-password" type="password" placeholder="Min 6 characters" required>
          <button type="button" class="toggle-password" onclick="togglePassword()" title="Show/Hide Password">
            <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="reset-btn">Reset Password</button>

      <p id="result"></p>

    </form>

    <div class="login-link">
      Remember your password? <a onclick="goLogin()">Sign In</a>
    </div>

  </div>

</div>

<script type="module">
import { auth } from "./firebase.js";
import { confirmPasswordReset } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// Get the reset code from URL
const urlParams = new URLSearchParams(window.location.search);
const oobCode = urlParams.get('oobCode');

// Password toggle
window.togglePassword = function() {
  const passwordInput = document.getElementById("new-password");
  const eyeIcon = document.getElementById("eye-icon");
  
  if (passwordInput.type === "password") {
    passwordInput.type = "text";
    eyeIcon.innerHTML = `
      <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
    `;
  } else {
    passwordInput.type = "password";
    eyeIcon.innerHTML = `
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
    `;
  }
};

document.getElementById("resetForm").onsubmit = async function(event) {
  event.preventDefault();
  
  const newPassword = document.getElementById("new-password").value;
  const result = document.getElementById("result");
  
  if (newPassword.length < 6) {
    result.style.display = "block";
    result.className = "show error";
    result.innerText = "❌ Password must be 6+ characters!";
    return;
  }
  
  result.style.display = "block";
  result.className = "show loading";
  result.innerText = "⏳ Resetting password...";
  
  try {
    await confirmPasswordReset(auth, oobCode, newPassword);
    result.className = "show success";
    result.innerText = "✅ Password reset! Redirecting to login...";
    
    setTimeout(() => {
      window.location.href = "login.html";
    }, 2000);
    
  } catch (error) {
    result.style.display = "block";
    result.className = "show error";
    
    if (error.code === "auth/expired-action-code") {
      result.innerText = "❌ Link expired. Request a new one.";
    } else if (error.code === "auth/invalid-action-code") {
      result.innerText = "❌ Invalid link. Request a new one.";
    } else if (error.code === "auth/weak-password") {
      result.innerText = "❌ Password too weak.";
    } else {
      result.innerText = "❌ Error: " + error.message;
    }
  }
};

function goLogin() { window.location.href = "login.html"; }
window.goLogin = goLogin;
</script>

</body>
  </html>
