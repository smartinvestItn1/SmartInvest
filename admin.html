<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h2>Admin Dashboard</h2>

<input id="searchUser" placeholder="Search users..." onkeyup="loadUsers()">

<button onclick="setFilter('all')">All</button>
<button onclick="setFilter('pending')">Pending</button>
<button onclick="setFilter('approved')">Approved</button>
<button onclick="setFilter('rejected')">Rejected</button>

<h3>🔔 Notifications</h3>
<div id="notifications"></div>

<button onclick="logout()">Logout</button>

<hr>

<h3>👥 Users</h3>
<div id="usersList"></div>

<hr>

<h3>💰 Deposits</h3>
<div id="depositList"></div>

<hr>

<h3>📈 Investments</h3>
<div id="investList"></div>

<hr>

<h3>💸 Withdrawals</h3>
<div id="withdrawList"></div>
  <script type="module" src="firebase.js"></script>
<script type="module">

import { db } from "./firebase.js";
import {
  collection,
  getDocs,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

/////////////////////////////////////////////////////
// GLOBAL DATA
/////////////////////////////////////////////////////

let users = [];
let deposits = [];
let withdrawals = [];
let investments = [];
let notifications = [];

let filterStatus = "all";

/////////////////////////////////////////////////////
// LOAD DATA FROM FIREBASE
/////////////////////////////////////////////////////

async function loadData() {

  const usersSnap = await getDocs(collection(db, "users"));
  users = usersSnap.docs.map(d => ({ id: d.id, ...d.data() }));

  const depSnap = await getDocs(collection(db, "deposits"));
  deposits = depSnap.docs.map(d => ({ id: d.id, ...d.data() }));

  const witSnap = await getDocs(collection(db, "withdrawals"));
  withdrawals = witSnap.docs.map(d => ({ id: d.id, ...d.data() }));

  const invSnap = await getDocs(collection(db, "investments"));
  investments = invSnap.docs.map(d => ({ id: d.id, ...d.data() }));

  renderAll();
}

/////////////////////////////////////////////////////
// USERS
/////////////////////////////////////////////////////

function loadUsers() {

  let search = document.getElementById("searchUser").value.toLowerCase();

  let filtered = users.filter(u =>
    (u.username || "").toLowerCase().includes(search)
  );

  document.getElementById("usersList").innerHTML =
    filtered.map(u => `
      <div class="card">
        <p><b>${u.username}</b></p>
        <p>Balance: $${Number(u.balance || 0).toFixed(2)}</p>
      </div>
    `).join("");
}

/////////////////////////////////////////////////////
// DEPOSITS
/////////////////////////////////////////////////////

function loadDeposits() {

  let list = deposits.filter(d =>
    filterStatus === "all" ? true : d.status === filterStatus
  );

  document.getElementById("depositList").innerHTML =
    list.map(d => `
      <div class="card">
        <p><b>User:</b> ${d.user}</p>
        <p>Amount: $${d.amount}</p>
        <p>Status: ${d.status}</p>

        ${d.status === "pending" ? `
          <button onclick="approveDeposit('${d.id}', '${d.user}', ${d.amount})">Approve</button>
          <button onclick="rejectDeposit('${d.id}')">Reject</button>
        ` : ""}
      </div>
    `).join("");
}

async function approveDeposit(id, user, amount) {

  const userRef = users.find(u => u.username === user);

  if (!userRef) return;

  await updateDoc(doc(db, "users", userRef.id), {
    balance: Number(userRef.balance || 0) + Number(amount)
  });

  await updateDoc(doc(db, "deposits", id), {
    status: "approved"
  });

  loadData();
}

async function rejectDeposit(id) {
  await updateDoc(doc(db, "deposits", id), {
    status: "rejected"
  });

  loadData();
}

/////////////////////////////////////////////////////
// WITHDRAWALS
/////////////////////////////////////////////////////

function loadWithdrawals() {

  let list = withdrawals.filter(w =>
    filterStatus === "all" ? true : w.status === filterStatus
  );

  document.getElementById("withdrawList").innerHTML =
    list.map(w => `
      <div class="card">
        <p><b>User:</b> ${w.user}</p>
        <p>Amount: $${w.amount}</p>
        <p>Status: ${w.status}</p>

        ${w.status === "pending" ? `
          <button onclick="approveWithdraw('${w.id}', '${w.user}', ${w.amount})">Approve</button>
          <button onclick="rejectWithdraw('${w.id}')">Reject</button>
        ` : ""}
      </div>
    `).join("");
}

async function approveWithdraw(id, user, amount) {

  const userRef = users.find(u => u.username === user);

  if (!userRef) return;

  if (userRef.balance < amount) return alert("Insufficient balance");

  await updateDoc(doc(db, "users", userRef.id), {
    balance: Number(userRef.balance) - Number(amount)
  });

  await updateDoc(doc(db, "withdrawals", id), {
    status: "approved"
  });

  loadData();
}

async function rejectWithdraw(id) {
  await updateDoc(doc(db, "withdrawals", id), {
    status: "rejected"
  });

  loadData();
}

/////////////////////////////////////////////////////
// INVESTMENTS
/////////////////////////////////////////////////////

function loadInvestments() {
  document.getElementById("investList").innerHTML =
    investments.map(i => `
      <div class="card">
        <p><b>User:</b> ${i.user}</p>
        <p>Plan: ${i.plan}</p>
        <p>Amount: $${i.amount}</p>
        <p>Status: ${i.status}</p>
      </div>
    `).join("");
}

/////////////////////////////////////////////////////
// FILTER
/////////////////////////////////////////////////////

function setFilter(status) {
  filterStatus = status;
  loadDeposits();
  loadWithdrawals();
}

/////////////////////////////////////////////////////
// LOGOUT
/////////////////////////////////////////////////////

function logout() {
  window.location.replace("login.html");
}

/////////////////////////////////////////////////////
// RENDER ALL
/////////////////////////////////////////////////////

function renderAll() {
  loadUsers();
  loadDeposits();
  loadInvestments();
  loadWithdrawals();
}

window.loadUsers = loadUsers;
window.setFilter = setFilter;
window.logout = logout;
window.approveDeposit = approveDeposit;
window.rejectDeposit = rejectDeposit;
window.approveWithdraw = approveWithdraw;
window.rejectWithdraw = rejectWithdraw;

loadData();

</script>

</body>
</html>
