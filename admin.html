<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h2>Admin Dashboard</h2>

<input id="searchUser" placeholder="Search users..." onkeyup="loadUsers()">

<button onclick="setFilter('all')">All</button>
<button onclick="setFilter('pending')">Pending</button>
<button onclick="setFilter('approved')">Approved</button>
<button onclick="setFilter('rejected')">Rejected</button>

<h3>🔔 Notifications</h3>
<div id="notifications"></div>

<button onclick="logout()">Logout</button>

<hr>

<h3>👥 Users</h3>
<div id="usersList"></div>

<hr>

<h3>💰 Deposits</h3>
<div id="depositList"></div>

<hr>

<h3>📈 Investments</h3>
<div id="investList"></div>

<hr>

<h3>💸 Withdrawals</h3>
<div id="withdrawList"></div>

<script type="module">
/////////////////////////////////////////////////////
// AUTH PROTECTION + IMPORTS
/////////////////////////////////////////////////////

import { auth, db } from "./firebase.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// ✅ AUTH CHECK: Kick out non-logged-in or non-admin users
onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.replace("login.html");
    return;
  }
  
  // Check if admin
  const role = sessionStorage.getItem("role");
  if (role !== "admin") {
    alert("Access denied. Admins only.");
    window.location.replace("dashboard.html");
    return;
  }
  
  // User is admin, load data
  loadData();
});

/////////////////////////////////////////////////////
// GLOBAL DATA
/////////////////////////////////////////////////////

let users = [];
let deposits = [];
let withdrawals = [];
let investments = [];
let notifications = [];

let filterStatus = "all";

/////////////////////////////////////////////////////
// LOAD DATA FROM REALTIME DATABASE
/////////////////////////////////////////////////////

async function loadData() {
  try {
    // Load users from Realtime Database
    const usersSnap = await get(ref(db, 'users'));
    if (usersSnap.exists()) {
      users = [];
      usersSnap.forEach((childSnap) => {
        users.push({ username: childSnap.key, ...childSnap.val() });
      });
    }
    
    // For deposits/withdrawals/investments - placeholder for now
    deposits = [];
    withdrawals = [];
    investments = [];
    
    renderAll();
  } catch (error) {
    console.error("Load error:", error);
    alert("Error loading data: " + error.message);
  }
}

/////////////////////////////////////////////////////
// USERS (WITH WALLET DISPLAY!)
/////////////////////////////////////////////////////

function loadUsers() {
  let search = document.getElementById("searchUser").value.toLowerCase();

  let filtered = users.filter(u =>
    (u.username || "").toLowerCase().includes(search)
  );

  document.getElementById("usersList").innerHTML =
    filtered.map(u => `
      <div class="card" style="margin-bottom:15px; padding:15px; border:1px solid #ddd; border-radius:8px;">
        <p><b>👤 ${u.username}</b></p>
        <p>📧 Email: ${u.email || 'N/A'}</p>
        <p>💰 Balance: $${Number(u.balance || 0).toFixed(2)}</p>
        <p>🏷️ Role: ${u.role || 'user'}</p>
        <p>💼 Wallet: ${u.wallet ? '<span style="color:green; font-weight:bold;">' + u.wallet + '</span>' : '<span style="color:red;">❌ Not set</span>'}</p>
        <p>📅 Joined: ${u.createdAt ? new Date(u.createdAt).toLocaleDateString() : 'N/A'}</p>
      </div>
    `).join("");
}

/////////////////////////////////////////////////////
// DEPOSITS
/////////////////////////////////////////////////////

function loadDeposits() {
  document.getElementById("depositList").innerHTML = 
    deposits.length === 0 ? 
    '<p>No deposits yet.</p>' :
    deposits.map(d => `
      <div class="card">
        <p><b>User:</b> ${d.user}</p>
        <p>Amount: $${d.amount}</p>
        <p>Status: ${d.status}</p>
      </div>
    `).join("");
}

/////////////////////////////////////////////////////
// WITHDRAWALS
/////////////////////////////////////////////////////

function loadWithdrawals() {
  document.getElementById("withdrawList").innerHTML = 
    withdrawals.length === 0 ? 
    '<p>No withdrawals yet.</p>' :
    withdrawals.map(w => `
      <div class="card">
        <p><b>User:</b> ${w.user}</p>
        <p>Amount: $${w.amount}</p>
        <p>Status: ${w.status}</p>
      </div>
    `).join("");
}

/////////////////////////////////////////////////////
// INVESTMENTS
/////////////////////////////////////////////////////

function loadInvestments() {
  document.getElementById("investList").innerHTML = 
    investments.length === 0 ? 
    '<p>No investments yet.</p>' :
    investments.map(i => `
      <div class="card">
        <p><b>User:</b> ${i.user}</p>
        <p>Plan: ${i.plan}</p>
        <p>Amount: $${i.amount}</p>
        <p>Status: ${i.status}</p>
      </div>
    `).join("");
}

/////////////////////////////////////////////////////
// FILTER
/////////////////////////////////////////////////////

function setFilter(status) {
  filterStatus = status;
  loadDeposits();
  loadWithdrawals();
}

/////////////////////////////////////////////////////
// LOGOUT
/////////////////////////////////////////////////////

async function logout() {
  try {
    await signOut(auth);
    sessionStorage.clear();
    window.location.replace("login.html");
  } catch (error) {
    console.error("Logout error:", error);
  }
}

/////////////////////////////////////////////////////
// RENDER ALL
/////////////////////////////////////////////////////

function renderAll() {
  loadUsers();
  loadDeposits();
  loadInvestments();
  loadWithdrawals();
}

window.loadUsers = loadUsers;
window.setFilter = setFilter;
window.logout = logout;

</script>

</body>
</html>
