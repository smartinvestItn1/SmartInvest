<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Prevent back button after logout -->
  <script>
    if (window.history && window.history.pushState) {
      window.history.pushState(null, null, window.location.href);
      window.onpopstate = function() {
        window.history.pushState(null, null, window.location.href);
      };
    }
  </script>
  
  <style>
    /* DARK THEME */
    body {
      background: #0f0f1a;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }
    
    .admin-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    
    .admin-header {
      text-align: center;
      padding: 30px 0;
    }
    
    .admin-header h2 {
      color: #ff4444;
      margin: 0;
      font-size: 32px;
    }
    
    .admin-header p {
      color: #888;
      margin: 10px 0 0 0;
    }
    
    .logout-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #ff4444;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }
    
    .logout-btn:hover {
      background: #cc0000;
    }
    
    .section-card {
      background: #1a1a2e;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 25px;
      border: 1px solid #2a2a4e;
    }
    
    .section-card h3 {
      color: #ffbb33;
      margin: 0 0 20px 0;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .search-box {
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #0f3460;
      color: white;
      font-size: 16px;
      margin-bottom: 20px;
      box-sizing: border-box;
    }
    
    .search-box:focus {
      outline: none;
      border-color: #ffbb33;
    }
    
    .filter-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    
    .filter-tab {
      background: #0f3460;
      border: 1px solid #2a2a4e;
      color: #aaa;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }
    
    .filter-tab:hover, .filter-tab.active {
      background: #33b5e5;
      color: white;
    }
    
    .user-card {
      background: #0f0f1a;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      border: 1px solid #2a2a4e;
    }
    
    .user-card h4 {
      color: #00c851;
      margin: 0 0 10px 0;
    }
    
    .user-card p {
      color: #aaa;
      margin: 5px 0;
      font-size: 14px;
    }
    
    .user-card .balance {
      color: #ffbb33;
      font-size: 18px;
      font-weight: bold;
    }
    
    .toggle-row {
      display: flex;
      gap: 15px;
      margin-top: 15px;
      flex-wrap: wrap;
    }
    
    .toggle-btn {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }
    
    .toggle-btn.enabled {
      background: #00c851;
      color: white;
    }
    
    .toggle-btn.disabled {
      background: #ff4444;
      color: white;
    }
    
    .toggle-btn:hover {
      transform: scale(1.05);
    }
    
    .deposit-card, .withdraw-card {
      background: #0f0f1a;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      border: 1px solid #2a2a4e;
    }
    
    .status-badge {
      display: inline-block;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
    }
    
    .status-badge.pending {
      background: rgba(255, 187, 51, 0.2);
      color: #ffbb33;
      border: 1px solid #ffbb33;
    }
    
    .status-badge.approved {
      background: rgba(0, 200, 81, 0.2);
      color: #00c851;
      border: 1px solid #00c851;
    }
    
    .status-badge.rejected {
      background: rgba(255, 68, 68, 0.2);
      color: #ff4444;
      border: 1px solid #ff4444;
    }
    
    .action-btn {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      margin-right: 10px;
      transition: 0.3s;
    }
    
    .approve-btn {
      background: #00c851;
      color: white;
    }
    
    .reject-btn {
      background: #ff4444;
      color: white;
    }
    
    .action-btn:hover {
      transform: translateY(-2px);
    }
    
    .no-data {
      text-align: center;
      color: #666;
      padding: 30px;
    }
    
    .wallet-address {
      color: #33b5e5;
      word-break: break-all;
      font-family: monospace;
      font-size: 12px;
    }
    
    .notification-box {
      background: #0f0f1a;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 10px;
      border-left: 4px solid #ffbb33;
    }
    
    .notification-box p {
      margin: 0;
      color: #aaa;
      font-size: 14px;
    }
    
    .notification-box .time {
      color: #666;
      font-size: 12px;
      margin-top: 5px;
    }
  </style>
</head>

<body>

<div class="admin-container">

  <button class="logout-btn" onclick="logout()">🚪 Logout</button>

  <div class="admin-header">
    <h2>🔐 Admin Dashboard</h2>
    <p>Manage users, deposits, withdrawals & investments</p>
  </div>

  <!-- NOTIFICATIONS -->
  <div class="section-card">
    <h3>🔔 Notifications</h3>
    <div id="notifications">
      <p class="no-data">Loading notifications...</p>
    </div>
  </div>

  <!-- USER CONTROL (NEW!) -->
  <div class="section-card">
    <h3>👥 User Control</h3>
    <input id="searchUser" class="search-box" placeholder="Search users by username..." onkeyup="loadUsers()">
    <div id="usersList">
      <p class="no-data">Loading users...</p>
    </div>
  </div>

  <!-- DEPOSITS -->
  <div class="section-card">
    <h3>💰 Deposits</h3>
    <div class="filter-tabs">
      <button class="filter-tab active" onclick="setFilter('all')">All</button>
      <button class="filter-tab" onclick="setFilter('pending')">Pending</button>
      <button class="filter-tab" onclick="setFilter('approved')">Approved</button>
      <button class="filter-tab" onclick="setFilter('rejected')">Rejected</button>
    </div>
    <div id="depositList">
      <p class="no-data">Loading deposits...</p>
    </div>
  </div>

  <!-- WITHDRAWALS -->
  <div class="section-card">
    <h3>💸 Withdrawals</h3>
    <div class="filter-tabs">
      <button class="filter-tab active" onclick="setWithdrawFilter('all')">All</button>
      <button class="filter-tab" onclick="setWithdrawFilter('pending')">Pending</button>
      <button class="filter-tab" onclick="setWithdrawFilter('approved')">Approved</button>
      <button class="filter-tab" onclick="setWithdrawFilter('rejected')">Rejected</button>
    </div>
    <div id="withdrawList">
      <p class="no-data">Loading withdrawals...</p>
    </div>
  </div>

  <!-- INVESTMENTS -->
  <div class="section-card">
    <h3>📈 Investments</h3>
    <div id="investList">
      <p class="no-data">Loading investments...</p>
    </div>
  </div>

</div>

<script type="module">
/////////////////////////////////////////////////////
// AUTH PROTECTION + IMPORTS - EXACTLY AS YOU HAD IT
/////////////////////////////////////////////////////

import { auth, db } from "./firebase.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { ref, get, update, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// ✅ AUTH CHECK
onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }
  
  const role = sessionStorage.getItem("role");
  if (role !== "admin") {
    alert("Access denied. Admins only.");
    window.location.href = "dashboard.html";
    return;
  }
  
  loadData();
});

/////////////////////////////////////////////////////
// GLOBAL DATA - EXACTLY AS YOU HAD IT
/////////////////////////////////////////////////////

let users = [];
let deposits = [];
let withdrawals = [];
let investments = [];

let filterStatus = "all";
let withdrawFilterStatus = "all";

/////////////////////////////////////////////////////
// LOAD DATA - EXACTLY AS YOU HAD IT
/////////////////////////////////////////////////////

async function loadData() {
  try {
    // Load users
    const usersSnap = await get(ref(db, 'users'));
    users = [];
    if (usersSnap.exists()) {
      usersSnap.forEach((childSnap) => {
        users.push({ username: childSnap.key, ...childSnap.val() });
      });
    }
    
    // Load deposits
    const depSnap = await get(ref(db, 'deposits'));
    deposits = [];
    if (depSnap.exists()) {
      depSnap.forEach((childSnap) => {
        deposits.push({ id: childSnap.key, ...childSnap.val() });
      });
    }
    
    // Load withdrawals
    const witSnap = await get(ref(db, 'withdrawals'));
    withdrawals = [];
    if (witSnap.exists()) {
      witSnap.forEach((childSnap) => {
        withdrawals.push({ id: childSnap.key, ...childSnap.val() });
      });
    }
    
    // Load investments
    const invSnap = await get(ref(db, 'investments'));
    investments = [];
    if (invSnap.exists()) {
      invSnap.forEach((childSnap) => {
        investments.push({ id: childSnap.key, ...childSnap.val() });
      });
    }
    
    renderAll();
  } catch (error) {
    console.error("Load error:", error);
    alert("Error loading data: " + error.message);
  }
}

/////////////////////////////////////////////////////
// USERS - WITH ADMIN FLAGS CONTROL (NEW!)
/////////////////////////////////////////////////////

function loadUsers() {
  let search = document.getElementById("searchUser").value.toLowerCase();
  let filtered = users.filter(u => (u.username || "").toLowerCase().includes(search));

  document.getElementById("usersList").innerHTML =
    filtered.length === 0 ? '<p class="no-data">No users found.</p>' :
    filtered.map(u => {
      // Get admin flags or default
      let flags = u.adminFlags || { canInvest: true, canWithdraw: true, blockReason: "" };
      
      return `
      <div class="user-card">
        <h4>👤 ${u.username}</h4>
        <p>📧 Email: ${u.email || 'N/A'}</p>
        <p class="balance">💰 Balance: $${Number(u.balance || 0).toFixed(2)}</p>
        <p>🏷️ Role: ${u.role || 'user'}</p>
        <p>🆔 Account ID: ${u.accountId || 'N/A'}</p>
        <p>💼 Wallet: ${u.wallet ? '<span class="wallet-address">' + u.wallet + '</span>' : '<span style="color:#ff4444;">❌ Not set</span>'}</p>
        
        <div class="toggle-row">
          <button class="toggle-btn ${flags.canInvest !== false ? 'enabled' : 'disabled'}" 
            onclick="toggleInvest('${u.username}', ${flags.canInvest !== false})">
            ${flags.canInvest !== false ? '✅ Invest ON' : '❌ Invest OFF'}
          </button>
          
          <button class="toggle-btn ${flags.canWithdraw !== false ? 'enabled' : 'disabled'}" 
            onclick="toggleWithdraw('${u.username}', ${flags.canWithdraw !== false})">
            ${flags.canWithdraw !== false ? '✅ Withdraw ON' : '❌ Withdraw OFF'}
          </button>
        </div>
        
        ${flags.blockReason ? `<p style="color:#ff4444; margin-top:10px;">📝 Reason: ${flags.blockReason}</p>` : ''}
        
        <div style="margin-top:15px;">
          <input type="text" id="blockReason_${u.username}" placeholder="Block reason (optional)" 
            style="padding:8px; border-radius:5px; border:1px solid #333; background:#0f3460; color:white; width:200px;">
          <button onclick="saveBlockReason('${u.username}')" 
            style="padding:8px 15px; background:#ffbb33; color:black; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">
            Save Reason
          </button>
        </div>
      </div>
    `}).join("");
}

/////////////////////////////////////////////////////
// TOGGLE INVEST (NEW!)
/////////////////////////////////////////////////////

window.toggleInvest = async function(username, currentState) {
  let newState = !currentState;
  let reason = prompt(newState ? "Enable investing for " + username + "?" : "Disable investing for " + username + "?\n\nEnter reason (optional):");
  
  if (reason === null) return; // Cancelled
  
  try {
    await update(ref(db, 'users/' + username + '/adminFlags'), {
      canInvest: newState,
      blockReason: reason || ""
    });
    
    alert(newState ? `✅ Investing enabled for ${username}` : `❌ Investing disabled for ${username}`);
    loadData();
  } catch (error) {
    alert("Error: " + error.message);
  }
};

/////////////////////////////////////////////////////
// TOGGLE WITHDRAW (NEW!)
/////////////////////////////////////////////////////

window.toggleWithdraw = async function(username, currentState) {
  let newState = !currentState;
  let reason = prompt(newState ? "Enable withdrawal for " + username + "?" : "Disable withdrawal for " + username + "?\n\nEnter reason (optional):");
  
  if (reason === null) return; // Cancelled
  
  try {
    await update(ref(db, 'users/' + username + '/adminFlags'), {
      canWithdraw: newState,
      blockReason: reason || ""
    });
    
    alert(newState ? `✅ Withdrawal enabled for ${username}` : `❌ Withdrawal disabled for ${username}`);
    loadData();
  } catch (error) {
    alert("Error: " + error.message);
  }
};

/////////////////////////////////////////////////////
// SAVE BLOCK REASON (NEW!)
/////////////////////////////////////////////////////

window.saveBlockReason = async function(username) {
  let reason = document.getElementById('blockReason_' + username).value;
  
  try {
    await update(ref(db, 'users/' + username + '/adminFlags'), {
      blockReason: reason
    });
    
    alert(`✅ Block reason saved for ${username}`);
    loadData();
  } catch (error) {
    alert("Error: " + error.message);
  }
};

/////////////////////////////////////////////////////
// DEPOSITS - EXACTLY AS YOU HAD IT
/////////////////////////////////////////////////////

function loadDeposits() {
  let list = deposits.filter(d => filterStatus === "all" ? true : d.status === filterStatus);

  document.getElementById("depositList").innerHTML =
    list.length === 0 ? '<p class="no-data">No deposits found.</p>' :
    list.map(d => `
      <div class="deposit-card">
        <p><b>👤 User:</b> ${d.user}</p>
        <p><b>💰 Amount:</b> $${d.amount}</p>
        <p><b>🪙 Coin:</b> ${d.coin}</p>
        <p><b>📊 Status:</b> <span class="status-badge ${d.status}">${d.status.toUpperCase()}</span></p>
        <p><b>📅 Time:</b> ${new Date(d.time).toLocaleString()}</p>
        
        ${d.status === "pending" ? `
          <button class="action-btn approve-btn" onclick="approveDeposit('${d.id}', '${d.user}', ${d.amount})">✅ Approve</button>
          <button class="action-btn reject-btn" onclick="rejectDeposit('${d.id}')">❌ Reject</button>
        ` : ""}
      </div>
    `).join("");
}

/////////////////////////////////////////////////////
// APPROVE DEPOSIT - EXACTLY AS YOU HAD IT
/////////////////////////////////////////////////////

window.approveDeposit = async function(depositId, username, amount) {
  if (!confirm(`Approve deposit of $${amount} for ${username}?`)) return;
  
  try {
    await update(ref(db, 'deposits/' + depositId), {
      status: "approved"
    });
    
    const userSnap = await get(ref(db, 'users/' + username));
    if (userSnap.exists()) {
      let currentBalance = userSnap.val().balance || 0;
      let newBalance = currentBalance + Number(amount);
      
      await update(ref(db, 'users/' + username), {
        balance: newBalance
      });
    }
    
    alert(`✅ Deposit approved! $${amount} added to ${username}'s balance.`);
    loadData();
    
  } catch (error) {
    alert("Error approving deposit: " + error.message);
    console.error(error);
  }
};

/////////////////////////////////////////////////////
// REJECT DEPOSIT - EXACTLY AS YOU HAD IT
/////////////////////////////////////////////////////

window.rejectDeposit = async function(depositId) {
  if (!confirm("Reject this deposit?")) return;
  
  try {
    await update(ref(db, 'deposits/' + depositId), {
      status: "rejected"
    });
    
    alert("❌ Deposit rejected.");
    loadData();
    
  } catch (error) {
    alert("Error rejecting deposit: " + error.message);
    console.error(error);
  }
};

/////////////////////////////////////////////////////
// WITHDRAWALS - EXACTLY AS YOU HAD IT
/////////////////////////////////////////////////////

function loadWithdrawals() {
  let list = withdrawals.filter(w => withdrawFilterStatus === "all" ? true : w.status === withdrawFilterStatus);

  document.getElementById("withdrawList").innerHTML =
    list.length === 0 ? '<p class="no-data">No withdrawals found.</p>' :
    list.map(w => `
      <div class="withdraw-card">
        <p><b>👤 User:</b> ${w.user}</p>
        <p><b>💰 Amount:</b> $${w.amount}</p>
        <p><b>💼 Wallet:</b> <span class="wallet-address">${w.wallet}</span></p>
        <p><b>📊 Status:</b> <span class="status-badge ${w.status}">${w.status.toUpperCase()}</span></p>
        <p><b>📅 Time:</b> ${new Date(w.time).toLocaleString()}</p>
        
        ${w.status === "pending" ? `
          <button class="action-btn approve-btn" onclick="approveWithdraw('${w.id}', '${w.user}', ${w.amount})">✅ Approve</button>
          <button class="action-btn reject-btn" onclick="rejectWithdraw('${w.id}')">❌ Reject</button>
        ` : ""}
      </div>
    `).join("");
}

/////////////////////////////////////////////////////
// APPROVE WITHDRAWAL - EXACTLY AS YOU HAD IT
/////////////////////////////////////////////////////

window.approveWithdraw = async function(withdrawId, username, amount) {
  if (!confirm(`Approve withdrawal of $${amount} for ${username}?`)) return;
  
  try {
    const userSnap = await get(ref(db, 'users/' + username));
    if (!userSnap.exists()) {
      alert("User not found!");
      return;
    }
    
    let currentBalance = userSnap.val().balance || 0;
    if (currentBalance < amount) {
      alert("❌ Insufficient balance! User doesn't have enough funds.");
      return;
    }
    
    await update(ref(db, 'withdrawals/' + withdrawId), {
      status: "approved"
    });
    
    let newBalance = currentBalance - Number(amount);
    await update(ref(db, 'users/' + username), {
      balance: newBalance
    });
    
    alert(`✅ Withdrawal approved! $${amount} deducted from ${username}'s balance.`);
    loadData();
    
  } catch (error) {
    alert("Error approving withdrawal: " + error.message);
    console.error(error);
  }
};

/////////////////////////////////////////////////////
// REJECT WITHDRAWAL - EXACTLY AS YOU HAD IT
/////////////////////////////////////////////////////

window.rejectWithdraw = async function(withdrawId) {
  if (!confirm("Reject this withdrawal?")) return;
  
  try {
    await update(ref(db, 'withdrawals/' + withdrawId), {
      status: "rejected"
    });
    
    alert("❌ Withdrawal rejected.");
    loadData();
    
  } catch (error) {
    alert("Error rejecting withdrawal: " + error.message);
    console.error(error);
  }
};

/////////////////////////////////////////////////////
// INVESTMENTS - EXACTLY AS YOU HAD IT
/////////////////////////////////////////////////////

function loadInvestments() {
  document.getElementById("investList").innerHTML = 
    investments.length === 0 ? 
    '<p class="no-data">No investments yet.</p>' :
    investments.map(i => `
      <div class="deposit-card">
        <p><b>👤 User:</b> ${i.user}</p>
        <p><b>📊 Plan:</b> ${i.plan}</p>
        <p><b>💰 Amount:</b> $${i.amount}</p>
        <p><b>📈 Profit:</b> ${(i.profitPercent * 100)}%</p>
        <p><b>⏱️ Duration:</b> ${i.hours} hours</p>
        <p><b>📊 Status:</b> <span class="status-badge ${i.status}">
  ${i.status.toUpperCase()}
</span></p>
       <p><b>📅 Time:</b> ${new Date(i.investTime).toLocaleString()}</p>
      </div>
    `).join("");
}
  /////////////////////////////////////////////////////
// NOTIFICATIONS (NEW!)
/////////////////////////////////////////////////////

function loadNotifications() {
  let pendingDeposits =
    deposits.filter(d => d.status === "pending").length;

  let pendingWithdrawals =
    withdrawals.filter(w => w.status === "pending").length;

  let notifHTML = "";

  if (pendingDeposits > 0) {
    notifHTML += `
      <div class="notification-box">
        <p>💰 ${pendingDeposits} pending deposit(s) waiting for approval</p>
        <p class="time">Check deposits section below</p>
      </div>
    `;
  }

  if (pendingWithdrawals > 0) {
    notifHTML += `
      <div class="notification-box">
        <p>💸 ${pendingWithdrawals} pending withdrawal(s) waiting for approval</p>
        <p class="time">Check withdrawals section below</p>
      </div>
    `;
  }

  if (notifHTML === "") {
    notifHTML = '<p class="no-data">No new notifications</p>';
  }

  document.getElementById("notifications").innerHTML = notifHTML;
}
  ///////////////////////////////////////////////////////
// FILTERS - EXACTLY AS YOU HAD IT
/////////////////////////////////////////////////////

function setFilter(status) {
  filterStatus = status;

  // Update active tab
  document.querySelectorAll('.filter-tabs')[0]
    .querySelectorAll('.filter-tab')
    .forEach(tab => {
      tab.classList.remove('active');
    });

  event.target.classList.add('active');

  loadDeposits();
}

function setWithdrawFilter(status) {
  withdrawFilterStatus = status;

  // Update active tab
  document.querySelectorAll('.filter-tabs')[1]
    .querySelectorAll('.filter-tab')
    .forEach(tab => {
      tab.classList.remove('active');
    });

  event.target.classList.add('active');

  loadWithdrawals();
  }
  /////////////////////////////////////////////////////
// LOGOUT
/////////////////////////////////////////////////////

async function logout() {
  try {
    await signOut(auth);
    sessionStorage.clear();
    window.location.href = "login.html";
  } catch (error) {
    console.error("Logout error:", error);
   }
  }
/////////////////////////////////////////////////////
// RENDER ALL
/////////////////////////////////////////////////////

function renderAll() {
  loadUsers();
  loadDeposits();
  loadInvestments();
  loadWithdrawals();
  loadNotifications();
}

window.setFilter = setFilter;
window.setWithdrawFilter = setWithdrawFilter;
window.logout = logout;

</script>
</body>
</html>
