<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Prevent back button after logout -->
  <script>
    if (window.history && window.history.pushState) {
      window.history.pushState(null, null, window.location.href);
      window.onpopstate = function() {
        window.history.pushState(null, null, window.location.href);
      };
    }
  </script>
</head>

<body>

<h2>Admin Dashboard</h2>

<input id="searchUser" placeholder="Search users..." onkeyup="loadUsers()">

<button onclick="setFilter('all')">All</button>
<button onclick="setFilter('pending')">Pending</button>
<button onclick="setFilter('approved')">Approved</button>
<button onclick="setFilter('rejected')">Rejected</button>

<h3>🔔 Notifications</h3>
<div id="notifications"></div>

<button onclick="logout()">Logout</button>

<hr>

<h3>👥 Users</h3>
<div id="usersList"></div>

<hr>

<h3>💰 Deposits</h3>
<div id="depositList"></div>

<hr>

<h3>📈 Investments</h3>
<div id="investList"></div>

<hr>

<h3>💸 Withdrawals</h3>
<div id="withdrawList"></div>

<script type="module">
/////////////////////////////////////////////////////
// AUTH PROTECTION + IMPORTS
/////////////////////////////////////////////////////

import { auth, db } from "./firebase.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { ref, get, update, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// ✅ AUTH CHECK
onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.replace("login.html");
    return;
  }
  
  const role = sessionStorage.getItem("role");
  if (role !== "admin") {
    alert("Access denied. Admins only.");
    window.location.replace("dashboard.html");
    return;
  }
  
  loadData();
});

/////////////////////////////////////////////////////
// GLOBAL DATA
/////////////////////////////////////////////////////

let users = [];
let deposits = [];
let withdrawals = [];
let investments = [];

let filterStatus = "all";

/////////////////////////////////////////////////////
// LOAD DATA FROM REALTIME DATABASE
/////////////////////////////////////////////////////

async function loadData() {
  try {
    // Load users
    const usersSnap = await get(ref(db, 'users'));
    users = [];
    if (usersSnap.exists()) {
      usersSnap.forEach((childSnap) => {
        users.push({ username: childSnap.key, ...childSnap.val() });
      });
    }
    
    // Load deposits
    const depSnap = await get(ref(db, 'deposits'));
    deposits = [];
    if (depSnap.exists()) {
      depSnap.forEach((childSnap) => {
        deposits.push({ id: childSnap.key, ...childSnap.val() });
      });
    }
    
    // Load withdrawals
    const witSnap = await get(ref(db, 'withdrawals'));
    withdrawals = [];
    if (witSnap.exists()) {
      witSnap.forEach((childSnap) => {
        withdrawals.push({ id: childSnap.key, ...childSnap.val() });
      });
    }
    
    investments = [];
    
    renderAll();
  } catch (error) {
    console.error("Load error:", error);
    alert("Error loading data: " + error.message);
  }
}

/////////////////////////////////////////////////////
// USERS (WITH WALLET)
/////////////////////////////////////////////////////

function loadUsers() {
  let search = document.getElementById("searchUser").value.toLowerCase();
  let filtered = users.filter(u => (u.username || "").toLowerCase().includes(search));

  document.getElementById("usersList").innerHTML =
    filtered.map(u => `
      <div class="card" style="margin-bottom:15px; padding:15px; border:1px solid #ddd; border-radius:8px;">
        <p><b>👤 ${u.username}</b></p>
        <p>📧 Email: ${u.email || 'N/A'}</p>
        <p>💰 Balance: $${Number(u.balance || 0).toFixed(2)}</p>
        <p>🏷️ Role: ${u.role || 'user'}</p>
        <p>💼 Wallet: ${u.wallet ? '<span style="color:green; font-weight:bold; word-break:break-all;">' + u.wallet + '</span>' : '<span style="color:red;">❌ Not set</span>'}</p>
      </div>
    `).join("");
}

/////////////////////////////////////////////////////
// DEPOSITS (WITH APPROVE/REJECT BUTTONS!)
/////////////////////////////////////////////////////

function loadDeposits() {
  let list = deposits.filter(d => filterStatus === "all" ? true : d.status === filterStatus);

  document.getElementById("depositList").innerHTML =
    list.length === 0 ? '<p>No deposits found.</p>' :
    list.map(d => `
      <div class="card" style="margin-bottom:15px; padding:15px; border:1px solid #ddd; border-radius:8px;">
        <p><b>👤 User:</b> ${d.user}</p>
        <p><b>💰 Amount:</b> $${d.amount}</p>
        <p><b>🪙 Coin:</b> ${d.coin}</p>
        <p><b>📊 Status:</b> <span style="color:${d.status === 'approved' ? 'green' : d.status === 'rejected' ? 'red' : 'orange'}; font-weight:bold;">${d.status.toUpperCase()}</span></p>
        <p><b>📅 Time:</b> ${new Date(d.time).toLocaleString()}</p>
        
        ${d.status === "pending" ? `
          <button onclick="approveDeposit('${d.id}', '${d.user}', ${d.amount})" style="background:green; color:white; padding:8px 15px; margin-right:10px; border:none; border-radius:5px;">✅ Approve</button>
          <button onclick="rejectDeposit('${d.id}')" style="background:red; color:white; padding:8px 15px; border:none; border-radius:5px;">❌ Reject</button>
        ` : ""}
      </div>
    `).join("");
}

/////////////////////////////////////////////////////
// APPROVE DEPOSIT (ADDS TO USER BALANCE!)
/////////////////////////////////////////////////////

window.approveDeposit = async function(depositId, username, amount) {
  if (!confirm(`Approve deposit of $${amount} for ${username}?`)) return;
  
  try {
    // 1. Update deposit status to "approved"
    await update(ref(db, 'deposits/' + depositId), {
      status: "approved"
    });
    
    // 2. Add amount to user's balance
    const userSnap = await get(ref(db, 'users/' + username));
    if (userSnap.exists()) {
      let currentBalance = userSnap.val().balance || 0;
      let newBalance = currentBalance + Number(amount);
      
      await update(ref(db, 'users/' + username), {
        balance: newBalance
      });
    }
    
    alert(`✅ Deposit approved! $${amount} added to ${username}'s balance.`);
    loadData(); // Refresh data
    
  } catch (error) {
    alert("Error approving deposit: " + error.message);
    console.error(error);
  }
};

/////////////////////////////////////////////////////
// REJECT DEPOSIT
/////////////////////////////////////////////////////

window.rejectDeposit = async function(depositId) {
  if (!confirm("Reject this deposit?")) return;
  
  try {
    await update(ref(db, 'deposits/' + depositId), {
      status: "rejected"
    });
    
    alert("❌ Deposit rejected.");
    loadData(); // Refresh data
    
  } catch (error) {
    alert("Error rejecting deposit: " + error.message);
    console.error(error);
  }
};

/////////////////////////////////////////////////////
// WITHDRAWALS (WITH APPROVE/REJECT)
/////////////////////////////////////////////////////

function loadWithdrawals() {
  let list = withdrawals.filter(w => filterStatus === "all" ? true : w.status === filterStatus);

  document.getElementById("withdrawList").innerHTML =
    list.length === 0 ? '<p>No withdrawals found.</p>' :
    list.map(w => `
      <div class="card" style="margin-bottom:15px; padding:15px; border:1px solid #ddd; border-radius:8px;">
        <p><b>👤 User:</b> ${w.user}</p>
        <p><b>💰 Amount:</b> $${w.amount}</p>
        <p><b>💼 Wallet:</b> ${w.wallet}</p>
        <p><b>📊 Status:</b> <span style="color:${w.status === 'approved' ? 'green' : w.status === 'rejected' ? 'red' : 'orange'}; font-weight:bold;">${w.status.toUpperCase()}</span></p>
        <p><b>📅 Time:</b> ${new Date(w.time).toLocaleString()}</p>
        
        ${w.status === "pending" ? `
          <button onclick="approveWithdraw('${w.id}', '${w.user}', ${w.amount})" style="background:green; color:white; padding:8px 15px; margin-right:10px; border:none; border-radius:5px;">✅ Approve</button>
          <button onclick="rejectWithdraw('${w.id}')" style="background:red; color:white; padding:8px 15px; border:none; border-radius:5px;">❌ Reject</button>
        ` : ""}
      </div>
    `).join("");
}

/////////////////////////////////////////////////////
// APPROVE WITHDRAWAL (DEDUCTS FROM BALANCE)
/////////////////////////////////////////////////////

window.approveWithdraw = async function(withdrawId, username, amount) {
  if (!confirm(`Approve withdrawal of $${amount} for ${username}?`)) return;
  
  try {
    // Check user balance first
    const userSnap = await get(ref(db, 'users/' + username));
    if (!userSnap.exists()) {
      alert("User not found!");
      return;
    }
    
    let currentBalance = userSnap.val().balance || 0;
    if (currentBalance < amount) {
      alert("❌ Insufficient balance! User doesn't have enough funds.");
      return;
    }
    
    // 1. Update withdrawal status to "approved"
    await update(ref(db, 'withdrawals/' + withdrawId), {
      status: "approved"
    });
    
    // 2. Deduct amount from user's balance
    let newBalance = currentBalance - Number(amount);
    await update(ref(db, 'users/' + username), {
      balance: newBalance
    });
    
    alert(`✅ Withdrawal approved! $${amount} deducted from ${username}'s balance.`);
    loadData(); // Refresh data
    
  } catch (error) {
    alert("Error approving withdrawal: " + error.message);
    console.error(error);
  }
};

/////////////////////////////////////////////////////
// REJECT WITHDRAWAL
/////////////////////////////////////////////////////

window.rejectWithdraw = async function(withdrawId) {
  if (!confirm("Reject this withdrawal?")) return;
  
  try {
    await update(ref(db, 'withdrawals/' + withdrawId), {
      status: "rejected"
    });
    
    alert("❌ Withdrawal rejected.");
    loadData(); // Refresh data
    
  } catch (error) {
    alert("Error rejecting withdrawal: " + error.message);
    console.error(error);
  }
};

/////////////////////////////////////////////////////
// INVESTMENTS
/////////////////////////////////////////////////////

function loadInvestments() {
  document.getElementById("investList").innerHTML = 
    investments.length === 0 ? 
    '<p>No investments yet.</p>' :
    investments.map(i => `
      <div class="card">
        <p><b>User:</b> ${i.user}</p>
        <p>Plan: ${i.plan}</p>
        <p>Amount: $${i.amount}</p>
        <p>Status: ${i.status}</p>
      </div>
    `).join("");
}

/////////////////////////////////////////////////////
// FILTER
/////////////////////////////////////////////////////

function setFilter(status) {
  filterStatus = status;
  loadDeposits();
  loadWithdrawals();
}

/////////////////////////////////////////////////////
// LOGOUT
/////////////////////////////////////////////////////

async function logout() {
  try {
    await signOut(auth);
    sessionStorage.clear();
    window.location.replace("login.html");
  } catch (error) {
    console.error("Logout error:", error);
  }
}

/////////////////////////////////////////////////////
// RENDER ALL
/////////////////////////////////////////////////////

function renderAll() {
  loadUsers();
  loadDeposits();
  loadInvestments();
  loadWithdrawals();
}

window.setFilter = setFilter;
window.logout = logout;

</script>

</body>
</html>
