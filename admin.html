<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Prevent back button after logout -->
  <script>
    if (window.history && window.history.pushState) {
      window.history.pushState(null, null, window.location.href);
      window.onpopstate = function() {
        window.history.pushState(null, null, window.location.href);
      };
    }
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f0f1a;
      color: #e8e8ec;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
    }

    .admin-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    /* ===== LOGOUT BUTTON ===== */
    .logout-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(255, 68, 68, 0.15);
      color: #ff4444;
      border: 1px solid rgba(255, 68, 68, 0.3);
      padding: 12px 24px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.3px;
      font-family: 'Inter', sans-serif;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      z-index: 100;
    }

    .logout-btn:hover {
      background: rgba(255, 68, 68, 0.25);
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(255, 68, 68, 0.3);
      border-color: rgba(255, 68, 68, 0.5);
    }

    /* ===== HEADER ===== */
    .admin-header {
      text-align: center;
      padding: 50px 0 30px;
    }

    .admin-header h2 {
      color: #ff4444;
      margin: 0;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -1px;
      text-shadow: 0 0 20px rgba(255, 68, 68, 0.3);
    }

    .admin-header p {
      color: #666680;
      margin: 12px 0 0 0;
      font-size: 15px;
    }

    /* ===== SECTION CARD - GLASS ===== */
    .section-card {
      background: rgba(25, 25, 40, 0.6);
      border-radius: 20px;
      padding: 28px;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
      transition: all 0.3s ease;
    }

    .section-card:hover {
      border-color: rgba(255, 255, 255, 0.1);
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.45);
    }

    .section-card h3 {
      color: #ffbb33;
      margin: 0 0 20px 0;
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 700;
    }

    /* ===== SEARCH BOX ===== */
    .search-box {
      width: 100%;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      background: rgba(15, 15, 30, 0.6);
      color: #fff;
      font-size: 15px;
      margin-bottom: 20px;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
      transition: all 0.25s ease;
    }

    .search-box::placeholder {
      color: #444460;
    }

    .search-box:focus {
      outline: none;
      border-color: #ffbb33;
      box-shadow: 0 0 0 3px rgba(255, 187, 51, 0.1);
      background: rgba(15, 15, 30, 0.8);
    }

    /* ===== FILTER TABS - GLASS GLOWING ===== */
    .filter-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filter-tab {
      background: rgba(15, 15, 30, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #8888a0;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .filter-tab:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .filter-tab.active {
      background: rgba(51, 181, 229, 0.15);
      color: #33b5e5;
      border-color: rgba(51, 181, 229, 0.4);
      box-shadow: 0 0 20px rgba(51, 181, 229, 0.2);
    }

    /* ===== USER CARD - GLASS ===== */
    .user-card {
      background: rgba(15, 15, 30, 0.5);
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 14px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(10px);
      transition: all 0.25s ease;
    }

    .user-card:hover {
      border-color: rgba(255, 255, 255, 0.12);
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .user-card h4 {
      color: #00c851;
      margin: 0 0 10px 0;
      font-size: 16px;
      font-weight: 700;
    }

    .user-card p {
      color: #8888a0;
      margin: 6px 0;
      font-size: 14px;
    }

    .user-card .balance {
      color: #ffbb33;
      font-size: 20px;
      font-weight: 700;
    }

    /* ===== TOGGLE ROW ===== */
    .toggle-row {
      display: flex;
      gap: 12px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    /* ===== TOGGLE BUTTONS - GLASS GLOWING ===== */
    .toggle-btn {
      padding: 10px 20px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .toggle-btn:hover {
      transform: translateY(-2px);
    }

    .toggle-btn:active {
      transform: scale(0.97);
    }

    .toggle-btn.enabled {
      background: rgba(0, 200, 81, 0.15);
      color: #00c851;
      border-color: rgba(0, 200, 81, 0.4);
      box-shadow: 0 0 20px rgba(0, 200, 81, 0.2);
    }

    .toggle-btn.enabled:hover {
      box-shadow: 0 0 30px rgba(0, 200, 81, 0.35);
    }

    .toggle-btn.disabled {
      background: rgba(255, 68, 68, 0.15);
      color: #ff4444;
      border-color: rgba(255, 68, 68, 0.4);
      box-shadow: 0 0 20px rgba(255, 68, 68, 0.2);
    }

    .toggle-btn.disabled:hover {
      box-shadow: 0 0 30px rgba(255, 68, 68, 0.35);
    }

    /* ===== DEPOSIT / WITHDRAW CARDS - GLASS ===== */
    .deposit-card, .withdraw-card {
      background: rgba(15, 15, 30, 0.5);
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 14px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(10px);
      transition: all 0.25s ease;
    }

    .deposit-card:hover, .withdraw-card:hover {
      border-color: rgba(255, 255, 255, 0.12);
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    /* ===== STATUS BADGES - GLASS ===== */
    .status-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      backdrop-filter: blur(10px);
    }

    .status-badge.pending {
      background: rgba(255, 187, 51, 0.12);
      color: #ffbb33;
      border: 1px solid rgba(255, 187, 51, 0.3);
    }

    .status-badge.approved {
      background: rgba(0, 200, 81, 0.12);
      color: #00c851;
      border: 1px solid rgba(0, 200, 81, 0.3);
    }

    .status-badge.rejected {
      background: rgba(255, 68, 68, 0.12);
      color: #ff4444;
      border: 1px solid rgba(255, 68, 68, 0.3);
    }

    /* ===== ACTION BUTTONS - GLASS GLOWING (like deposit/withdraw/transfer/invest) ===== */
    .action-btn {
      padding: 12px 22px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
      background: rgba(15, 15, 30, 0.8);
      color: white;
    }

    .action-btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
      transition: left 0.5s ease;
    }

    .action-btn:hover::before {
      left: 100%;
    }

    .action-btn:hover {
      transform: translateY(-2px);
    }

    .action-btn:active {
      transform: scale(0.97);
    }

    /* Approve - Green Glow */
    .approve-btn {
      background: rgba(15, 15, 30, 0.8);
      color: #00c851;
      box-shadow: 0 0 15px rgba(0, 200, 81, 0.15), inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .approve-btn:hover {
      box-shadow: 0 0 25px rgba(0, 200, 81, 0.3), 0 8px 20px rgba(0,0,0,0.2);
      border-color: rgba(0, 200, 81, 0.4);
    }

    /* Reject - Red Glow */
    .reject-btn {
      background: rgba(15, 15, 30, 0.8);
      color: #ff4444;
      box-shadow: 0 0 15px rgba(255, 68, 68, 0.15), inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .reject-btn:hover {
      box-shadow: 0 0 25px rgba(255, 68, 68, 0.3), 0 8px 20px rgba(0,0,0,0.2);
      border-color: rgba(255, 68, 68, 0.4);
    }

    /* ===== NO DATA ===== */
    .no-data {
      text-align: center;
      color: #444460;
      padding: 30px;
      font-size: 14px;
    }

    /* ===== WALLET ADDRESS ===== */
    .wallet-address {
      color: #33b5e5;
      word-break: break-all;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      padding: 8px 12px;
      background: rgba(51, 181, 229, 0.08);
      border: 1px solid rgba(51, 181, 229, 0.2);
      border-radius: 8px;
      display: inline-block;
      margin-top: 6px;
    }

    /* ===== NOTIFICATION BOX - GLASS ===== */
    .notification-box {
      background: rgba(15, 15, 30, 0.5);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 12px;
      border-left: 3px solid #ffbb33;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-left: 3px solid #ffbb33;
      transition: all 0.25s ease;
    }

    .notification-box:hover {
      border-color: rgba(255, 187, 51, 0.3);
      transform: translateX(4px);
    }

    .notification-box p {
      margin: 0;
      color: #8888a0;
      font-size: 14px;
    }

    .notification-box .time {
      color: #555570;
      font-size: 12px;
      margin-top: 8px;
    }

    /* ===== MOBILE ===== */
    @media (max-width: 768px) {
      .admin-header h2 {
        font-size: 28px;
      }
      .filter-tabs {
        gap: 8px;
      }
      .filter-tab {
        padding: 8px 14px;
        font-size: 12px;
      }
      .toggle-row {
        gap: 8px;
      }
      .toggle-btn {
        padding: 8px 14px;
        font-size: 12px;
      }
      .section-card {
        padding: 20px;
      }
    }
  </style>
</head>

<body>
<div class="admin-container">

  <button class="logout-btn" onclick="logout()">🚪 Logout</button>

  <div class="admin-header">
    <h2>🔐 Admin Dashboard</h2>
    <p>Manage users, deposits, withdrawals & investments</p>
  </div>

  <!-- NOTIFICATIONS -->
  <div class="section-card">
    <h3>🔔 Notifications</h3>
    <div id="notifications">
      <p class="no-data">Loading notifications...</p>
    </div>
  </div>

  <!-- USER CONTROL (NEW!) -->
  <div class="section-card">
    <h3>👥 User Control</h3>
    <input id="searchUser" class="search-box" placeholder="Search users by username..." onkeyup="loadUsers()">
    <div id="usersList">
      <p class="no-data">Loading users...</p>
    </div>
  </div>

  <!-- DEPOSITS -->
  <div class="section-card">
    <h3>💰 Deposits</h3>
    <div class="filter-tabs">
      <button class="filter-tab active" onclick="setFilter('all')">All</button>
      <button class="filter-tab" onclick="setFilter('pending')">Pending</button>
      <button class="filter-tab" onclick="setFilter('approved')">Approved</button>
      <button class="filter-tab" onclick="setFilter('rejected')">Rejected</button>
    </div>
    <div id="depositList">
      <p class="no-data">Loading deposits...</p>
    </div>
  </div>

  <!-- WITHDRAWALS -->
  <div class="section-card">
    <h3>💸 Withdrawals</h3>
    <div class="filter-tabs">
      <button class="filter-tab active" onclick="setWithdrawFilter('all')">All</button>
      <button class="filter-tab" onclick="setWithdrawFilter('pending')">Pending</button>
      <button class="filter-tab" onclick="setWithdrawFilter('approved')">Approved</button>
      <button class="filter-tab" onclick="setWithdrawFilter('rejected')">Rejected</button>
    </div>
    <div id="withdrawList">
      <p class="no-data">Loading withdrawals...</p>
    </div>
  </div>

  <!-- INVESTMENTS -->
  <div class="section-card">
    <h3>📈 Investments</h3>
    <div id="investList">
      <p class="no-data">Loading investments...</p>
    </div>
  </div>

</div>
<script type="module">
/////////////////////////////////////////////////////
// AUTH PROTECTION + IMPORTS - EXACTLY AS YOU HAD IT
/////////////////////////////////////////////////////

import { auth, db } from "./firebase.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { ref, get, update, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// ✅ AUTH CHECK
onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }
  
  const role = sessionStorage.getItem("role");
  if (role !== "admin") {
    alert("Access denied. Admins only.");
    window.location.href = "dashboard.html";
    return;
  }
  
  loadData();
});

/////////////////////////////////////////////////////
// GLOBAL DATA - EXACTLY AS YOU HAD IT
/////////////////////////////////////////////////////

let users = [];
let deposits = [];
let withdrawals = [];
let investments = [];

let filterStatus = "all";
let withdrawFilterStatus = "all";

/////////////////////////////////////////////////////
// LOAD DATA - EXACTLY AS YOU HAD IT
/////////////////////////////////////////////////////

async function loadData() {
  try {
    // Load users
    const usersSnap = await get(ref(db, 'users'));
    users = [];
    if (usersSnap.exists()) {
      usersSnap.forEach((childSnap) => {
        users.push({ username: childSnap.key, ...childSnap.val() });
      });
    }
    
    // Load deposits
    const depSnap = await get(ref(db, 'deposits'));
    deposits = [];
    if (depSnap.exists()) {
      depSnap.forEach((childSnap) => {
        deposits.push({ id: childSnap.key, ...childSnap.val() });
      });
    }
    
    // Load withdrawals
    const witSnap = await get(ref(db, 'withdrawals'));
    withdrawals = [];
    if (witSnap.exists()) {
      witSnap.forEach((childSnap) => {
        withdrawals.push({ id: childSnap.key, ...childSnap.val() });
      });
    }
    
    // Load investments
    const invSnap = await get(ref(db, 'investments'));
    investments = [];
    if (invSnap.exists()) {
      invSnap.forEach((childSnap) => {
        investments.push({ id: childSnap.key, ...childSnap.val() });
      });
    }
    
    renderAll();
  } catch (error) {
    console.error("Load error:", error);
    alert("Error loading data: " + error.message);
  }
}

/////////////////////////////////////////////////////
// USERS - WITH ADMIN FLAGS CONTROL (NEW!)
/////////////////////////////////////////////////////

function loadUsers() {
  let search = document.getElementById("searchUser").value.toLowerCase();
  let filtered = users.filter(u => (u.username || "").toLowerCase().includes(search));

  document.getElementById("usersList").innerHTML =
    filtered.length === 0 ? '<p class="no-data">No users found.</p>' :
    filtered.map(u => {
      // Get admin flags or default
      let flags = u.adminFlags || { canInvest: true, canWithdraw: true, blockReason: "" };
      
      return `
      <div class="user-card">
        <h4>👤 ${u.username}</h4>
        <p>📧 Email: ${u.email || 'N/A'}</p>
        <p class="balance">💰 Balance: $${Number(u.balance || 0).toFixed(2)}</p>
        <p>🏷️ Role: ${u.role || 'user'}</p>
        <p>🆔 Account ID: ${u.accountId || 'N/A'}</p>
        <p>💼 Wallet: ${u.wallet ? '<span class="wallet-address">' + u.wallet + '</span>' : '<span style="color:#ff4444;">❌ Not set</span>'}</p>
        
        <div class="toggle-row">
          <button class="toggle-btn ${flags.canInvest !== false ? 'enabled' : 'disabled'}" 
            onclick="toggleInvest('${u.username}', ${flags.canInvest !== false})">
            ${flags.canInvest !== false ? '✅ Invest ON' : '❌ Invest OFF'}
          </button>
          
          <button class="toggle-btn ${flags.canWithdraw !== false ? 'enabled' : 'disabled'}" 
            onclick="toggleWithdraw('${u.username}', ${flags.canWithdraw !== false})">
            ${flags.canWithdraw !== false ? '✅ Withdraw ON' : '❌ Withdraw OFF'}
          </button>
        </div>
        
        ${flags.blockReason ? `<p style="color:#ff4444; margin-top:10px;">📝 Reason: ${flags.blockReason}</p>` : ''}
        
        <div style="margin-top:15px;">
          <input type="text" id="blockReason_${u.username}" placeholder="Block reason (optional)" 
            style="padding:8px; border-radius:5px; border:1px solid #333; background:#0f3460; color:white; width:200px;">
          <button onclick="saveBlockReason('${u.username}')" 
            style="padding:8px 15px; background:#ffbb33; color:black; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">
            Save Reason
          </button>
        </div>
      </div>
    `}).join("");
}

/////////////////////////////////////////////////////
// TOGGLE INVEST (NEW!)
/////////////////////////////////////////////////////

window.toggleInvest = async function(username, currentState) {
  let newState = !currentState;
  let reason = prompt(newState ? "Enable investing for " + username + "?" : "Disable investing for " + username + "?\n\nEnter reason (optional):");
  
  if (reason === null) return; // Cancelled
  
  try {
    await update(ref(db, 'users/' + username + '/adminFlags'), {
      canInvest: newState,
      blockReason: reason || ""
    });
    
    alert(newState ? `✅ Investing enabled for ${username}` : `❌ Investing disabled for ${username}`);
    loadData();
  } catch (error) {
    alert("Error: " + error.message);
  }
};

/////////////////////////////////////////////////////
// TOGGLE WITHDRAW (NEW!)
/////////////////////////////////////////////////////

window.toggleWithdraw = async function(username, currentState) {
  let newState = !currentState;
  let reason = prompt(newState ? "Enable withdrawal for " + username + "?" : "Disable withdrawal for " + username + "?\n\nEnter reason (optional):");
  
  if (reason === null) return; // Cancelled
  
  try {
    await update(ref(db, 'users/' + username + '/adminFlags'), {
      canWithdraw: newState,
      blockReason: reason || ""
    });
    
    alert(newState ? `✅ Withdrawal enabled for ${username}` : `❌ Withdrawal disabled for ${username}`);
    loadData();
  } catch (error) {
    alert("Error: " + error.message);
  }
};

/////////////////////////////////////////////////////
// SAVE BLOCK REASON (NEW!)
/////////////////////////////////////////////////////

window.saveBlockReason = async function(username) {
  let reason = document.getElementById('blockReason_' + username).value;
  
  try {
    await update(ref(db, 'users/' + username + '/adminFlags'), {
      blockReason: reason
    });
    
    alert(`✅ Block reason saved for ${username}`);
    loadData();
  } catch (error) {
    alert("Error: " + error.message);
  }
};

/////////////////////////////////////////////////////
// DEPOSITS - EXACTLY AS YOU HAD IT
/////////////////////////////////////////////////////

function loadDeposits() {
  let list = deposits.filter(d => filterStatus === "all" ? true : d.status === filterStatus);

  document.getElementById("depositList").innerHTML =
    list.length === 0 ? '<p class="no-data">No deposits found.</p>' :
    list.map(d => `
      <div class="deposit-card">
        <p><b>👤 User:</b> ${d.user}</p>
        <p><b>💰 Amount:</b> $${d.amount}</p>
        <p><b>🪙 Coin:</b> ${d.coin}</p>
        <p><b>📊 Status:</b> <span class="status-badge ${d.status}">${d.status.toUpperCase()}</span></p>
        <p><b>📅 Time:</b> ${new Date(d.time).toLocaleString()}</p>
        
        ${d.status === "pending" ? `
          <button class="action-btn approve-btn" onclick="approveDeposit('${d.id}', '${d.user}', ${d.amount})">✅ Approve</button>
          <button class="action-btn reject-btn" onclick="rejectDeposit('${d.id}')">❌ Reject</button>
        ` : ""}
      </div>
    `).join("");
}

/////////////////////////////////////////////////////
// APPROVE DEPOSIT - EXACTLY AS YOU HAD IT
/////////////////////////////////////////////////////

window.approveDeposit = async function(depositId, username, amount) {
  if (!confirm(`Approve deposit of $${amount} for ${username}?`)) return;
  
  try {
    await update(ref(db, 'deposits/' + depositId), {
      status: "approved"
    });
    
    const userSnap = await get(ref(db, 'users/' + username));
    if (userSnap.exists()) {
      let currentBalance = userSnap.val().balance || 0;
      let newBalance = currentBalance + Number(amount);
      
      await update(ref(db, 'users/' + username), {
        balance: newBalance
      });
    }
    
    alert(`✅ Deposit approved! $${amount} added to ${username}'s balance.`);
    loadData();
    
  } catch (error) {
    alert("Error approving deposit: " + error.message);
    console.error(error);
  }
};

/////////////////////////////////////////////////////
// REJECT DEPOSIT - EXACTLY AS YOU HAD IT
/////////////////////////////////////////////////////

window.rejectDeposit = async function(depositId) {
  if (!confirm("Reject this deposit?")) return;
  
  try {
    await update(ref(db, 'deposits/' + depositId), {
      status: "rejected"
    });
    
    alert("❌ Deposit rejected.");
    loadData();
    
  } catch (error) {
    alert("Error rejecting deposit: " + error.message);
    console.error(error);
  }
};

/////////////////////////////////////////////////////
// WITHDRAWALS - EXACTLY AS YOU HAD IT
/////////////////////////////////////////////////////

function loadWithdrawals() {
  let list = withdrawals.filter(w => withdrawFilterStatus === "all" ? true : w.status === withdrawFilterStatus);

  document.getElementById("withdrawList").innerHTML =
    list.length === 0 ? '<p class="no-data">No withdrawals found.</p>' :
    list.map(w => `
      <div class="withdraw-card">
        <p><b>👤 User:</b> ${w.user}</p>
        <p><b>💰 Amount:</b> $${w.amount}</p>
        <p><b>🪙 Coin:</b> ${w.coin || 'N/A'}</p>
        <p><b>💼 Wallet:</b> <span class="wallet-address">${w.wallet}</span></p>
        <p><b>📊 Status:</b> <span class="status-badge ${w.status}">${w.status.toUpperCase()}</span></p>
        <p><b>📅 Time:</b> ${new Date(w.time).toLocaleString()}</p>
        
        ${w.status === "pending" ? `
          <button class="action-btn approve-btn" onclick="approveWithdraw('${w.id}', '${w.user}', ${w.amount})">✅ Approve</button>
          <button class="action-btn reject-btn" onclick="rejectWithdraw('${w.id}', '${w.user}', ${w.amount})">❌ Reject</button>
        ` : ""}
      </div>
    `).join("");
}

/////////////////////////////////////////////////////
// APPROVE WITHDRAWAL - FIXED (no double deduction!)
/////////////////////////////////////////////////////

window.approveWithdraw = async function(withdrawId, username, amount) {
  if (!confirm(`Approve withdrawal of $${amount} for ${username}?`)) return;
  
  try {
    // Just mark as approved — balance was ALREADY deducted on withdrawal page
    await update(ref(db, 'withdrawals/' + withdrawId), {
      status: "approved"
    });
    
    alert(`✅ Withdrawal approved! $${amount} was already deducted from ${username}'s balance.`);
    loadData();
    
  } catch (error) {
    alert("Error approving withdrawal: " + error.message);
    console.error(error);
  }
};

/////////////////////////////////////////////////////
// REJECT WITHDRAWAL - FIXED (refund the user!)
/////////////////////////////////////////////////////

window.rejectWithdraw = async function(withdrawId, username, amount) {
  if (!confirm("Reject this withdrawal? The amount will be refunded to the user.")) return;
  
  try {
    // Mark as rejected
    await update(ref(db, 'withdrawals/' + withdrawId), {
      status: "rejected"
    });
    
    // REFUND: Add the amount back to user's balance
    const userSnap = await get(ref(db, 'users/' + username));
    if (userSnap.exists()) {
      let currentBalance = userSnap.val().balance || 0;
      let newBalance = currentBalance + Number(amount);
      
      await update(ref(db, 'users/' + username), {
        balance: newBalance
      });
    }
    
    alert(`❌ Withdrawal rejected. $${amount} has been refunded to ${username}'s balance.`);
    loadData();
    
  } catch (error) {
    alert("Error rejecting withdrawal: " + error.message);
    console.error(error);
  }
};

</span></p>

  /////////////////////////////////////////////////////
// NOTIFICATIONS (NEW!)
/////////////////////////////////////////////////////

function loadNotifications() {
  let pendingDeposits =
    deposits.filter(d => d.status === "pending").length;

  let pendingWithdrawals =
    withdrawals.filter(w => w.status === "pending").length;

  let notifHTML = "";

  if (pendingDeposits > 0) {
    notifHTML += `
      <div class="notification-box">
        <p>💰 ${pendingDeposits} pending deposit(s) waiting for approval</p>
        <p class="time">Check deposits section below</p>
      </div>
    `;
  }

  if (pendingWithdrawals > 0) {
    notifHTML += `
      <div class="notification-box">
        <p>💸 ${pendingWithdrawals} pending withdrawal(s) waiting for approval</p>
        <p class="time">Check withdrawals section below</p>
      </div>
    `;
  }

  if (notifHTML === "") {
    notifHTML = '<p class="no-data">No new notifications</p>';
  }

  document.getElementById("notifications").innerHTML = notifHTML;
}

    .querySelectorAll('.filter-tab')
    .forEach(tab => {

    });

  loadWithdrawals();
  }
