<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Prevent back button after logout -->
  <script>
    if (window.history && window.history.pushState) {
      window.history.pushState(null, null, window.location.href);
      window.onpopstate = function() {
        window.history.pushState(null, null, window.location.href);
      };
    }
  </script>
  
  <style>
    body {
      background: #0f0f1a;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }
    
    .profile-container {
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
    }
    
    .profile-card {
      background: #1a1a2e;
      border-radius: 20px;
      padding: 30px;
      border: 1px solid #2a2a4e;
      margin-bottom: 20px;
    }
    
    .profile-header {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .profile-header h2 {
      color: #33b5e5;
      margin: 0;
      font-size: 24px;
    }
    
    .avatar-wrapper {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto 20px auto;
    }
    
    .iavatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid #ffbb33;
      object-fit: cover;
      cursor: pointer;
      transition: 0.3s;
    }
    
    .iavatar:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255, 187, 51, 0.3);
    }
    
    .avatar-edit {
      position: absolute;
      bottom: 5px;
      right: 5px;
      background: #ffbb33;
      color: black;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      border: 2px solid #1a1a2e;
    }
    
    .section-title {
      color: #ffbb33;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 25px 0 15px 0;
      padding-bottom: 10px;
      border-bottom: 1px solid #2a2a4e;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group label {
      display: block;
      color: #888;
      font-size: 12px;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .form-input {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #0f3460;
      color: white;
      font-size: 16px;
      box-sizing: border-box;
      transition: 0.3s;
    }
    
    .form-input:focus {
      outline: none;
      border-color: #33b5e5;
    }
    
    .form-input[readonly] {
      background: #0f0f1a;
      color: #666;
      cursor: not-allowed;
    }
    
    .form-input::placeholder {
      color: #666;
    }
    
    .info-display {
      background: #0f3460;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      border: 1px solid #2a2a4e;
    }
    
    .info-display p {
      margin: 0;
      color: white;
      font-size: 18px;
    }
    
    .info-display span {
      color: #ffbb33;
      font-weight: bold;
    }
    
    .btn {
      padding: 12px 24px;
      border-radius: 10px;
      border: none;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      margin-right: 10px;
      margin-bottom: 10px;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #00c851, #00b248);
      color: white;
    }
    
    .btn-secondary {
      background: #1a1a2e;
      border: 1px solid #2a2a4e;
      color: #aaa;
    }
    
    .btn-danger {
      background: linear-gradient(135deg, #ff4444, #cc0000);
      color: white;
    }
    
    .btn:hover {
      transform: translateY(-2px);
    }
    
    #walletMsg {
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      margin-top: 15px;
      font-weight: bold;
      display: none;
    }
    
    #walletMsg.show {
      display: block;
    }
    
    #walletMsg.success {
      background: rgba(0, 200, 81, 0.2);
      color: #00c851;
      border: 1px solid #00c851;
    }
    
    #walletMsg.error {
      background: rgba(255, 68, 68, 0.2);
      color: #ff4444;
      border: 1px solid #ff4444;
    }
    
    #walletMsg.loading {
      background: rgba(51, 181, 229, 0.2);
      color: #33b5e5;
      border: 1px solid #33b5e5;
    }
    
    .nav-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="profile-container">

  <!-- PROFILE CARD -->
  <div class="profile-card">
    
    <div class="profile-header">
      <h2>👤 My Profile</h2>
    </div>
    
    <!-- AVATAR -->
    <div class="avatar-wrapper">
      <img id="iavatar" class="iavatar" src="" onclick="triggerUpload()">
      <div class="avatar-edit" onclick="triggerUpload()">📷</div>
    </div>
    
    <input type="file" id="fileInput" style="display:none" onchange="uploadImage(event)">

    <!-- USER INFO -->
    <div class="section-title">Account Information</div>
    
    <div class="form-group">
      <label>Username</label>
      <input id="usernameInput" class="form-input" readonly>
    </div>
    
    <div class="form-group">
      <label>Email Address</label>
      <input id="emailInput" class="form-input">
    </div>
    
    <div class="info-display">
      <p>💰 Balance: <span>$<span id="balance">0</span></span></p>
    </div>
    
    <div class="info-display">
      <p>📈 Plan: <span id="planDisplay">None</span></p>
    </div>

  </div>

  <!-- WALLET CARD -->
  <div class="profile-card">
    
    <div class="section-title">💼 Wallet Address</div>
    
    <p style="color:#888; font-size:14px; margin-bottom:15px;">Add your crypto wallet address for withdrawals:</p>
    
    <div class="form-group">
      <input id="walletInput" class="form-input" placeholder="Enter your USDT/BTC wallet address">
    </div>
    
    <button class="btn btn-primary" onclick="saveWallet()">💾 Save Wallet</button>
    
    <p id="walletMsg"></p>

  </div>

  <!-- SECURITY CARD -->
  <div class="profile-card">
    
    <div class="section-title">🔐 Security</div>
    
    <div class="form-group">
      <label>New Password</label>
      <input id="newPassword" class="form-input" type="password" placeholder="New Password (min 6 chars)">
    </div>
    
    <button class="btn btn-primary" onclick="changePassword()">Update Password</button>

  </div>

  <!-- NAVIGATION -->
  <div class="nav-buttons">
    <button class="btn btn-secondary" onclick="goDashboard()">⬅️ Back to Dashboard</button>
    <button class="btn btn-danger" onclick="logout()">🚪 Logout</button>
  </div>

</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { onAuthStateChanged, updatePassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { ref, get, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

let currentUsername = null;
let userData = null;

// Auth check + load user data
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }
  
  const usersSnap = await get(ref(db, 'users'));
  usersSnap.forEach((childSnap) => {
    const data = childSnap.val();
    if (data.uid === user.uid) {
      currentUsername = childSnap.key;
      userData = data;
      
      document.getElementById("usernameInput").value = data.username;
      document.getElementById("emailInput").value = data.email || "";
      document.getElementById("balance").innerText = Number(data.balance || 0).toFixed(2);
      document.getElementById("planDisplay").innerText = data.plan || "None";
      
      if (data.wallet) {
        document.getElementById("walletInput").value = data.wallet;
      }
      
      if (data.image) {
        document.getElementById("iavatar").src = data.image;
      } else {
        document.getElementById("iavatar").src = "https://via.placeholder.com/90";
      }
    }
  });
});

/////////////////////////////////////////////////////
// SAVE WALLET
/////////////////////////////////////////////////////

window.saveWallet = async function() {
  const wallet = document.getElementById("walletInput").value.trim();
  const msg = document.getElementById("walletMsg");
  
  if (!wallet) {
    msg.className = "show error";
    msg.innerText = "❌ Please enter a wallet address!";
    return;
  }
  
  if (!currentUsername) {
    msg.className = "show error";
    msg.innerText = "❌ Error: User not loaded yet!";
    return;
  }
  
  try {
    msg.className = "show loading";
    msg.innerText = "⏳ Saving...";
    
    await update(ref(db, 'users/' + currentUsername), {
      wallet: wallet
    });
    
    msg.className = "show success";
    msg.innerText = "✅ Wallet saved successfully!";
    
  } catch (error) {
    msg.className = "show error";
    msg.innerText = "❌ Error: " + error.message;
  }
};

/////////////////////////////////////////////////////
// UPDATE PROFILE
/////////////////////////////////////////////////////

window.updateProfile = async function() {
  const newEmail = document.getElementById("emailInput").value.trim();
  const msg = document.getElementById("walletMsg");
  
  if (!newEmail) {
    msg.className = "show error";
    msg.innerText = "❌ Please enter email!";
    return;
  }
  
  try {
    await update(ref(db, 'users/' + currentUsername), {
      email: newEmail
    });
    
    msg.className = "show success";
    msg.innerText = "✅ Profile updated!";
    
  } catch (error) {
    msg.className = "show error";
    msg.innerText = "❌ Error: " + error.message;
  }
};

/////////////////////////////////////////////////////
// CHANGE PASSWORD
/////////////////////////////////////////////////////

window.changePassword = async function() {
  const newPass = document.getElementById("newPassword").value.trim();
  const msg = document.getElementById("walletMsg");
  
  if (!newPass) {
    msg.className = "show error";
    msg.innerText = "❌ Please enter new password!";
    return;
  }
  
  if (newPass.length < 6) {
    msg.className = "show error";
    msg.innerText = "❌ Password must be 6+ characters!";
    return;
  }
  
  try {
    const user = auth.currentUser;
    await updatePassword(user, newPass);
    
    msg.className = "show success";
    msg.innerText = "✅ Password changed!";
    document.getElementById("newPassword").value = "";
    
  } catch (error) {
    msg.className = "show error";
    msg.innerText = "❌ Error: " + error.message;
  }
};

/////////////////////////////////////////////////////
// IMAGE UPLOAD
/////////////////////////////////////////////////////

window.uploadImage = async function(event) {
  let file = event.target.files[0];
  if (!file) return;
  
  if (file.size > 500000) {
    alert("❌ Image too large! Max 500KB.");
    return;
  }
  
  let reader = new FileReader();
  
  reader.onload = async function(e) {
    try {
      await update(ref(db, 'users/' + currentUsername), {
        image: e.target.result
      });
      
      document.getElementById("iavatar").src = e.target.result;
      alert("✅ Profile picture updated!");
      
    } catch (error) {
      alert("❌ Error saving image: " + error.message);
    }
  };
  
  reader.readAsDataURL(file);
};

window.triggerUpload = function() {
  document.getElementById("fileInput").click();
};

/////////////////////////////////////////////////////
// NAVIGATION
/////////////////////////////////////////////////////

window.goDashboard = function() {
  window.location.href = "dashboard.html";
};

window.logout = async function() {
  try {
    await auth.signOut();
    sessionStorage.clear();
    window.location.href = "login.html";
  } catch (error) {
    console.error("Logout error:", error);
  }
};

</script>
</body>
</html>
