<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Prevent back button after logout -->
  <script>
    if (window.history && window.history.pushState) {
      window.history.pushState(null, null, window.location.href);
      window.onpopstate = function() {
        window.history.pushState(null, null, window.location.href);
      };
    }
  </script>
</head>

<body>

<div class="container">
  <h2>My Profile</h2>

  <!-- Profile Picture -->
  <img id="iavatar" class="iavatar" src="" onclick="triggerUpload()">

  <input type="file" id="fileInput" style="display:none" onchange="uploadImage(event)">

  <br><br>

  <!-- USER INFO -->
  <p><strong>Username:</strong></p>
  <input id="usernameInput" readonly><br><br>

  <p><strong>Email:</strong></p>
  <input id="emailInput"><br><br>

  <p><strong>Balance:</strong> $<span id="balance">0</span></p>
  
  <p><strong>Plan:</strong> <span id="planDisplay">None</span></p>

  <hr>

  <!-- WALLET ADDRESS -->
  <h3>💼 Wallet Address</h3>
  <p>Add your crypto wallet address for withdrawals:</p>
  <input id="walletInput" placeholder="Enter your USDT/BTC wallet address" style="width:100%; padding:10px; margin:5px 0;"><br>
  <button onclick="saveWallet()">💾 Save Wallet</button>
  <p id="walletMsg" style="color:green; font-weight:bold; margin-top:5px;"></p>

  <hr>

  <!-- PASSWORD CHANGE -->
  <h3>Change Password</h3>
  <input id="newPassword" type="password" placeholder="New Password (min 6 chars)"><br><br>

  <button onclick="changePassword()">Update Password</button>

  <br><br>
  <button onclick="goDashboard()">⬅️ Back to Dashboard</button>
  <button onclick="logout()">Logout</button>
</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { onAuthStateChanged, updatePassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { ref, get, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

let currentUsername = null;
let userData = null;

// Auth check + load user data
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.replace("login.html");
    return;
  }
  
  const usersSnap = await get(ref(db, 'users'));
  usersSnap.forEach((childSnap) => {
    const data = childSnap.val();
    if (data.uid === user.uid) {
      currentUsername = childSnap.key;
      userData = data;
      
      document.getElementById("usernameInput").value = data.username;
      document.getElementById("emailInput").value = data.email || "";
      document.getElementById("balance").innerText = Number(data.balance || 0).toFixed(2);
      document.getElementById("planDisplay").innerText = data.plan || "None";
      
      if (data.wallet) {
        document.getElementById("walletInput").value = data.wallet;
      }
      
      if (data.image) {
        document.getElementById("iavatar").src = data.image;
      } else {
        document.getElementById("iavatar").src = "https://via.placeholder.com/90";
      }
    }
  });
});

/////////////////////////////////////////////////////
// SAVE WALLET
/////////////////////////////////////////////////////

window.saveWallet = async function() {
  const wallet = document.getElementById("walletInput").value.trim();
  const msg = document.getElementById("walletMsg");
  
  if (!wallet) {
    msg.style.color = "red";
    msg.innerText = "Please enter a wallet address!";
    return;
  }
  
  if (!currentUsername) {
    msg.style.color = "red";
    msg.innerText = "Error: User not loaded yet!";
    return;
  }
  
  try {
    msg.style.color = "blue";
    msg.innerText = "Saving...";
    
    await update(ref(db, 'users/' + currentUsername), {
      wallet: wallet
    });
    
    msg.style.color = "green";
    msg.innerText = "✅ Wallet saved successfully!";
    
  } catch (error) {
    msg.style.color = "red";
    msg.innerText = "Error: " + error.message;
  }
};

/////////////////////////////////////////////////////
// UPDATE PROFILE
/////////////////////////////////////////////////////

window.updateProfile = async function() {
  const newEmail = document.getElementById("emailInput").value.trim();
  const msg = document.getElementById("walletMsg");
  
  if (!newEmail) {
    msg.style.color = "red";
    msg.innerText = "Please enter email!";
    return;
  }
  
  try {
    await update(ref(db, 'users/' + currentUsername), {
      email: newEmail
    });
    
    msg.style.color = "green";
    msg.innerText = "✅ Profile updated!";
    
  } catch (error) {
    msg.style.color = "red";
    msg.innerText = "Error: " + error.message;
  }
};

/////////////////////////////////////////////////////
// CHANGE PASSWORD
/////////////////////////////////////////////////////

window.changePassword = async function() {
  const newPass = document.getElementById("newPassword").value.trim();
  const msg = document.getElementById("walletMsg");
  
  if (!newPass) {
    msg.style.color = "red";
    msg.innerText = "Please enter new password!";
    return;
  }
  
  if (newPass.length < 6) {
    msg.style.color = "red";
    msg.innerText = "Password must be 6+ characters!";
    return;
  }
  
  try {
    const user = auth.currentUser;
    await updatePassword(user, newPass);
    
    msg.style.color = "green";
    msg.innerText = "✅ Password changed!";
    document.getElementById("newPassword").value = "";
    
  } catch (error) {
    msg.style.color = "red";
    msg.innerText = "Error: " + error.message;
  }
};

/////////////////////////////////////////////////////
// IMAGE UPLOAD
/////////////////////////////////////////////////////

window.uploadImage = async function(event) {
  let file = event.target.files[0];
  if (!file) return;
  
  if (file.size > 500000) {
    alert("Image too large! Max 500KB.");
    return;
  }
  
  let reader = new FileReader();
  
  reader.onload = async function(e) {
    try {
      await update(ref(db, 'users/' + currentUsername), {
        image: e.target.result
      });
      
      document.getElementById("iavatar").src = e.target.result;
      alert("✅ Profile picture updated!");
      
    } catch (error) {
      alert("Error saving image: " + error.message);
    }
  };
  
  reader.readAsDataURL(file);
};

window.triggerUpload = function() {
  document.getElementById("fileInput").click();
};

/////////////////////////////////////////////////////
// NAVIGATION (ALL USE REPLACE!)
/////////////////////////////////////////////////////

window.goDashboard = function() {
  window.location.replace("dashboard.html");
};

window.logout = async function() {
  try {
    await auth.signOut();
    sessionStorage.clear();
    window.location.replace("login.html");
  } catch (error) {
    console.error("Logout error:", error);
  }
};

</script>

</body>
</html>
