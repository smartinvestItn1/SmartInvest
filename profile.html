<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — SmartInvest</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Prevent back button after logout -->
  <script>
    if (window.history && window.history.pushState) {
      window.history.pushState(null, null, window.location.href);
      window.onpopstate = function() {
        window.history.pushState(null, null, window.location.href);
      };
    }
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f0f1a;
      color: #e8e8ec;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    /* Background particles */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(51, 181, 229, 0.12);
      border-radius: 50%;
      animation: float 15s infinite ease-in-out;
    }

    .particle:nth-child(1) { left: 10%; top: 80%; animation-delay: 0s; }
    .particle:nth-child(2) { left: 20%; top: 20%; animation-delay: 2s; }
    .particle:nth-child(3) { left: 35%; top: 60%; animation-delay: 4s; }
    .particle:nth-child(4) { left: 50%; top: 10%; animation-delay: 6s; }
    .particle:nth-child(5) { left: 65%; top: 70%; animation-delay: 8s; }
    .particle:nth-child(6) { left: 80%; top: 30%; animation-delay: 10s; }
    .particle:nth-child(7) { left: 90%; top: 85%; animation-delay: 12s; }
    .particle:nth-child(8) { left: 15%; top: 40%; animation-delay: 14s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.3; }
      50% { transform: translateY(-40px) scale(1.5); opacity: 0.8; }
    }

    .profile-wrapper {
      position: relative;
      z-index: 1;
      max-width: 480px;
      margin: 0 auto;
      padding: 20px;
    }

    .profile-card {
      background: rgba(25, 25, 40, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 24px;
      padding: 32px;
      margin-bottom: 20px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
      transition: all 0.3s ease;
    }

    .profile-card:hover {
      border-color: rgba(255, 255, 255, 0.1);
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.45);
    }

    .profile-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .profile-header h2 {
      color: #fff;
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .avatar-wrapper {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto 20px auto;
    }

    .iavatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid rgba(255, 187, 51, 0.4);
      object-fit: cover;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(255, 187, 51, 0.15);
    }

    .iavatar:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(255, 187, 51, 0.3);
      border-color: rgba(255, 187, 51, 0.7);
    }

    .avatar-edit {
      position: absolute;
      bottom: 5px;
      right: 5px;
      background: linear-gradient(135deg, #ffbb33, #ff8800);
      color: #10101b;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      border: 2px solid rgba(25, 25, 40, 0.8);
      transition: all 0.3s ease;
    }

    .avatar-edit:hover {
      transform: scale(1.1);
      box-shadow: 0 0 15px rgba(255, 187, 51, 0.4);
    }

    .section-title {
      color: #ffbb33;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin: 25px 0 15px 0;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      color: #8888a0;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      background: rgba(15, 15, 30, 0.6);
      color: #fff;
      font-size: 15px;
      box-sizing: border-box;
      transition: all 0.25s ease;
      font-family: 'Inter', sans-serif;
    }

    .form-input:focus {
      outline: none;
      border-color: #33b5e5;
      box-shadow: 0 0 0 3px rgba(51, 181, 229, 0.1);
      background: rgba(15, 15, 30, 0.8);
    }

    .form-input[readonly] {
      background: rgba(15, 15, 30, 0.4);
      color: #666680;
      cursor: not-allowed;
      border-color: rgba(255, 255, 255, 0.04);
    }

    .form-input::placeholder {
      color: #444460;
    }

    .info-display {
      background: rgba(15, 15, 30, 0.6);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 15px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .info-display p {
      margin: 0;
      color: #8888a0;
      font-size: 14px;
    }

    .info-display span {
      color: #ffbb33;
      font-weight: 700;
      font-size: 18px;
    }

    .btn {
      padding: 12px 24px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
      margin-bottom: 10px;
      font-family: 'Inter', sans-serif;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(10px);
    }

    .btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
      transition: left 0.5s ease;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      background: rgba(15, 15, 30, 0.8);
      color: #00c851;
      box-shadow: 0 0 15px rgba(0, 200, 81, 0.15), inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .btn-primary:hover {
      box-shadow: 0 0 25px rgba(0, 200, 81, 0.3), 0 8px 20px rgba(0,0,0,0.2);
      border-color: rgba(0, 200, 81, 0.4);
    }

    .btn-secondary {
      background: rgba(15, 15, 30, 0.8);
      color: #8888a0;
      border-color: rgba(255, 255, 255, 0.08);
    }

    .btn-secondary:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    .btn-danger {
      background: rgba(15, 15, 30, 0.8);
      color: #ff4444;
      box-shadow: 0 0 15px rgba(255, 68, 68, 0.15), inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .btn-danger:hover {
      box-shadow: 0 0 25px rgba(255, 68, 68, 0.3), 0 8px 20px rgba(0,0,0,0.2);
      border-color: rgba(255, 68, 68, 0.4);
    }

    #walletMsg {
      text-align: center;
      padding: 12px 16px;
      border-radius: 10px;
      margin-top: 15px;
      font-weight: 600;
      font-size: 13px;
      display: none;
      font-family: 'Inter', sans-serif;
    }

    #walletMsg.show {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #walletMsg.success {
      background: rgba(0, 200, 81, 0.12);
      color: #00c851;
      border: 1px solid rgba(0, 200, 81, 0.25);
    }

    #walletMsg.error {
      background: rgba(255, 68, 68, 0.12);
      color: #ff4444;
      border: 1px solid rgba(255, 68, 68, 0.25);
    }

    #walletMsg.loading {
      background: rgba(51, 181, 229, 0.12);
      color: #33b5e5;
      border: 1px solid rgba(51, 181, 229, 0.25);
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    @media (max-width: 480px) {
      .profile-card {
        padding: 24px 20px;
      }
      .nav-buttons {
        flex-direction: column;
      }
      .btn {
        width: 100%;
        margin-right: 0;
      }
    }
  </style>
</head>

<body>

<!-- Background Particles -->
<div class="particles">
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
</div>

<div class="profile-wrapper">

  <!-- PROFILE CARD -->
  <div class="profile-card">

    <div class="profile-header">
      <h2>👤 My Profile</h2>
    </div>

    <!-- AVATAR -->
    <div class="avatar-wrapper">
      <img id="iavatar" class="iavatar" src="" onclick="triggerUpload()">
      <div class="avatar-edit" onclick="triggerUpload()">📷</div>
    </div>

    <input type="file" id="fileInput" style="display:none" onchange="uploadImage(event)">

    <!-- USER INFO -->
    <div class="section-title">Account Information</div>

    <div class="form-group">
      <label>Username</label>
      <input id="usernameInput" class="form-input" readonly>
    </div>

    <div class="form-group">
      <label>Email Address</label>
      <input id="emailInput" class="form-input">
    </div>

    <div class="info-display">
      <p>💰 Balance</p>
      <span>$<span id="balance">0</span></span>
    </div>

    <div class="info-display">
      <p>📈 Plan</p>
      <span id="planDisplay">None</span>
    </div>

  </div>

  <!-- WALLET CARD -->
  <div class="profile-card">

    <div class="section-title">💼 Wallet Address</div>

    <p style="color:#666680; font-size:14px; margin-bottom:15px;">Add your crypto wallet address for withdrawals:</p>

    <div class="form-group">
      <input id="walletInput" class="form-input" placeholder="Enter your USDT/BTC wallet address">
    </div>

    <button class="btn btn-primary" onclick="saveWallet()">💾 Save Wallet</button>

    <p id="walletMsg"></p>

  </div>

  <!-- SECURITY CARD -->
  <div class="profile-card">

    <div class="section-title">🔐 Security</div>

    <div class="form-group">
      <label>New Password</label>
      <input id="newPassword" class="form-input" type="password" placeholder="New Password (min 6 chars)">
    </div>

    <button class="btn btn-primary" onclick="changePassword()">Update Password</button>

  </div>

  <!-- NAVIGATION -->
  <div class="nav-buttons">
    <button class="btn btn-secondary" onclick="goDashboard()">⬅️ Back to Dashboard</button>
    <button class="btn btn-danger" onclick="logout()">🚪 Logout</button>
  </div>

</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { onAuthStateChanged, updatePassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { ref, get, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

let currentUsername = null;
let userData = null;

// Auth check + load user data
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }
  
  const usersSnap = await get(ref(db, 'users'));
  usersSnap.forEach((childSnap) => {
    const data = childSnap.val();
    if (data.uid === user.uid) {
      currentUsername = childSnap.key;
      userData = data;
      
      document.getElementById("usernameInput").value = data.username;
      document.getElementById("emailInput").value = data.email || "";
      document.getElementById("balance").innerText = Number(data.balance || 0).toFixed(2);
      document.getElementById("planDisplay").innerText = data.plan || "None";
      
      if (data.wallet) {
        document.getElementById("walletInput").value = data.wallet;
      }
      
      if (data.image) {
        document.getElementById("iavatar").src = data.image;
      } else {
        document.getElementById("iavatar").src = "https://via.placeholder.com/90";
      }
    }
  });
});

/////////////////////////////////////////////////////
// SAVE WALLET
/////////////////////////////////////////////////////

window.saveWallet = async function() {
  const wallet = document.getElementById("walletInput").value.trim();
  const msg = document.getElementById("walletMsg");
  
  if (!wallet) {
    msg.className = "show error";
    msg.innerText = "❌ Please enter a wallet address!";
    return;
  }
  
  if (!currentUsername) {
    msg.className = "show error";
    msg.innerText = "❌ Error: User not loaded yet!";
    return;
  }
  
  try {
    msg.className = "show loading";
    msg.innerText = "⏳ Saving...";
    
    await update(ref(db, 'users/' + currentUsername), {
      wallet: wallet
    });
    
    msg.className = "show success";
    msg.innerText = "✅ Wallet saved successfully!";
    
  } catch (error) {
    msg.className = "show error";
    msg.innerText = "❌ Error: " + error.message;
  }
};

/////////////////////////////////////////////////////
// UPDATE PROFILE
/////////////////////////////////////////////////////

window.updateProfile = async function() {
  const newEmail = document.getElementById("emailInput").value.trim();
  const msg = document.getElementById("walletMsg");
  
  if (!newEmail) {
    msg.className = "show error";
    msg.innerText = "❌ Please enter email!";
    return;
  }
  
  try {
    await update(ref(db, 'users/' + currentUsername), {
      email: newEmail
    });
    
    msg.className = "show success";
    msg.innerText = "✅ Profile updated!";
    
  } catch (error) {
    msg.className = "show error";
    msg.innerText = "❌ Error: " + error.message;
  }
};

/////////////////////////////////////////////////////
// CHANGE PASSWORD
/////////////////////////////////////////////////////

window.changePassword = async function() {
  const newPass = document.getElementById("newPassword").value.trim();
  const msg = document.getElementById("walletMsg");
  
  if (!newPass) {
    msg.className = "show error";
    msg.innerText = "❌ Please enter new password!";
    return;
  }
  
  if (newPass.length < 6) {
    msg.className = "show error";
    msg.innerText = "❌ Password must be 6+ characters!";
    return;
  }
  
  try {
    const user = auth.currentUser;
    await updatePassword(user, newPass);
    
    msg.className = "show success";
    msg.innerText = "✅ Password changed!";
    document.getElementById("newPassword").value = "";
    
  } catch (error) {
    msg.className = "show error";
    msg.innerText = "❌ Error: " + error.message;
  }
};

/////////////////////////////////////////////////////
// IMAGE UPLOAD
/////////////////////////////////////////////////////

window.uploadImage = async function(event) {
  let file = event.target.files[0];
  if (!file) return;
  
  if (file.size > 500000) {
    alert("❌ Image too large! Max 500KB.");
    return;
  }
  
  let reader = new FileReader();
  
  reader.onload = async function(e) {
    try {
      await update(ref(db, 'users/' + currentUsername), {
        image: e.target.result
      });
      
      document.getElementById("iavatar").src = e.target.result;
      alert("✅ Profile picture updated!");
      
    } catch (error) {
      alert("❌ Error saving image: " + error.message);
    }
  };
  
  reader.readAsDataURL(file);
};

window.triggerUpload = function() {
  document.getElementById("fileInput").click();
};

/////////////////////////////////////////////////////
// NAVIGATION
/////////////////////////////////////////////////////

window.goDashboard = function() {
  window.location.href = "dashboard.html";
};

window.logout = async function() {
  try {
    await auth.signOut();
    sessionStorage.clear();
    window.location.href = "login.html";
  } catch (error) {
    console.error("Logout error:", error);
  }
};
</script>

</body>
      </html>
