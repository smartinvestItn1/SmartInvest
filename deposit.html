<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deposit Crypto</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<button onclick="goBack()">⬅ Back</button>

<div class="container">

  <h2>Deposit Crypto</h2>

  <label>Select Cryptocurrency</label><br>
  <select id="coin" onchange="updateWallet()">
    <option value="USDT">USDT</option>
    <option value="BTC">Bitcoin</option>
    <option value="ETH">Ethereum</option>
    <option value="BNB">BNB</option>
  </select>

  <br><br>

  <label>Wallet Address</label>
  <div style="display:flex; gap:10px;">
    <input id="wallet" readonly>
    <button onclick="copyWallet()">Copy</button>
  </div>

  <br>

  <input id="amount" placeholder="Enter amount">

  <br><br>

  <button onclick="submitDeposit()">Submit Deposit</button>

</div>

<script type="module">

import { db } from "./firebase.js";
import {
  collection,
  addDoc
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

/////////////////////////////////////////////////////
// WALLET SYSTEM
/////////////////////////////////////////////////////

const wallets = {
  USDT: "TXYZUSDT_COMPANY",
  BTC: "bc1qcompanybtc",
  ETH: "0xCOMPANYETH",
  BNB: "bnbCOMPANY"
};

function updateWallet() {
  let coin = document.getElementById("coin").value;
  document.getElementById("wallet").value = wallets[coin];
}

updateWallet();

/////////////////////////////////////////////////////
// GET USER (FROM SESSION STORAGE)
/////////////////////////////////////////////////////

let user = sessionStorage.getItem("loggedInUser");

if (!user) {
  window.location.href = "login.html";
}

/////////////////////////////////////////////////////
// SUBMIT DEPOSIT (FIREBASE)
/////////////////////////////////////////////////////

async function submitDeposit() {

  let amount = Number(document.getElementById("amount").value);
  let coin = document.getElementById("coin").value;

  if (!amount || amount <= 0) {
    alert("Enter valid amount");
    return;
  }

  try {

    await addDoc(collection(db, "deposits"), {
      user: user,
      coin: coin,
      amount: amount,
      wallet: wallets[coin],
      status: "pending",
      type: "deposit",
      time: Date.now()
    });

    alert("Deposit submitted! Waiting for admin approval.");

    document.getElementById("amount").value = "";

  } catch (err) {
    alert("Error submitting deposit");
    console.log(err);
  }
}

/////////////////////////////////////////////////////
// NAVIGATION
/////////////////////////////////////////////////////

function goBack() {
  window.location.href = "dashboard.html";
}

function copyWallet() {
  let input = document.getElementById("wallet");
  input.select();
  document.execCommand("copy");
  alert("Wallet copied");
}

window.submitDeposit = submitDeposit;
window.goBack = goBack;
window.copyWallet = copyWallet;
window.updateWallet = updateWallet;

</script>
<script type="module" src="firebase.js"></script>
</body>
</html>
