<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deposit Crypto</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Prevent back button after logout -->
  <script>
    if (window.history && window.history.pushState) {
      window.history.pushState(null, null, window.location.href);
      window.onpopstate = function() {
        window.history.pushState(null, null, window.location.href);
      };
    }
  </script>
  
  <style>
    /* SAME DARK BACKGROUND AS DASHBOARD */
    body {
      background: #0f0f1a;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }
    
    .deposit-container {
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
    }
    
    .back-btn {
      background: #1a1a2e;
      border: 1px solid #2a2a4e;
      color: #aaa;
      padding: 12px 24px;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 20px;
      font-size: 14px;
      transition: 0.3s;
    }
    
    .back-btn:hover {
      background: #2a2a4e;
      color: white;
    }
    
    .deposit-card {
      background: #1a1a2e;
      border-radius: 16px;
      padding: 30px;
      border: 1px solid #2a2a4e;
    }
    
    .deposit-header {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .deposit-header h2 {
      color: #00c851;
      margin: 0;
      font-size: 24px;
    }
    
    .deposit-header p {
      color: #888;
      margin: 8px 0 0 0;
      font-size: 14px;
    }
    
    .form-group {
      margin-bottom: 25px;
    }
    
    .form-group label {
      display: block;
      color: #888;
      font-size: 12px;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .coin-select {
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #0f3460;
      color: white;
      font-size: 16px;
      cursor: pointer;
      outline: none;
      box-sizing: border-box;
    }
    
    .coin-select:focus {
      border-color: #00c851;
    }
    
    .wallet-box {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    
    .wallet-input {
      flex: 1;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #0f3460;
      color: white;
      font-size: 14px;
      font-family: monospace;
      word-break: break-all;
    }
    
    .copy-btn {
      padding: 15px 20px;
      border-radius: 10px;
      border: none;
      background: #33b5e5;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      white-space: nowrap;
    }
    
    .copy-btn:hover {
      background: #2a9fd6;
    }
    
    .amount-input {
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #0f3460;
      color: white;
      font-size: 16px;
      box-sizing: border-box;
    }
    
    .amount-input:focus {
      outline: none;
      border-color: #00c851;
    }
    
    .amount-input::placeholder {
      color: #666;
    }
    
    .submit-btn {
      width: 100%;
      padding: 18px;
      border-radius: 12px;
      border: none;
      background: #00c851;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 10px;
    }
    
    .submit-btn:hover {
      background: #00b248;
      transform: translateY(-2px);
    }
    
    .submit-btn:active {
      transform: translateY(0);
    }
    
    #result {
      text-align: center;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
      font-weight: bold;
      display: none;
    }
    
    #result.show {
      display: block;
    }
    
    #result.success {
      background: rgba(0, 200, 81, 0.2);
      color: #00c851;
      border: 1px solid #00c851;
    }
    
    #result.error {
      background: rgba(255, 68, 68, 0.2);
      color: #ff4444;
      border: 1px solid #ff4444;
    }
    
    #result.loading {
      background: rgba(51, 181, 229, 0.2);
      color: #33b5e5;
      border: 1px solid #33b5e5;
    }
    
    .info-box {
      background: rgba(255, 187, 51, 0.1);
      border: 1px solid #ffbb33;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 25px;
    }
    
    .info-box p {
      margin: 0;
      color: #ffbb33;
      font-size: 13px;
      line-height: 1.5;
    }
    
    .qr-box {
      width: 150px;
      height: 150px;
      background: white;
      border-radius: 10px;
      margin: 0 auto 20px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="deposit-container">

  <button class="back-btn" onclick="goBack()">⬅ Back to Dashboard</button>

  <div class="deposit-card">
    
    <div class="deposit-header">
      <h2>💰 Deposit Crypto</h2>
      <p>Send crypto to your wallet address below</p>
    </div>
    
    <div class="info-box">
      <p>⚠️ Send only the selected cryptocurrency to this address. Sending wrong coin may result in permanent loss.</p>
    </div>

    <!-- QR Code Placeholder -->
    <div class="qr-box" id="qrCode">
      QR Code<br>Will Show Here
    </div>

    <div class="form-group">
      <label>Select Cryptocurrency</label>
      <select id="coin" class="coin-select" onchange="updateWallet()">
        <option value="USDT">USDT (TRC20)</option>
        <option value="BTC">Bitcoin (BTC)</option>
        <option value="ETH">Ethereum (ERC20)</option>
        <option value="BNB">BNB (BEP20)</option>
      </select>
    </div>

    <div class="form-group">
      <label>Wallet Address</label>
      <div class="wallet-box">
        <input id="wallet" class="wallet-input" readonly value="">
        <button class="copy-btn" onclick="copyWallet()">📋 Copy</button>
      </div>
    </div>

    <div class="form-group">
      <label>Amount (USD)</label>
      <input id="amount" class="amount-input" placeholder="Enter amount you sent" type="number">
    </div>

    <button class="submit-btn" onclick="submitDeposit()">Submit Deposit</button>
    
    <p id="result"></p>

  </div>

</div>

<script type="module">

import { auth, db } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { ref, push } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/////////////////////////////////////////////////////
// AUTH CHECK - EXACTLY AS YOU HAD IT
/////////////////////////////////////////////////////

let currentUser = null;

onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.replace("login.html");
    return;
  }
  
  // Get username from session
  currentUser = sessionStorage.getItem("loggedInUser");
  if (!currentUser) {
    window.location.replace("login.html");
  }
});

/////////////////////////////////////////////////////
// WALLET ADDRESSES - EXACTLY AS YOU HAD IT
/////////////////////////////////////////////////////

const wallets = {
  USDT: "TXYZ1234567890ABCDEF1234567890USDT",
  BTC: "bc1qcompanybtcaddress1234567890",
  ETH: "0xCOMPANYETHADDRESS1234567890",
  BNB: "bnbCOMPANYADDRESS1234567890"
};

/////////////////////////////////////////////////////
// UPDATE WALLET - EXACTLY AS YOU HAD IT
/////////////////////////////////////////////////////

function updateWallet() {
  let coin = document.getElementById("coin").value;
  let walletAddress = wallets[coin];
  
  // Set the wallet input value
  document.getElementById("wallet").value = walletAddress;
  
  // Update QR code text (in real app, generate actual QR)
  document.getElementById("qrCode").innerHTML = "QR for<br>" + coin + "<br>" + walletAddress.substring(0, 10) + "...";
  
  console.log("Selected:", coin, "Wallet:", walletAddress);
}

// RUN ON PAGE LOAD
updateWallet();

/////////////////////////////////////////////////////
// COPY WALLET - EXACTLY AS YOU HAD IT
/////////////////////////////////////////////////////

function copyWallet() {
  let input = document.getElementById("wallet");
  
  // Select the text
  input.select();
  input.setSelectionRange(0, 99999); // For mobile
  
  // Copy to clipboard
  navigator.clipboard.writeText(input.value).then(function() {
    // Visual feedback
    const btn = event.target;
    const originalText = btn.innerText;
    btn.innerText = "✅ Copied!";
    btn.style.background = "#00c851";
    
    setTimeout(() => {
      btn.innerText = originalText;
      btn.style.background = "#33b5e5";
    }, 2000);
    
  }).catch(function(err) {
    // Fallback for older browsers
    document.execCommand("copy");
    alert("Wallet copied: " + input.value);
  });
}

/////////////////////////////////////////////////////
// SUBMIT DEPOSIT - EXACTLY AS YOU HAD IT
/////////////////////////////////////////////////////

async function submitDeposit() {
  const result = document.getElementById("result");

  if (!currentUser) {
    result.className = "show error";
    result.innerText = "Please login first!";
    return;
  }

  let amount = Number(document.getElementById("amount").value);
  let coin = document.getElementById("coin").value;
  let wallet = document.getElementById("wallet").value;

  if (!amount || amount <= 0) {
    result.className = "show error";
    result.innerText = "Enter valid amount!";
    return;
  }

  try {
    result.className = "show loading";
    result.innerText = "⏳ Submitting deposit...";

    // Save to Realtime Database
    await push(ref(db, 'deposits'), {
      user: currentUser,
      coin: coin,
      amount: amount,
      wallet: wallet,
      status: "pending",
      type: "deposit",
      time: Date.now()
    });

    result.className = "show success";
    result.innerText = "✅ Deposit submitted! Waiting for admin approval.";
    document.getElementById("amount").value = "";

  } catch (err) {
    result.className = "show error";
    result.innerText = "❌ Error: " + err.message;
    console.error(err);
  }
}

/////////////////////////////////////////////////////
// NAVIGATION - ONLY THIS CHANGED
// Changed from window.location.replace to window.location.href
// AND added to window object for global access
/////////////////////////////////////////////////////

function goBack() { 
  window.location.href = "dashboard.html"; 
}

/////////////////////////////////////////////////////
// INIT - ONLY ADDED window. assignments
/////////////////////////////////////////////////////

window.submitDeposit = submitDeposit;
window.goBack = goBack;
window.copyWallet = copyWallet;
window.updateWallet = updateWallet;

</script>
</body>
 </html>
