<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deposit Crypto</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Prevent back button after logout -->
  <script>
    if (window.history && window.history.pushState) {
      window.history.pushState(null, null, window.location.href);
      window.onpopstate = function() {
        window.history.pushState(null, null, window.location.href);
      };
    }
  </script>
</head>

<body>

<button onclick="goBack()">⬅ Back</button>

<div class="container">

  <h2>Deposit Crypto</h2>

  <label>Select Cryptocurrency</label><br>
  <select id="coin" onchange="updateWallet()">
    <option value="USDT">USDT</option>
    <option value="BTC">Bitcoin</option>
    <option value="ETH">Ethereum</option>
    <option value="BNB">BNB</option>
  </select>

  <br><br>

  <label>Wallet Address</label>
  <div style="display:flex; gap:10px;">
    <input id="wallet" readonly>
    <button onclick="copyWallet()">Copy</button>
  </div>

  <br>

  <input id="amount" placeholder="Enter amount">

  <br><br>

  <button onclick="submitDeposit()">Submit Deposit</button>
  
  <p id="result" style="color:green; font-weight:bold; margin-top:10px;"></p>

</div>

<script type="module">

import { auth, db } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { ref, push } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/////////////////////////////////////////////////////
// AUTH CHECK
/////////////////////////////////////////////////////

let currentUser = null;

onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.replace("login.html");
    return;
  }
  
  // Get username from session
  currentUser = sessionStorage.getItem("loggedInUser");
  if (!currentUser) {
    window.location.replace("login.html");
  }
});

/////////////////////////////////////////////////////
// WALLET SYSTEM
/////////////////////////////////////////////////////

const wallets = {
  USDT: "TXYZUSDT_COMPANY",
  BTC: "bc1qcompanybtc",
  ETH: "0xCOMPANYETH",
  BNB: "bnbCOMPANY"
};

function updateWallet() {
  let coin = document.getElementById("coin").value;
  document.getElementById("wallet").value = wallets[coin];
}

updateWallet();

/////////////////////////////////////////////////////
// SUBMIT DEPOSIT (REALTIME DATABASE)
/////////////////////////////////////////////////////

async function submitDeposit() {
  const result = document.getElementById("result");

  if (!currentUser) {
    result.style.color = "red";
    result.innerText = "Please login first!";
    return;
  }

  let amount = Number(document.getElementById("amount").value);
  let coin = document.getElementById("coin").value;

  if (!amount || amount <= 0) {
    result.style.color = "red";
    result.innerText = "Enter valid amount!";
    return;
  }

  try {
    result.style.color = "blue";
    result.innerText = "Submitting...";

    // Save to Realtime Database
    await push(ref(db, 'deposits'), {
      user: currentUser,
      coin: coin,
      amount: amount,
      wallet: wallets[coin],
      status: "pending",
      type: "deposit",
      time: Date.now()
    });

    result.style.color = "green";
    result.innerText = "✅ Deposit submitted! Waiting for admin approval.";
    document.getElementById("amount").value = "";

  } catch (err) {
    result.style.color = "red";
    result.innerText = "Error: " + err.message;
    console.error(err);
  }
}

/////////////////////////////////////////////////////
// NAVIGATION (USES REPLACE!)
/////////////////////////////////////////////////////

function goBack() {
  window.location.replace("dashboard.html");
}

function copyWallet() {
  let input = document.getElementById("wallet");
  input.select();
  document.execCommand("copy");
  alert("Wallet copied!");
}

window.submitDeposit = submitDeposit;
window.goBack = goBack;
window.copyWallet = copyWallet;
window.updateWallet = updateWallet;

</script>

</body>
</html>
