<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — SmartInvest</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- EmailJS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

  <!-- Prevent back button after logout -->
  <script>
    if (window.history && window.history.pushState) {
      window.history.pushState(null, null, window.location.href);
      window.onpopstate = function() {
        window.history.pushState(null, null, window.location.href);
      };
    }
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f0f1a;
      color: #e8e8ec;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-wrapper {
      width: 100%;
      max-width: 420px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #666680;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 32px;
      transition: color 0.2s ease;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    .back-link:hover {
      color: #ffbb33;
    }

    .back-link svg {
      width: 16px;
      height: 16px;
    }

    .login-card {
      background: rgba(25, 25, 40, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 24px;
      padding: 40px 36px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-header .logo-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #ffbb33, #ff8800);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 24px;
    }

    .login-header h2 {
      color: #fff;
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .login-header p {
      color: #666680;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      color: #8888a0;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      background: rgba(15, 15, 30, 0.6);
      color: #fff;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      transition: all 0.25s ease;
    }

    .form-group input::placeholder {
      color: #444460;
    }

    .form-group input:focus {
      outline: none;
      border-color: #ffbb33;
      box-shadow: 0 0 0 3px rgba(255, 187, 51, 0.1);
      background: rgba(15, 15, 30, 0.8);
    }

    .login-btn {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #00c851, #00b248);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.25s ease;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.3px;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 200, 81, 0.35);
    }

    .login-btn:active {
      transform: scale(0.98);
    }

    #result {
      text-align: center;
      padding: 12px 16px;
      border-radius: 10px;
      margin-top: 16px;
      font-weight: 600;
      font-size: 13px;
      display: none;
      font-family: 'Inter', sans-serif;
    }

    #result.show {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #result.success {
      background: rgba(0, 200, 81, 0.12);
      color: #00c851;
      border: 1px solid rgba(0, 200, 81, 0.25);
    }

    #result.error {
      background: rgba(255, 68, 68, 0.12);
      color: #ff4444;
      border: 1px solid rgba(255, 68, 68, 0.25);
    }

    #result.loading {
      background: rgba(51, 181, 229, 0.12);
      color: #33b5e5;
      border: 1px solid rgba(51, 181, 229, 0.25);
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 28px 0;
      color: #444460;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.06);
    }

    .divider span {
      padding: 0 16px;
    }

    .signup-link {
      text-align: center;
      color: #666680;
      font-size: 14px;
    }

    .signup-link a {
      color: #ffbb33;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .signup-link a:hover {
      color: #ff8800;
    }

    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(255, 187, 51, 0.15);
      border-radius: 50%;
      animation: float 15s infinite ease-in-out;
    }

    .particle:nth-child(1) { left: 10%; top: 80%; animation-delay: 0s; }
    .particle:nth-child(2) { left: 20%; top: 20%; animation-delay: 2s; }
    .particle:nth-child(3) { left: 35%; top: 60%; animation-delay: 4s; }
    .particle:nth-child(4) { left: 50%; top: 10%; animation-delay: 6s; }
    .particle:nth-child(5) { left: 65%; top: 70%; animation-delay: 8s; }
    .particle:nth-child(6) { left: 80%; top: 30%; animation-delay: 10s; }
    .particle:nth-child(7) { left: 90%; top: 85%; animation-delay: 12s; }
    .particle:nth-child(8) { left: 15%; top: 40%; animation-delay: 14s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.3; }
      50% { transform: translateY(-40px) scale(1.5); opacity: 0.8; }
    }

    .login-wrapper {
      position: relative;
      z-index: 1;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 32px 24px;
        border-radius: 20px;
      }
      .login-header h2 {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>

<div class="particles">
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
</div>

<div class="login-wrapper">

  <button class="back-link" onclick="goHome()">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
    </svg>
    Back to Home
  </button>

  <div class="login-card">

    <div class="login-header">
      <div class="logo-icon">📈</div>
      <h2>Welcome Back</h2>
      <p>Sign in to your SmartInvest account</p>
    </div>

    <form id="loginForm">

      <div class="form-group">
        <label>Email Address</label>
        <input id="email" type="email" placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input id="password" type="password" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="login-btn">Sign In</button>

      <p id="result"></p>

    </form>

    <div class="divider"><span>OR</span></div>

    <div class="signup-link">
      Don't have an account? <a onclick="goSignup()">Create Account</a>
    </div>

  </div>

</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/////////////////////////////////////////////////////
// EMAILJS INIT
/////////////////////////////////////////////////////
emailjs.init("adbMnb80leKvWnxdc");

function notifyAdmin(subject, message) {
  emailjs.send("service_axq48s8", "template_xmmwgim", {
    subject: subject,
    message: message,
    name: "SmartInvest Login",
    email: "noreply@smartinvest.com"
  }).then(() => {
    console.log("Login notification sent");
  }).catch((err) => {
    console.error("Email failed:", err);
  });
}

document.getElementById("loginForm").onsubmit = async function(event) {
  event.preventDefault();
  
  let email = document.getElementById("email").value.trim();
  let password = document.getElementById("password").value.trim();
  let result = document.getElementById("result");
  
  if (!email || !password) {
    result.className = "show error";
    result.innerText = "Please fill all fields!";
    return false;
  }
  
  result.className = "show loading";
  result.innerText = "Logging in...";
  
  try {
    const userCredential = await signInWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;
    
    const usersSnapshot = await get(ref(db, 'users'));
    
    if (!usersSnapshot.exists()) {
      result.className = "show error";
      result.innerText = "No users found in database.";
      return false;
    }
    
    let foundUser = null;
    usersSnapshot.forEach((childSnapshot) => {
      const userData = childSnapshot.val();
      if (userData.uid === user.uid) {
        foundUser = userData;
      }
    });
    
    if (!foundUser) {
      result.className = "show error";
      result.innerText = "Account data not found. Please contact support.";
      return false;
    }
    
    sessionStorage.setItem("loggedInUser", foundUser.username);
    sessionStorage.setItem("role", foundUser.role || "user");
    sessionStorage.setItem("uid", user.uid);
    
    // ===== SEND LOGIN NOTIFICATION =====
    notifyAdmin(
      "🔐 Login Alert — " + (foundUser.username || "User"),
      "User: " + (foundUser.username || "Unknown") + 
      "\nEmail: " + email +
      "\nAccount ID: " + (foundUser.accountId || "N/A") +
      "\nTime: " + new Date().toLocaleString() +
      "\nBalance: $" + (foundUser.balance || 0).toFixed(2)
    );
    
    result.className = "show success";
    result.innerText = "✅ Login successful! Redirecting...";
    
    setTimeout(() => {
      if ((foundUser.role || "user") === "admin") {
        window.location.href = "admin.html";
      } else {
        window.location.href = "dashboard.html";
      }
    }, 1500);
    
  } catch (error) {
    result.className = "show error";
    
    if (error.code === "auth/user-not-found") {
      result.innerText = "No account found. Please sign up.";
    } else if (error.code === "auth/wrong-password") {
      result.innerText = "Wrong password.";
    } else if (error.code === "auth/invalid-email") {
      result.innerText = "Invalid email.";
    } else if (error.code === "auth/too-many-requests") {
      result.innerText = "Too many tries. Wait 10 minutes.";
    } else if (error.code === "auth/invalid-credential") {
      result.innerText = "Wrong email or password.";
    } else {
      result.innerText = "Error: " + error.message;
    }
  }
  
  return false;
};

function goHome() { window.location.href = "index.html"; }
function goSignup() { window.location.href = "signup.html"; }

window.goHome = goHome;
window.goSignup = goSignup;
</script>

</body>
  </html>
