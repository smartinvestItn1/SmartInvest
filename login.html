<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <button onclick="window.location.href='index.html'">🏠 Home</button>
  
  <form id="loginForm">
    <h2>Login</h2>
    <input id="email" type="email" placeholder="Email" required><br>
    <input id="password" type="password" placeholder="Password" required><br><br>
    <button type="submit" id="loginBtn">Login</button>
    <p id="result" style="color:red; font-weight:bold; margin-top:10px;"></p>
  </form>
  
  <p onclick="window.location.href='signup.html'" style="color:blue; text-decoration:underline; cursor:pointer;">
    Don't have an account? Sign up
  </p>
</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const form = document.getElementById("loginForm");
const result = document.getElementById("result");

form.onsubmit = async function(event) {
  event.preventDefault();
  
  result.style.color = "blue";
  result.innerText = "Logging in... Please wait";
  
  try {
    let email = document.getElementById("email").value.trim();
    let password = document.getElementById("password").value.trim();
    
    if (!email || !password) {
      result.style.color = "red";
      result.innerText = "Please fill all fields";
      return false;
    }
    
    // Sign in with Firebase Auth
    result.innerText = "Checking your credentials...";
    const userCredential = await signInWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;
    
    // Get user data from Firestore
    result.innerText = "Loading your account...";
    const q = query(collection(db, "users"), where("uid", "==", user.uid));
    const querySnapshot = await getDocs(q);
    
    if (querySnapshot.empty) {
      result.style.color = "red";
      result.innerText = "Account data not found. Please contact support.";
      return false;
    }
    
    const userData = querySnapshot.docs[0].data();
    
    // Save session
    sessionStorage.setItem("loggedInUser", userData.username);
    sessionStorage.setItem("role", userData.role || "user");
    sessionStorage.setItem("uid", user.uid);
    
    // Success
    result.style.color = "green";
    result.innerText = "✅ Login successful! Redirecting...";
    
    setTimeout(() => {
      if ((userData.role || "user") === "admin") {
        window.location.href = "admin.html";
      } else {
        window.location.href = "dashboard.html";
      }
    }, 1000);
    
  } catch (error) {
    result.style.color = "red";
    
    let msg = error.message;
    if (error.code === "auth/user-not-found") msg = "No account found with this email. Please sign up first.";
    if (error.code === "auth/wrong-password") msg = "Incorrect password. Please try again.";
    if (error.code === "auth/invalid-email") msg = "Invalid email address.";
    if (error.code === "auth/invalid-credential") msg = "Invalid email or password.";
    if (error.code === "auth/too-many-requests") msg = "Too many failed attempts. Wait 10 minutes.";
    if (error.code === "auth/network-request-failed") msg = "No internet connection.";
    
    result.innerText = "❌ " + msg;
    console.error(error);
  }
  
  return false;
};
</script>

</body>
</html>
