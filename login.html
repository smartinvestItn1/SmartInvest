<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

  <button onclick="goHome()">🏠 Home</button>

  <form onsubmit="login(event)">

    <h2>Login</h2>

    <input
      id="username"
      placeholder="Username"
      required
    ><br>

    <input
      id="password"
      type="password"
      placeholder="Password"
      required
    ><br><br>

    <button type="submit">
      Login
    </button>

    <p id="result" class="message"></p>

  </form>

  <p onclick="goSignup()" class="link">
    Don't have an account? Sign up
  </p>

</div>


<script type="module">

/////////////////////////////////////////////////////
// IMPORT FIREBASE
/////////////////////////////////////////////////////

import { db } from "./firebase.js";

import {

  collection,

  getDocs,

  query,

  where

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/////////////////////////////////////////////////////
// LOGIN
/////////////////////////////////////////////////////

async function login(event) {

  event.preventDefault();

  try {

    let username =
      document.getElementById("username").value.trim();

    let password =
      document.getElementById("password").value.trim();

    let result =
      document.getElementById("result");


    /////////////////////////////////////////////////////
    // VALIDATION
    /////////////////////////////////////////////////////

    if (!username || !password) {

      result.innerText = "Fill all fields";

      result.className = "message error";

      return;
    }


    /////////////////////////////////////////////////////
    // CHECK USER
    /////////////////////////////////////////////////////

    const q = query(

      collection(db, "users"),

      where("username", "==", username)

    );

    const querySnapshot = await getDocs(q);


    if (querySnapshot.empty) {

      result.innerText = "User not found";

      result.className = "message error";

      return;
    }


    let foundUser = null;

    querySnapshot.forEach((doc) => {

      const userData = doc.data();

      if (userData.password === password) {

        foundUser = userData;

      }

    });


    /////////////////////////////////////////////////////
    // INVALID PASSWORD
    /////////////////////////////////////////////////////

    if (!foundUser) {

      result.innerText = "Invalid password";

      result.className = "message error";

      return;
    }


    /////////////////////////////////////////////////////
    // SAVE SESSION
    /////////////////////////////////////////////////////

    sessionStorage.setItem(
      "loggedInUser",
      foundUser.username
    );


    /////////////////////////////////////////////////////
    // SUCCESS
    /////////////////////////////////////////////////////

    result.innerText = "Login Successful ✔";

    result.className = "message success";


    setTimeout(() => {

      window.location.replace(

        foundUser.username.toLowerCase().includes("admin")

        ? "admin.html"

        : "dashboard.html"

      );

    }, 800);

  }

  catch (error) {

    console.error(error);

    alert(error.message);

  }

}


/////////////////////////////////////////////////////
// NAVIGATION
/////////////////////////////////////////////////////

function goHome() {

  window.location.href = "index.html";

}

function goSignup() {

  window.location.href = "signup.html";

}


/////////////////////////////////////////////////////
// GLOBAL ACCESS
/////////////////////////////////////////////////////

window.login = login;

window.goHome = goHome;

window.goSignup = goSignup;

</script>

</body>

</html>
