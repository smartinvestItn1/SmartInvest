<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <button onclick="goHome()">🏠 Home</button>
  
  <form id="loginForm">
    <h2>Login</h2>
    <input id="email" type="email" placeholder="Email" required><br>
    <input id="password" type="password" placeholder="Password" required><br><br>
    <button type="submit">Login</button>
    <p id="result" class="message"></p>
  </form>
  
  <p onclick="goSignup()" class="link">Don't have an account? Sign up</p>
</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

document.getElementById("loginForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  const result = document.getElementById("result");

  try {
    let email = document.getElementById("email").value.trim();
    let password = document.getElementById("password").value.trim();

    if (!email || !password) {
      result.innerText = "Please fill all fields";
      result.className = "message error";
      return;
    }

    // ✅ SIGN IN WITH FIREBASE AUTH
    const userCredential = await signInWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;

    // Get user data from Firestore using UID
    const q = query(collection(db, "users"), where("uid", "==", user.uid));
    const querySnapshot = await getDocs(q);

    if (querySnapshot.empty) {
      result.innerText = "User data not found";
      result.className = "message error";
      return;
    }

    const userData = querySnapshot.docs[0].data();

    // Save session
    sessionStorage.setItem("loggedInUser", userData.username);
    sessionStorage.setItem("role", userData.role || "user");
    sessionStorage.setItem("uid", user.uid);

    result.innerText = "Login Successful ✔";
    result.className = "message success";

    setTimeout(() => {
      if ((userData.role || "user") === "admin") {
        window.location.replace("admin.html");
      } else {
        window.location.replace("dashboard.html");
      }
    }, 800);

  } catch (error) {
    console.error("Login error:", error);
    
    let msg = error.message;
    if (error.code === "auth/user-not-found") msg = "No account found with this email";
    if (error.code === "auth/wrong-password") msg = "Incorrect password";
    if (error.code === "auth/invalid-email") msg = "Invalid email address";
    if (error.code === "auth/invalid-credential") msg = "Invalid email or password";
    
    result.innerText = msg;
    result.className = "message error";
  }
});

function goHome() { window.location.href = "index.html"; }
function goSignup() { window.location.href = "signup.html"; }
window.goHome = goHome;
window.goSignup = goSignup;
</script>

</body>
</html>
