<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <button onclick="goHome()">🏠 Home</button>

  <form onsubmit="login(event)">

    <h2>Login</h2>

    <input id="username" placeholder="Username" required><br>
    <input id="password" type="password" placeholder="Password" required><br><br>

    <button type="submit">Login</button>
    <p id="result" class="message"></p>
  </form>

  <p onclick="goSignup()" class="link">
    Don't have an account? Sign up
  </p>

</div>

<script>

/////////////////////////////////////////////////////
// SAFE LOGIN
/////////////////////////////////////////////////////

function login(event) {
  event.preventDefault();

  let username = document.getElementById("username").value.trim();
  let password = document.getElementById("password").value.trim();
  let result = document.getElementById("result");

  if (!username || !password) {
    show("Please fill all fields ❌", "error");
    return;
  }

  /////////////////////////////////////////////////////
  // CLEAR OLD SESSION BEFORE LOGIN (IMPORTANT FIX)
  /////////////////////////////////////////////////////

  localStorage.removeItem("loggedInUser");
  localStorage.removeItem("role");
  localStorage.removeItem("sessionId");

  let sessions = JSON.parse(localStorage.getItem("activeSessions")) || [];

  /////////////////////////////////////////////////////
  // ADMIN LOGIN
  /////////////////////////////////////////////////////

  const admins = [
    { username: "admin1", password: "123##**@@", role: "admin" },
    { username: "admin2", password: "123##**@@", role: "admin" },
    { username: "admin3", password: "123##**@@", role: "admin" },
    { username: "admin4", password: "123##**@@", role: "admin" }
  ];

  let admin = admins.find(a =>
    a.username === username && a.password === password
  );

  if (admin) {
    createSession(username, "admin", sessions);
    show("Admin Login Successful ✔", "success");

    setTimeout(() => {
      window.location.replace("admin.html");
    }, 800);

    return;
  }

  /////////////////////////////////////////////////////
  // USER LOGIN
  /////////////////////////////////////////////////////

  let users = JSON.parse(localStorage.getItem("users")) || [];

  let foundUser = users.find(u =>
    String(u.username) === String(username) &&
    String(u.password) === String(password)
  );

  if (foundUser) {
    createSession(username, "user", sessions);
    show("Login Successful ✔", "success");

    setTimeout(() => {
      window.location.replace("dashboard.html");
    }, 800);

  } else {
    show("Invalid username or password ❌", "error");
  }
}

/////////////////////////////////////////////////////
// SESSION SYSTEM (FIXED)
/////////////////////////////////////////////////////
function createSession(username, role) {

  let sessions = JSON.parse(localStorage.getItem("activeSessions")) || [];

  // remove existing session of this user (no duplicates)
  sessions = sessions.filter(s => s.username !== username);

  let sessionId = Date.now() + "_" + Math.random().toString(36).slice(2, 10);

  // add new session
  sessions.push({
    username,
    role,
    sessionId
  });

  // 🔥 LIMIT USERS PER DEVICE (3 MAX)
  if (sessions.length > 3) {
    sessions.shift(); // remove oldest user
  }

  localStorage.setItem("activeSessions", JSON.stringify(sessions));

  // current active session
  localStorage.setItem("sessionId", sessionId);
  localStorage.setItem("loggedInUser", username);
  localStorage.setItem("role", role);
}

/////////////////////////////////////////////////////
// UI MESSAGE HELPER
/////////////////////////////////////////////////////

function show(text, type) {
  let result = document.getElementById("result");
  result.innerText = text;
  result.className = "message " + type;
}

/////////////////////////////////////////////////////
// NAVIGATION
/////////////////////////////////////////////////////

function goHome() {
  window.location.href = "index.html";
}

function goSignup() {
  window.location.href = "signup.html";
}

</script>

</body>
</html>
