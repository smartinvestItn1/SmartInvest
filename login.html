<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <button onclick="goHome()">🏠 Home</button>
  
  <form id="loginForm">
    <h2>Login</h2>
    <input id="username" placeholder="Username" required><br>
    <input id="password" type="password" placeholder="Password" required><br><br>
    <button type="submit">Login</button>
    <p id="result" class="message"></p>
  </form>
  
  <p onclick="goSignup()" class="link">Don't have an account? Sign up</p>
</div>

<script type="module">
import { db } from "./firebase.js";
import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Attach event listener instead of inline onsubmit
document.getElementById("loginForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  
  console.log("Login submitted"); // Check console instead of alert

  try {
    let username = document.getElementById("username").value.trim().toLowerCase();
    let password = document.getElementById("password").value.trim();
    let result = document.getElementById("result");

    if (!username || !password) {
      result.innerText = "Please fill all fields";
      result.className = "message error";
      return;
    }

    // Show loading state
    result.innerText = "Checking...";
    result.className = "message";

    const usersSnap = await getDocs(collection(db, "users"));
    let foundUser = null;

    usersSnap.forEach((doc) => {
      const u = doc.data();
      if ((u.username || "").trim().toLowerCase() === username && (u.password || "").trim() === password) {
        foundUser = u;
      }
    });

    if (!foundUser) {
      result.innerText = "Invalid username or password";
      result.className = "message error";
      return;
    }

    // Success
    sessionStorage.setItem("loggedInUser", foundUser.username);
    sessionStorage.setItem("role", foundUser.role || "user");

    result.innerText = "Login Successful ✔";
    result.className = "message success";

    setTimeout(() => {
      if ((foundUser.role || "user") === "admin") {
        window.location.replace("admin.html");
      } else {
        window.location.replace("dashboard.html");
      }
    }, 800);

  } catch (error) {
    console.error("Login error:", error);
    result.innerText = "Error: " + error.message;
    result.className = "message error";
  }
});

// Navigation functions
function goHome() {
  window.location.href = "index.html";
}

function goSignup() {
  window.location.href = "signup.html";
}

window.goHome = goHome;
window.goSignup = goSignup;
</script>

</body>
</html>
