<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <button onclick="goHome()">🏠 Home</button>

  <form onsubmit="login(event)">

    <h2>Login</h2>

    <input id="username" placeholder="Username" required><br>
    <input id="password" type="password" placeholder="Password" required><br><br>

    <button type="submit">Login</button>
    <p id="result" class="message"></p>
  </form>

  <p onclick="goSignup()" class="link">
    Don't have an account? Sign up
  </p>

</div>

<!-- Firebase file is loaded (keep if you use it later) -->
<script type="module" src="firebase.js"></script>

<script type="module">
import { db } from "./firebase.js";
import { collection, getDocs } 
from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

async function login(event) {
  event.preventDefault();

  let username = document.getElementById("username").value.trim();
  let password = document.getElementById("password").value.trim();

  if (!username || !password) {
    alert("Fill all fields");
    return;
  }

  let usersSnap = await getDocs(collection(db, "users"));

  let foundUser = null;

  usersSnap.forEach(doc => {
    let u = doc.data();
    if (u.username === username && u.password === password) {
      foundUser = u;
    }
  });

  if (!foundUser) {
    alert("Invalid username or password");
    return;
  }

  // session only (NOT localStorage for users)
  sessionStorage.setItem("loggedInUser", foundUser.username);

  if (foundUser.username.includes("admin")) {
    window.location.replace("admin.html");
  } else {
    window.location.replace("dashboard.html");
  }
}

window.login = login;
</script>

</body>
</html>
