<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Prevent back button after logout -->
  <script>
    if (window.history && window.history.pushState) {
      window.history.pushState(null, null, window.location.href);
      window.onpopstate = function() {
        window.history.pushState(null, null, window.location.href);
      };
    }
  </script>
  
  <style>
    /* DARK THEME - SAME AS DASHBOARD */
    body {
      background: #0f0f1a;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card{
  background: linear-gradient(145deg,#1a1a2e,#151525);
  border-radius:24px;
  padding:40px;
  border:1px solid #2a2a4e;
  box-shadow:
    0 15px 40px rgba(0,0,0,.45),
    inset 0 1px 1px rgba(255,255,255,.05);
  backdrop-filter: blur(10px);
}

.home-btn{
  background:#1a1a2e;
  border:1px solid #2a2a4e;
  color:#aaa;
  padding:12px 20px;
  border-radius:12px;
  cursor:pointer;
  margin-bottom:20px;
  font-size:14px;
  display:flex;
  align-items:center;
  gap:8px;
  transition:.3s ease;
}

.home-btn:hover{
  color:#fff;
  transform:translateY(-2px);
  box-shadow:0 0 15px rgba(255,255,255,.08);
}

.login-header{
  text-align:center;
  margin-bottom:30px;
}

.login-header h2{
  color:#ffbb33;
  margin:0;
  font-size:30px;
  font-weight:700;
}

.login-header p{
  color:#888;
  margin:10px 0 0;
  font-size:14px;
}

.form-group input{
  width:100%;
  padding:15px 16px;
  border-radius:14px;
  border:1px solid #2a2a4e;
  background:#0f3460;
  color:#fff;
  font-size:16px;
  box-sizing:border-box;
  transition:.3s ease;
}

.form-group input:focus{
  outline:none;
  border-color:#33b5e5;
  box-shadow:0 0 15px rgba(51,181,229,.25);
}

.form-group input::placeholder{
  color:#666;
}

.login-btn{
  width:100%;
  padding:18px;
  border-radius:14px;
  border:none;
  background:linear-gradient(135deg,#00c851,#00b248);
  color:#fff;
  font-size:18px;
  font-weight:700;
  cursor:pointer;
  margin-top:10px;
  transition:.3s ease;

  box-shadow:
    0 10px 25px rgba(0,200,81,.25);
}

.login-btn:hover{
  transform:translateY(-3px);
  box-shadow:
    0 15px 35px rgba(0,200,81,.4);
}

.login-btn:active{
  transform:scale(.98);
}
    
    #result {
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      margin-top: 15px;
      font-weight: bold;
      font-size: 14px;
      display: none;
    }
    
    #result.show {
      display: block;
    }
    
    #result.success {
      background: rgba(0, 200, 81, 0.2);
      color: #00c851;
      border: 1px solid #00c851;
    }
    
    #result.error {
      background: rgba(255, 68, 68, 0.2);
      color: #ff4444;
      border: 1px solid #ff4444;
    }
    
    #result.loading {
      background: rgba(51, 181, 229, 0.2);
      color: #33b5e5;
      border: 1px solid #33b5e5;
    }
    
    .signup-link {
      text-align: center;
      margin-top: 25px;
      color: #888;
      font-size: 14px;
    }
    
    .signup-link a {
      color: #ffbb33;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    
    .signup-link a:hover {
      text-decoration: underline;
    }
    
    .divider {
      display: flex;
      align-items: center;
      margin: 25px 0;
      color: #444;
      font-size: 12px;
    }
    
    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #2a2a4e;
    }
    
    .divider span {
      padding: 0 15px;
    }
  </style>
</head>
<body>

<div class="login-container">

  <button class="home-btn" onclick="goHome()">🏠 Home</button>

  <div class="login-card">
    
    <div class="login-header">
      <h2>Welcome Back</h2>
      <p>Sign in to your SmartInvest account</p>
    </div>
    
    <form id="loginForm">
      
      <div class="form-group">
        <label>Email Address</label>
        <input id="email" type="email" placeholder="Enter your email" required>
      </div>
      
      <div class="form-group">
        <label>Password</label>
        <input id="password" type="password" placeholder="Enter your password" required>
      </div>
      
      <button type="submit" class="login-btn">Sign In</button>
      
      <p id="result"></p>
      
    </form>
    
    <div class="divider"><span>OR</span></div>
    
    <div class="signup-link">
      Don't have an account? <a onclick="goSignup()">Create Account</a>
    </div>
    
  </div>

</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

document.getElementById("loginForm").onsubmit = async function(event) {
  event.preventDefault();
  
  let email = document.getElementById("email").value.trim();
  let password = document.getElementById("password").value.trim();
  let result = document.getElementById("result");
  
  if (!email || !password) {
    result.className = "show error";
    result.innerText = "Please fill all fields!";
    return false;
  }
  
  result.className = "show loading";
  result.innerText = "Logging in...";
  
  try {
    const userCredential = await signInWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;
    
    const usersSnapshot = await get(ref(db, 'users'));
    
    if (!usersSnapshot.exists()) {
      result.className = "show error";
      result.innerText = "No users found in database.";
      return false;
    }
    
    let foundUser = null;
    usersSnapshot.forEach((childSnapshot) => {
      const userData = childSnapshot.val();
      if (userData.uid === user.uid) {
        foundUser = userData;
      }
    });
    
    if (!foundUser) {
      result.className = "show error";
      result.innerText = "Account data not found. Please contact support.";
      return false;
    }
    
    sessionStorage.setItem("loggedInUser", foundUser.username);
    sessionStorage.setItem("role", foundUser.role || "user");
    sessionStorage.setItem("uid", user.uid);
    
    result.className = "show success";
    result.innerText = "✅ Login successful! Redirecting...";
    
    setTimeout(() => {
      if ((foundUser.role || "user") === "admin") {
        window.location.href = "admin.html";
      } else {
        window.location.href = "dashboard.html";
      }
    }, 1500);
    
  } catch (error) {
    result.className = "show error";
    
    if (error.code === "auth/user-not-found") {
      result.innerText = "No account found. Please sign up.";
    } else if (error.code === "auth/wrong-password") {
      result.innerText = "Wrong password.";
    } else if (error.code === "auth/invalid-email") {
      result.innerText = "Invalid email.";
    } else if (error.code === "auth/too-many-requests") {
      result.innerText = "Too many tries. Wait 10 minutes.";
    } else if (error.code === "auth/invalid-credential") {
      result.innerText = "Wrong email or password.";
    } else {
      result.innerText = "Error: " + error.message;
    }
  }
  
  return false;
};

function goHome() { window.location.href = "index.html"; }
function goSignup() { window.location.href = "signup.html"; }

window.goHome = goHome;
window.goSignup = goSignup;

</script>
</body>
 </html>
