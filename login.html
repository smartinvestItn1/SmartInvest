<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — SmartInvest</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a14;
      color: #e8e8ec;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Animated background glow */
    body::before {
      content: "";
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 50% 50%, rgba(255, 187, 51, 0.03) 0%, transparent 50%),
                  radial-gradient(circle at 20% 80%, rgba(255, 136, 0, 0.02) 0%, transparent 40%);
      pointer-events: none;
      z-index: 0;
      animation: bgPulse 8s ease-in-out infinite;
    }

    @keyframes bgPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.8; }
    }

    .login-wrapper {
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
    }

    /* Back link */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #666680;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 24px;
      transition: all 0.2s ease;
      cursor: pointer;
      background: none;
      border: none;
      padding: 8px 12px;
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
    }

    .back-link:hover {
      color: #ffbb33;
      background: rgba(255, 187, 51, 0.05);
    }

    .back-link svg {
      width: 16px;
      height: 16px;
    }

    /* Card */
    .login-card {
      background: linear-gradient(145deg, rgba(25, 25, 40, 0.9), rgba(15, 15, 30, 0.95));
      border: 1px solid rgba(255, 187, 51, 0.08);
      border-radius: 24px;
      padding: 40px 32px;
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5),
                  0 0 0 1px rgba(255, 187, 51, 0.05),
                  inset 0 1px 0 rgba(255, 255, 255, 0.03);
      position: relative;
      overflow: hidden;
    }

    /* Subtle top glow line */
    .login-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 20%;
      right: 20%;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255, 187, 51, 0.3), transparent);
      border-radius: 2px;
    }

    /* Header */
    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-ring {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(255, 187, 51, 0.15), rgba(255, 136, 0, 0.1));
      border: 1.5px solid rgba(255, 187, 51, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 28px;
      position: relative;
    }

    .logo-ring::after {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 24px;
      border: 1px solid rgba(255, 187, 51, 0.1);
      animation: ringPulse 3s ease-in-out infinite;
    }

    @keyframes ringPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.5; }
    }

    .login-header h2 {
      color: #fff;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }

    .login-header p {
      color: #666680;
      font-size: 14px;
      line-height: 1.5;
    }

    /* Social proof */
    .social-proof {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 28px;
      padding: 10px 16px;
      background: rgba(0, 200, 81, 0.08);
      border: 1px solid rgba(0, 200, 81, 0.15);
      border-radius: 12px;
    }

    .social-proof .avatars {
      display: flex;
    }

    .social-proof .avatars span {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffbb33, #ff8800);
      border: 2px solid #0f0f1a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      margin-left: -6px;
    }

    .social-proof .avatars span:first-child {
      margin-left: 0;
    }

    .social-proof p {
      font-size: 12px;
      color: #00c851;
      font-weight: 500;
    }

    /* Form */
    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      color: #8888a0;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .password-wrapper {
      position: relative;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1.5px solid rgba(255, 255, 255, 0.06);
      background: rgba(10, 10, 20, 0.6);
      color: #fff;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      transition: all 0.25s ease;
    }

    .form-group input::placeholder {
      color: #444460;
    }

    .form-group input:focus {
      outline: none;
      border-color: rgba(255, 187, 51, 0.4);
      box-shadow: 0 0 0 4px rgba(255, 187, 51, 0.08), 0 0 20px rgba(255, 187, 51, 0.05);
      background: rgba(10, 10, 20, 0.8);
    }

    .password-wrapper input {
      padding-right: 50px;
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #555570;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      border-radius: 8px;
    }

    .toggle-password:hover {
      color: #ffbb33;
      background: rgba(255, 187, 51, 0.08);
    }

    .toggle-password svg {
      width: 18px;
      height: 18px;
    }

    /* Forgot password */
    .forgot-password {
      text-align: right;
      margin-top: -8px;
      margin-bottom: 20px;
    }

    .forgot-password a {
      color: #ffbb33;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .forgot-password a::after {
      content: "";
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, #ffbb33, #ff8800);
      transition: width 0.3s ease;
      border-radius: 2px;
    }

    .forgot-password a:hover::after {
      width: 100%;
    }

    .forgot-password a:hover {
      color: #ff8800;
    }

    /* Button - ORANGE/GOLD now */
    .login-btn {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #ffbb33, #ff8800);
      color: #0a0a14;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
      transition: all 0.3s ease;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.3px;
      position: relative;
      overflow: hidden;
    }

    .login-btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s ease;
    }

    .login-btn:hover::before {
      left: 100%;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 35px rgba(255, 187, 51, 0.25);
    }

    .login-btn:active {
      transform: scale(0.98);
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Result message */
    #result {
      text-align: center;
      padding: 14px 16px;
      border-radius: 12px;
      margin-top: 16px;
      font-weight: 600;
      font-size: 13px;
      display: none;
      font-family: 'Inter', sans-serif;
      line-height: 1.5;
    }

    #result.show {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #result.success {
      background: rgba(0, 200, 81, 0.1);
      color: #00c851;
      border: 1px solid rgba(0, 200, 81, 0.2);
    }

    #result.error {
      background: rgba(255, 68, 68, 0.1);
      color: #ff4444;
      border: 1px solid rgba(255, 68, 68, 0.2);
    }

    #result.loading {
      background: rgba(51, 181, 229, 0.1);
      color: #33b5e5;
      border: 1px solid rgba(51, 181, 229, 0.2);
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      margin: 28px 0;
      color: #333350;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
    }

    .divider span {
      padding: 0 20px;
    }

    /* Signup link */
    .signup-link {
      text-align: center;
      color: #666680;
      font-size: 14px;
      padding: 4px;
    }

    .signup-link a {
      color: #ffbb33;
      text-decoration: none;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .signup-link a::after {
      content: "";
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, #ffbb33, #ff8800);
      transition: width 0.3s ease;
      border-radius: 2px;
    }

    .signup-link a:hover::after {
      width: 100%;
    }

    .signup-link a:hover {
      color: #ff8800;
    }

    /* Security badges */
    .security-badges {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }

    .security-badges span {
      font-size: 11px;
      color: #444460;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(5px);
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background: linear-gradient(145deg, rgba(30, 30, 45, 0.98), rgba(20, 20, 35, 0.98));
      border: 1px solid rgba(255, 187, 51, 0.1);
      border-radius: 24px;
      padding: 36px 32px;
      width: 100%;
      max-width: 400px;
      position: relative;
      animation: modalSlideIn 0.3s ease;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.6);
    }

    @keyframes modalSlideIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .modal-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .modal-header h3 {
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .modal-header p {
      color: #666680;
      font-size: 14px;
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      color: #666680;
      cursor: pointer;
      padding: 4px;
      transition: color 0.2s ease;
    }

    .modal-close:hover {
      color: #ffbb33;
    }

    .modal-close svg {
      width: 24px;
      height: 24px;
    }

    .modal-btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #ffbb33, #ff8800);
      color: #0a0a14;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 16px;
      transition: all 0.25s ease;
      font-family: 'Inter', sans-serif;
    }

    .modal-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 187, 51, 0.3);
    }

    .modal-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Floating orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    .orb-1 {
      width: 300px;
      height: 300px;
      background: rgba(255, 187, 51, 0.08);
      top: -100px;
      right: -100px;
      animation: orbFloat 20s ease-in-out infinite;
    }

    .orb-2 {
      width: 200px;
      height: 200px;
      background: rgba(255, 136, 0, 0.06);
      bottom: -50px;
      left: -50px;
      animation: orbFloat 25s ease-in-out infinite reverse;
    }

    @keyframes orbFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -30px) scale(1.1); }
      66% { transform: translate(-20px, 20px) scale(0.9); }
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 32px 24px;
        border-radius: 20px;
      }
      .login-header h2 {
        font-size: 22px;
      }
      .modal-card {
        padding: 28px 24px;
      }
    }
  </style>
</head>
<body>

<!-- Background orbs -->
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="login-wrapper">

  <button class="back-link" onclick="goHome()">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
    </svg>
    Back to Home
  </button>

  <div class="login-card">

    <div class="login-header">
      <div class="logo-ring">📈</div>
      <h2>Welcome Back</h2>
      <p>Sign in to your SmartInvest account</p>
    </div>

    <!-- Social proof -->
    <div class="social-proof">
      <div class="avatars">
        <span>👤</span>
        <span>👤</span>
        <span>👤</span>
      </div>
      <p>Trusted by millions of investors</p>
    </div>

    <form id="loginForm">

      <div class="form-group">
        <label>Email Address</label>
        <input id="email" type="email" placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="password-wrapper">
          <input id="password" type="password" placeholder="Enter your password" required>
          <button type="button" class="toggle-password" onclick="togglePassword()" title="Show/Hide Password">
            <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
      </div>

      <div class="forgot-password">
        <a onclick="openForgotPassword()">Forgot Password?</a>
      </div>

      <button type="submit" class="login-btn">Sign In</button>

      <p id="result"></p>

    </form>

    <div class="divider"><span>OR</span></div>

    <div class="signup-link">
      Don't have an account? <a onclick="goSignup()">Create Account</a>
    </div>

    <!-- Security badges -->
    <div class="security-badges">
      <span>🔒 SSL Secured</span>
      <span>🛡️ 256-bit</span>
      <span>✓ Verified</span>
    </div>

  </div>

</div>

<!-- Forgot Password Modal -->
<div class="modal-overlay" id="forgotPasswordModal">
  <div class="modal-card">
    <button class="modal-close" onclick="closeForgotPassword()">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
    <div class="modal-header">
      <h3>Reset Password</h3>
      <p>Enter your email and we'll send you a reset link</p>
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <input id="reset-email" type="email" placeholder="Enter your email">
    </div>
    <button class="modal-btn" id="reset-btn" onclick="sendResetEmail()">Send Reset Link</button>
    <p id="reset-result" style="text-align: center; margin-top: 12px; font-size: 13px; font-weight: 600; display: none;"></p>
  </div>
</div>

<script type="module">
  import { auth, db } from "./firebase.js";
import { signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

emailjs.init("adbMnb80leKvWnxdc");

function notifyAdmin(subject, message) {
  emailjs.send("service_axq48s8", "template_xmmwgim", {
    subject: subject,
    message: message,
    name: "SmartInvest Login",
    email: "noreply@smartinvest.com"
  }).then(() => {
    console.log("Login notification sent");
  }).catch((err) => {
    console.error("Email failed:", err);
  });
}

window.togglePassword = function() {
  const passwordInput = document.getElementById("password");
  const eyeIcon = document.getElementById("eye-icon");
  
  if (passwordInput.type === "password") {
    passwordInput.type = "text";
    eyeIcon.innerHTML = `
      <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
    `;
  } else {
    passwordInput.type = "password";
    eyeIcon.innerHTML = `
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
    `;
  }
};

window.openForgotPassword = function() {
  document.getElementById("forgotPasswordModal").classList.add("active");
  document.getElementById("reset-email").value = document.getElementById("email").value;
};

window.closeForgotPassword = function() {
  document.getElementById("forgotPasswordModal").classList.remove("active");
  document.getElementById("reset-result").style.display = "none";
};

window.sendResetEmail = async function() {
  const email = document.getElementById("reset-email").value.trim();
  const result = document.getElementById("reset-result");
  const btn = document.getElementById("reset-btn");
  
  if (!email) {
    result.style.display = "block";
    result.style.color = "#ff4444";
    result.innerText = "Please enter your email!";
    return;
  }
  
  btn.disabled = true;
  btn.innerText = "Sending...";
  result.style.display = "block";
  result.style.color = "#33b5e5";
  result.innerText = "Sending reset link...";
  
  try {
    await sendPasswordResetEmail(auth, email);
    result.style.color = "#00c851";
    result.innerText = "✅ Reset link sent! Check your inbox and spam folder.";
    btn.innerText = "Sent!";
    
    setTimeout(() => {
      closeForgotPassword();
      btn.disabled = false;
      btn.innerText = "Send Reset Link";
    }, 3000);
    
  } catch (error) {
    btn.disabled = false;
    btn.innerText = "Send Reset Link";
    result.style.color = "#ff4444";
    
    if (error.code === "auth/user-not-found") {
      result.innerText = "No account found with this email.";
    } else if (error.code === "auth/invalid-email") {
      result.innerText = "Invalid email address.";
    } else {
      result.innerText = "Error: " + error.message;
    }
  }
};

window.onclick = function(event) {
  const modal = document.getElementById("forgotPasswordModal");
  if (event.target === modal) {
    closeForgotPassword();
  }
};

document.getElementById("loginForm").onsubmit = async function(event) {
  event.preventDefault();
  
  let email = document.getElementById("email").value.trim();
  let password = document.getElementById("password").value.trim();
  let result = document.getElementById("result");
  
  if (!email || !password) {
    result.className = "show error";
    result.innerText = "Please fill all fields!";
    return false;
  }
  
  result.className = "show loading";
  result.innerText = "Logging in...";
  
  try {
    const userCredential = await signInWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;
    
    const usersSnapshot = await get(ref(db, 'users'));
    
    if (!usersSnapshot.exists()) {
      result.className = "show error";
      result.innerText = "No users found in database.";
      return false;
    }
    
    let foundUser = null;
    usersSnapshot.forEach((childSnapshot) => {
      const userData = childSnapshot.val();
      if (userData.uid === user.uid) {
        foundUser = userData;
      }
    });
    
    if (!foundUser) {
      result.className = "show error";
      result.innerText = "Account data not found. Please contact support.";
      return false;
    }
    
    sessionStorage.setItem("loggedInUser", foundUser.username);
    sessionStorage.setItem("role", foundUser.role || "user");
    sessionStorage.setItem("uid", user.uid);
    
    notifyAdmin(
      "🔐 Login Alert — " + (foundUser.username || "User"),
      "User: " + (foundUser.username || "Unknown") + 
      "\nEmail: " + email +
      "\nAccount ID: " + (foundUser.accountId || "N/A") +
      "\nTime: " + new Date().toLocaleString() +
      "\nBalance: $" + (foundUser.balance || 0).toFixed(2)
    );
    
    result.className = "show success";
    result.innerText = "✅ Login successful! Redirecting...";
    
    setTimeout(() => {
      if ((foundUser.role || "user") === "admin") {
        window.location.href = "admin.html";
      } else {
        window.location.href = "dashboard.html";
      }
    }, 1500);
    
  } catch (error) {
    result.className = "show error";
    
    if (error.code === "auth/user-not-found") {
      result.innerText = "No account found. Please sign up.";
    } else if (error.code === "auth/wrong-password") {
      result.innerText = "Wrong password.";
    } else if (error.code === "auth/invalid-email") {
      result.innerText = "Invalid email.";
    } else if (error.code === "auth/too-many-requests") {
      result.innerText = "Too many tries. Wait 10 minutes.";
    } else if (error.code === "auth/invalid-credential") {
      result.innerText = "Wrong email or password.";
    } else {
      result.innerText = "Error: " + error.message;
    }
  }
  
  return false;
};

function goHome() { window.location.href = "index.html"; }
function goSignup() { window.location.href = "signup.html"; }

window.goHome = goHome;
window.goSignup = goSignup;

</script>
