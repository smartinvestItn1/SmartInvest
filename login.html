<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <button onclick="goHome()">🏠 Home</button>

  <form onsubmit="login(event)">

    <h2>Login</h2>

    <input id="username" placeholder="Username" required><br>
    <input id="password" type="password" placeholder="Password" required><br><br>

    <button type="submit">Login</button>
    <p id="result" class="message"></p>
  </form>

  <p onclick="goSignup()" class="link">
    Don't have an account? Sign up
  </p>

</div>
<script type="module">

import { db } from "./firebase.js";
import { collection, getDocs } 
from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

/////////////////////////////////////////////////////
// LOGIN
/////////////////////////////////////////////////////

async function login(event) {
  event.preventDefault();

  try {

    let username = document.getElementById("username").value.trim();
    let password = document.getElementById("password").value.trim();

    if (!username || !password) {
      alert("Fill all fields");
      return;
    }

    const usersSnap = await getDocs(collection(db, "users"));

    let foundUser = null;

    usersSnap.forEach(doc => {
      const u = doc.data();

      if (
        (u.username || "").toLowerCase() === username.toLowerCase() &&
        (u.password || "") === password
      ) {
        foundUser = u;
      }
    });

    if (!foundUser) {
      alert("Invalid username or password");
      return;
    }

    // session only
    sessionStorage.setItem("loggedInUser", foundUser.username);

    alert("Login successful ✔");

    // IMPORTANT FIX: replace instead of href
    // prevents back button returning to login
    window.location.replace(
      foundUser.username.toLowerCase().includes("admin")
        ? "admin.html"
        : "dashboard.html"
    );

  } catch (error) {
    console.error("Login error:", error);
    alert("Something went wrong. Check console.");
  }
}

/////////////////////////////////////////////////////
// NAVIGATION
/////////////////////////////////////////////////////

function goHome() {
  window.location.href = "index.html";
}

function goSignup() {
  window.location.href = "signup.html";
}

/////////////////////////////////////////////////////
// GLOBAL ACCESS
/////////////////////////////////////////////////////

window.login = login;
window.goHome = goHome;
window.goSignup = goSignup;

</script>
  <script type="module" src="firebase.js"></script>
</body>
</HTML>
