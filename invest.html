<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invest — SmartInvest</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    if (window.history && window.history.pushState) {
      window.history.pushState(null, null, window.location.href);
      window.onpopstate = function() {
        window.history.pushState(null, null, window.location.href);
      };
    }
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f0f1a;
      color: #e8e8ec;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    /* Background particles */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(255, 187, 51, 0.12);
      border-radius: 50%;
      animation: float 15s infinite ease-in-out;
    }

    .particle:nth-child(1) { left: 10%; top: 80%; animation-delay: 0s; }
    .particle:nth-child(2) { left: 20%; top: 20%; animation-delay: 2s; }
    .particle:nth-child(3) { left: 35%; top: 60%; animation-delay: 4s; }
    .particle:nth-child(4) { left: 50%; top: 10%; animation-delay: 6s; }
    .particle:nth-child(5) { left: 65%; top: 70%; animation-delay: 8s; }
    .particle:nth-child(6) { left: 80%; top: 30%; animation-delay: 10s; }
    .particle:nth-child(7) { left: 90%; top: 85%; animation-delay: 12s; }
    .particle:nth-child(8) { left: 15%; top: 40%; animation-delay: 14s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.3; }
      50% { transform: translateY(-40px) scale(1.5); opacity: 0.8; }
    }

    .invest-wrapper {
      position: relative;
      z-index: 1;
      max-width: 480px;
      margin: 0 auto;
      padding: 20px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #666680;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 28px;
      transition: color 0.2s ease;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    .back-link:hover {
      color: #ffbb33;
    }

    .back-link svg {
      width: 16px;
      height: 16px;
    }

    .invest-card {
      background: rgba(25, 25, 40, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 24px;
      padding: 36px 32px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    .invest-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .invest-header .logo-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #ffbb33, #ff8800);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 24px;
    }

    .invest-header h2 {
      color: #fff;
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .invest-header p {
      color: #666680;
      margin: 8px 0 0 0;
      font-size: 14px;
    }

    .balance-display {
      background: rgba(15, 15, 30, 0.6);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(10px);
    }

    .balance-display h3 {
      color: #8888a0;
      margin: 0 0 8px 0;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .balance-display p {
      color: #00c851;
      margin: 0;
      font-size: 28px;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      color: #8888a0;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .amount-input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      background: rgba(15, 15, 30, 0.6);
      color: #fff;
      font-size: 18px;
      box-sizing: border-box;
      text-align: center;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      transition: all 0.25s ease;
    }

    .amount-input::placeholder {
      color: #444460;
    }

    .amount-input:focus {
      outline: none;
      border-color: #ffbb33;
      box-shadow: 0 0 0 3px rgba(255, 187, 51, 0.1);
      background: rgba(15, 15, 30, 0.8);
    }

    .plan-info {
      background: rgba(255, 187, 51, 0.08);
      border: 1px solid rgba(255, 187, 51, 0.25);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      display: none;
    }

    .plan-info.show {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    .plan-info h4 {
      color: #ffbb33;
      margin: 0 0 10px 0;
      font-size: 16px;
      font-weight: 700;
    }

    .plan-info p {
      color: #8888a0;
      margin: 5px 0;
      font-size: 14px;
    }

    .error-box {
      background: rgba(255, 68, 68, 0.08);
      border: 1px solid rgba(255, 68, 68, 0.25);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      display: none;
    }

    .error-box.show {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    .error-box p {
      color: #ff4444;
      margin: 0;
      font-size: 14px;
      font-weight: 600;
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(15, 15, 30, 0.8);
      color: #ffbb33;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Inter', sans-serif;
      position: relative;
      overflow: hidden;
      letter-spacing: 0.3px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 15px rgba(255, 187, 51, 0.15), inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .submit-btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
      transition: left 0.5s ease;
    }

    .submit-btn:hover::before {
      left: 100%;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(255, 187, 51, 0.3), 0 8px 25px rgba(0,0,0,0.2);
      border-color: rgba(255, 187, 51, 0.4);
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    .submit-btn:disabled {
      background: rgba(10, 10, 20, 0.95) !important;
      color: #333340 !important;
      opacity: 0.35;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
      filter: grayscale(100%) brightness(0.6);
      border-color: rgba(255, 255, 255, 0.03) !important;
      pointer-events: none;
    }

    #result {
      text-align: center;
      padding: 14px 16px;
      border-radius: 10px;
      margin-top: 20px;
      font-weight: 600;
      font-size: 13px;
      display: none;
      font-family: 'Inter', sans-serif;
    }

    #result.show {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #result.success {
      background: rgba(0, 200, 81, 0.12);
      color: #00c851;
      border: 1px solid rgba(0, 200, 81, 0.25);
    }

    #result.error {
      background: rgba(255, 68, 68, 0.12);
      color: #ff4444;
      border: 1px solid rgba(255, 68, 68, 0.25);
    }

    .plans-legend {
      margin-top: 25px;
      padding-top: 25px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .plans-legend h4 {
      color: #8888a0;
      margin: 0 0 15px 0;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .plan-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 14px;
    }

    .plan-item span:first-child {
      color: #aaa;
      font-weight: 600;
    }

    .plan-item span:last-child {
      color: #ffbb33;
    }

    @media (max-width: 480px) {
      .invest-card {
        padding: 28px 20px;
      }
      .invest-header h2 {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

<!-- Background Particles -->
<div class="particles">
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
</div>

<div class="invest-wrapper">

  <button class="back-link" onclick="goBack()">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
    </svg>
    Back to Dashboard
  </button>

  <div class="invest-card">

    <div class="invest-header">
      <div class="logo-icon">📈</div>
      <h2>Invest</h2>
      <p>Enter amount to see available plans</p>
    </div>

    <div class="balance-display">
      <h3>Your Balance</h3>
      <p>$<span id="userBalance">0.00</span></p>
    </div>

    <div class="form-group">
      <label>Investment Amount (USD)</label>
      <input id="investAmount" class="amount-input" type="number" placeholder="Min $100" oninput="checkPlan()">
    </div>

    <div id="planInfo" class="plan-info">
      <h4 id="planName">Select amount</h4>
      <p id="planDetails">Enter amount to see plan details</p>
    </div>

    <div id="errorBox" class="error-box">
      <p id="errorText"></p>
    </div>

    <button class="submit-btn" id="investBtn" onclick="submitInvest()" disabled>Invest Now</button>

    <p id="result"></p>

    <div class="plans-legend">
      <h4>Available Plans</h4>
      <div class="plan-item">
        <span>Starter</span>
        <span>$100 - $999 | 10% profit | 48h</span>
      </div>
      <div class="plan-item">
        <span>Pro</span>
        <span>$1,000 - $4,999 | 20% profit | 96h</span>
      </div>
      <div class="plan-item">
        <span>Premium</span>
        <span>$5,000+ | 40% profit | 120h</span>
      </div>
    </div>

  </div>

</div>
  <script type="module">
import { auth, db } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { ref, get, update, push } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

let currentUsername = null;
let userData = null;
let userBalance = 0;

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }
  
  currentUsername = sessionStorage.getItem("loggedInUser");
  if (!currentUsername) {
    window.location.href = "login.html";
    return;
  }
  
  // Load user data
  const userSnap = await get(ref(db, 'users/' + currentUsername));
  if (userSnap.exists()) {
    userData = userSnap.val();
    userBalance = userData.balance || 0;
    document.getElementById("userBalance").innerText = userBalance.toFixed(2);
  }
});

function checkPlan() {
  let amount = Number(document.getElementById("investAmount").value);
  let planInfo = document.getElementById("planInfo");
  let planName = document.getElementById("planName");
  let planDetails = document.getElementById("planDetails");
  let errorBox = document.getElementById("errorBox");
  let errorText = document.getElementById("errorText");
  let investBtn = document.getElementById("investBtn");
  
  // Reset
  planInfo.classList.remove("show");
  errorBox.classList.remove("show");
  investBtn.disabled = true;
  
  if (!amount || amount <= 0) {
    planName.innerText = "Enter amount";
    planDetails.innerText = "Minimum investment is $100";
    return;
  }
  
  // Check minimum
  if (amount < 100) {
    errorBox.classList.add("show");
    errorText.innerText = "❌ Minimum investment is $100";
    return;
  }
  
  // Check balance
  if (amount > userBalance) {
    errorBox.classList.add("show");
    errorText.innerText = `❌ Insufficient balance! You have $${userBalance.toFixed(2)}, need $${amount.toFixed(2)}`;
    return;
  }
  
  // Determine plan
  let plan = {};
  if (amount >= 100 && amount <= 999) {
    plan = { name: "Starter", profit: 0.10, hours: 48, min: 100, max: 999 };
  } else if (amount >= 1000 && amount <= 4999) {
    plan = { name: "Pro", profit: 0.20, hours: 96, min: 1000, max: 4999 };
  } else if (amount >= 5000) {
    plan = { name: "Premium", profit: 0.40, hours: 120, min: 5000, max: "Unlimited" };
  }
  
  // Show plan info
  planInfo.classList.add("show");
  planName.innerText = `✅ ${plan.name} Plan Selected`;
  planDetails.innerText = `Invest $${amount} → Profit $${(amount * plan.profit).toFixed(2)} (${plan.profit * 100}%) in ${plan.hours} hours`;
  
  // Enable button
  investBtn.disabled = false;
}

async function submitInvest() {
  let amount = Number(document.getElementById("investAmount").value);
  let result = document.getElementById("result");
  
  if (!amount || amount < 100) {
    result.className = "show error";
    result.innerText = "Minimum investment is $100";
    return;
  }
  
  if (amount > userBalance) {
    result.className = "show error";
    result.innerText = "Insufficient balance!";
    return;
  }
  
  // Determine plan
  let planName = "";
  let profitPercent = 0;
  let hours = 0;
  
  if (amount >= 100 && amount <= 999) {
    planName = "Starter";
    profitPercent = 0.10;
    hours = 48;
  } else if (amount >= 1000 && amount <= 4999) {
    planName = "Pro";
    profitPercent = 0.20;
    hours = 96;
  } else if (amount >= 5000) {
    planName = "Premium";
    profitPercent = 0.40;
    hours = 120;
  }
  
  if (!confirm(`Confirm investment:\n\nPlan: ${planName}\nAmount: $${amount}\nProfit: ${(profitPercent * 100)}%\nDuration: ${hours} hours\n\nProceed?`)) {
    return;
  }
  
  try {
    result.className = "show success";
    result.innerText = "⏳ Processing investment...";
    
    let newBalance = userBalance - amount;
    let investTime = Date.now();
    
    // Update user - SAVE EVERYTHING CORRECTLY
    await update(ref(db, 'users/' + currentUsername), {
      balance: newBalance,
      plan: planName,
      investTime: investTime,
      investAmount: amount,
      investProfitPercent: profitPercent,
      investHours: hours
    });
    
    // Save to investments history
    await push(ref(db, 'investments'), {
      user: currentUsername,
      plan: planName,
      amount: amount,
      profitPercent: profitPercent,
      hours: hours,
      status: "active",
      investTime: investTime,
      claimTime: null
    });
    
    result.className = "show success";
    result.innerText = `✅ Investment successful! $${amount} invested in ${planName} plan.`;
    
    // Update display
    userBalance = newBalance;
    document.getElementById("userBalance").innerText = userBalance.toFixed(2);
    document.getElementById("investAmount").value = "";
    document.getElementById("planInfo").classList.remove("show");
    document.getElementById("investBtn").disabled = true;
    
  } catch (error) {
    result.className = "show error";
    result.innerText = "❌ Error: " + error.message;
  }
}

function goBack() {
  window.location.href = "dashboard.html";
}

window.goBack = goBack;
window.checkPlan = checkPlan;
window.submitInvest = submitInvest;
  </script>
</body>
    </html>
