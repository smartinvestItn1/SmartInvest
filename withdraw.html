<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Withdraw</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <h2>Withdraw Funds</h2>

  <input id="wallet" placeholder="Enter wallet address">
  <input id="amount" placeholder="Enter amount">

  <button onclick="submitWithdraw()">Submit Withdrawal</button>

  <button onclick="goBack()" class="back-btn">Back</button>

</div>

<script type="module">

import { db } from "./firebase.js";
import {
  collection,
  addDoc,
  doc,
  updateDoc,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

/////////////////////////////////////////////////////
// GET USER
/////////////////////////////////////////////////////

let user = sessionStorage.getItem("loggedInUser");

if (!user) {
  window.location.href = "login.html";
}

/////////////////////////////////////////////////////
// SUBMIT WITHDRAWAL (FIREBASE)
/////////////////////////////////////////////////////

async function submitWithdraw() {

  let wallet = document.getElementById("wallet").value.trim();
  let amount = Number(document.getElementById("amount").value);

  if (!wallet || !amount || amount <= 0) {
    alert("Enter valid details");
    return;
  }

  try {

    // Save withdrawal request
    await addDoc(collection(db, "withdrawals"), {
      user: user,
      wallet: wallet,
      amount: amount,
      status: "pending",
      time: Date.now()
    });

    // Save wallet to user profile (update user document)
    const usersSnap = await getDocs(collection(db, "users"));

    usersSnap.forEach(async (u) => {
      if (u.data().username === user) {

        await updateDoc(doc(db, "users", u.id), {
          wallet: wallet
        });

      }
    });

    alert("Withdrawal submitted and pending approval");

    document.getElementById("wallet").value = "";
    document.getElementById("amount").value = "";

  } catch (err) {
    console.log(err);
    alert("Error submitting withdrawal");
  }
}

/////////////////////////////////////////////////////
// NAVIGATION
/////////////////////////////////////////////////////

function goBack() {
  window.location.href = "dashboard.html";
}

window.submitWithdraw = submitWithdraw;
window.goBack = goBack;

</script>

</body>
</html>
