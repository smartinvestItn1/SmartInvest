<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Withdraw — SmartInvest</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    if (window.history && window.history.pushState) {
      window.history.pushState(null, null, window.location.href);
      window.onpopstate = function() {
        window.history.pushState(null, null, window.location.href);
      };
    }
  </script>

  <!-- EmailJS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f0f1a;
      color: #e8e8ec;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(255, 68, 68, 0.12);
      border-radius: 50%;
      animation: float 15s infinite ease-in-out;
    }

    .particle:nth-child(1) { left: 10%; top: 80%; animation-delay: 0s; }
    .particle:nth-child(2) { left: 20%; top: 20%; animation-delay: 2s; }
    .particle:nth-child(3) { left: 35%; top: 60%; animation-delay: 4s; }
    .particle:nth-child(4) { left: 50%; top: 10%; animation-delay: 6s; }
    .particle:nth-child(5) { left: 65%; top: 70%; animation-delay: 8s; }
    .particle:nth-child(6) { left: 80%; top: 30%; animation-delay: 10s; }
    .particle:nth-child(7) { left: 90%; top: 85%; animation-delay: 12s; }
    .particle:nth-child(8) { left: 15%; top: 40%; animation-delay: 14s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.3; }
      50% { transform: translateY(-40px) scale(1.5); opacity: 0.8; }
    }

    .withdraw-wrapper {
      position: relative;
      z-index: 1;
      max-width: 480px;
      margin: 0 auto;
      padding: 20px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #666680;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 28px;
      transition: color 0.2s ease;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    .back-link:hover {
      color: #ffbb33;
    }

    .back-link svg {
      width: 16px;
      height: 16px;
    }

    .withdraw-card {
      background: rgba(25, 25, 40, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 24px;
      padding: 36px 32px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    .withdraw-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .withdraw-header .logo-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #ff4444, #cc0000);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 24px;
    }

    .withdraw-header h2 {
      color: #fff;
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .withdraw-header p {
      color: #666680;
      margin: 8px 0 0 0;
      font-size: 14px;
    }

    .balance-display {
      background: rgba(15, 15, 30, 0.6);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(10px);
    }

    .balance-display h3 {
      color: #8888a0;
      margin: 0 0 8px 0;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .balance-display p {
      color: #00c851;
      margin: 0;
      font-size: 28px;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      color: #8888a0;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      background: rgba(15, 15, 30, 0.6);
      color: #fff;
      font-size: 15px;
      box-sizing: border-box;
      transition: all 0.25s ease;
      font-family: 'Inter', sans-serif;
    }

    .form-input::placeholder {
      color: #444460;
    }

    .form-input:focus {
      outline: none;
      border-color: #ff4444;
      box-shadow: 0 0 0 3px rgba(255, 68, 68, 0.1);
      background: rgba(15, 15, 30, 0.8);
    }

    .info-box {
      background: rgba(255, 187, 51, 0.08);
      border: 1px solid rgba(255, 187, 51, 0.25);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
    }

    .info-box p {
      margin: 0;
      color: #ffbb33;
      font-size: 13px;
      line-height: 1.6;
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(15, 15, 30, 0.8);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Inter', sans-serif;
      position: relative;
      overflow: hidden;
      letter-spacing: 0.3px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 15px rgba(255, 68, 68, 0.15), inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .submit-btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
      transition: left 0.5s ease;
    }

    .submit-btn:hover::before {
      left: 100%;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(255, 68, 68, 0.3), 0 8px 25px rgba(0,0,0,0.2);
      border-color: rgba(255, 68, 68, 0.4);
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    .submit-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
      filter: grayscale(100%) brightness(0.6);
      border-color: rgba(255, 255, 255, 0.03) !important;
      background: rgba(10, 10, 20, 0.95) !important;
      color: #333340 !important;
    }

    #result {
      text-align: center;
      padding: 14px 16px;
      border-radius: 10px;
      margin-top: 20px;
      font-weight: 600;
      font-size: 13px;
      display: none;
      font-family: 'Inter', sans-serif;
    }

    #result.show {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #result.success {
      background: rgba(0, 200, 81, 0.12);
      color: #00c851;
      border: 1px solid rgba(0, 200, 81, 0.25);
    }

    #result.error {
      background: rgba(255, 68, 68, 0.12);
      color: #ff4444;
      border: 1px solid rgba(255, 68, 68, 0.25);
    }

    #result.loading {
      background: rgba(51, 181, 229, 0.12);
      color: #33b5e5;
      border: 1px solid rgba(51, 181, 229, 0.25);
    }

    @media (max-width: 480px) {
      .withdraw-card {
        padding: 28px 20px;
      }
      .withdraw-header h2 {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

<div class="particles">
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
</div>

<div class="withdraw-wrapper">

  <button class="back-link" onclick="goBack()">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
    </svg>
    Back to Dashboard
  </button>

  <div class="withdraw-card">

    <div class="withdraw-header">
      <div class="logo-icon">🏧</div>
      <h2>Withdraw Funds</h2>
      <p>Request withdrawal to your crypto wallet</p>
    </div>

    <div class="balance-display">
      <h3>Your Balance</h3>
      <p>$<span id="userBalance">0.00</span></p>
    </div>

    <div class="info-box">
      <p>✅ Withdrawals require admin approval. Make sure your wallet address is correct. No minimum amount.</p>
    </div>

    <div class="form-group">
      <label>Wallet Address</label>
      <input id="wallet" class="form-input" placeholder="Enter your crypto wallet address">
    </div>

    <div class="form-group">
      <label>Amount (USDT)</label>
      <input id="amount" class="form-input" type="number" placeholder="Enter amount">
    </div>

    <button class="submit-btn" id="withdrawBtn" onclick="submitWithdraw()">Submit Withdrawal</button>

    <p id="result"></p>

  </div>

</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { ref, push, update, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/////////////////////////////////////////////////////
// EMAILJS INIT - MOVED INSIDE MODULE
/////////////////////////////////////////////////////
emailjs.init("adbMnb80leKvWnxdc");

function notifyAdmin(subject, message) {
  emailjs.send("service_axq48s8", "template_xmmwgim", {
    subject: subject,
    message: message,
    name: "SmartInvest Withdrawal",
    email: "noreply@smartinvest.com"
  }).then(() => {
    console.log("Withdrawal notification sent");
  }).catch((err) => {
    console.error("Email failed:", err);
  });
}

let currentUser = null;
let currentUsername = null;
let userBalance = 0;
let adminFlags = { canWithdraw: true, blockReason: "" };

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }
  
  currentUsername = sessionStorage.getItem("loggedInUser");
  if (!currentUsername) {
    window.location.href = "login.html";
    return;
  }
  
  const userSnap = await get(ref(db, 'users/' + currentUsername));
  if (userSnap.exists()) {
    let data = userSnap.val();
    userBalance = data.balance || 0;
    adminFlags = data.adminFlags || { canWithdraw: true, blockReason: "" };
    
    document.getElementById("userBalance").innerText = userBalance.toFixed(2);
    
    if (data.wallet) {
      document.getElementById("wallet").value = data.wallet;
    }
    
    if (adminFlags.canWithdraw === false) {
      document.getElementById("withdrawBtn").disabled = true;
      document.getElementById("withdrawBtn").title = adminFlags.blockReason || "Withdrawal disabled by admin";
      
      let result = document.getElementById("result");
      result.className = "show error";
      result.innerText = "❌ " + (adminFlags.blockReason || "Withdrawal disabled by admin");
    }
  }
});

async function submitWithdraw() {
  const result = document.getElementById("result");

  if (!currentUsername) {
    result.className = "show error";
    result.innerText = "❌ Please login first!";
    return;
  }

  let wallet = document.getElementById("wallet").value.trim();
  let amount = Number(document.getElementById("amount").value);

  if (!wallet || !amount || amount <= 0) {
    result.className = "show error";
    result.innerText = "❌ Enter valid wallet and amount!";
    return;
  }
  
  if (amount > userBalance) {
    result.className = "show error";
    result.innerText = "❌ Insufficient balance! You have $" + userBalance.toFixed(2);
    return;
  }
  
  if (adminFlags.canWithdraw === false) {
    result.className = "show error";
    result.innerText = "❌ " + (adminFlags.blockReason || "Withdrawal disabled by admin");
    return;
  }

  try {
    result.className = "show loading";
    result.innerText = "⏳ Submitting withdrawal...";

    await push(ref(db, 'deposits'), {
      user: currentUsername,
      wallet: wallet,
      amount: amount,
      status: "pending",
      type: "withdraw",
      time: Date.now()
    });

    await update(ref(db, 'users/' + currentUsername), {
      wallet: wallet
    });

    // ===== SEND WITHDRAWAL NOTIFICATION =====
    notifyAdmin(
      "🏧 New Withdrawal — $" + amount + " from " + currentUsername,
      "User: " + currentUsername + 
      "\nAmount: $" + amount + 
      "\nWallet: " + wallet +
      "\nTime: " + new Date().toLocaleString()
    );

    result.className = "show success";
    result.innerText = "✅ Withdrawal submitted! Waiting for admin approval.";
    
    document.getElementById("amount").value = "";

  } catch (err) {
    result.className = "show error";
    result.innerText = "❌ Error: " + err.message;
    console.error(err);
  }
}

function goBack() {
  window.location.href = "dashboard.html";
}

window.submitWithdraw = submitWithdraw;
window.goBack = goBack;
</script>

</body>
  </html>
