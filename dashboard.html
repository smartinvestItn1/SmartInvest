<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<img id="dashAvatar" class="iavatar">

<div class="nav">
  <button onclick="goHome()">Home</button>
  <button onclick="goProfile()">Profile</button>
  <button onclick="goHistory()">History</button>
  <button onclick="logout()">Logout</button>
</div>

<h3>Welcome, <span id="user"></span></h3>
<h4>Investment Status: <span id="investStatus">Loading...</span></h4>

<h2>Investment Dashboard</h2>

<div class="grid">

  <div class="card">
    <h4>USDT Balance</h4>
    <h2><span id="balance">0</span> USDT</h2>
    <p>ETH: <span id="eth">0</span></p>
  </div>

  <div class="card">
    <h4>Bitcoin</h4>
    <h2><span id="btc">0</span> BTC</h2>
  </div>

  <div class="card">
    <h4>Pending Deposits</h4>
    <h2>$<span id="pending">0</span></h2>
  </div>

  <div class="card">
    <h4>Plan</h4>
    <h2 id="planType">None</h2>
  </div>

</div>

<div class="box">
  <h3>Deposit</h3>
  <button onclick="goDeposit()">Go to Deposit Page</button>
</div>

<div class="box">
  <h3>Withdraw</h3>
  <button onclick="goWithdraw()">Withdraw Funds</button>
</div>

<h2>Investment Plans</h2>

<div class="grid">

  <div class="card">
    <h3>Starter</h3>
    <p>10% Profit (48 hours)</p>
    <button onclick="goInvest('Starter')">Invest</button>
  </div>

  <div class="card">
    <h3>Pro</h3>
    <p>20% Profit (96 hours)</p>
    <button onclick="goInvest('Pro')">Invest</button>
  </div>

  <div class="card">
    <h3>Premium</h3>
    <p>40% Profit (120 hours)</p>
    <button onclick="goInvest('Premium')">Invest</button>
  </div>

</div>

<script>

let users = JSON.parse(localStorage.getItem("users")) || [];
let deposits = JSON.parse(localStorage.getItem("deposits")) || [];
let currentUser = localStorage.getItem("loggedInUser");

let userIndex = users.findIndex(u => u.username === currentUser);
if (userIndex === -1) {
  window.location.href = "login.html";
}

let user = users[userIndex];

let btcRate = 65000;
let ethRate = 3500;

/* =========================
   UPDATE UI
========================= */
function updateUI() {

  document.getElementById("user").innerText = user.username;

  let balance = user.balance || 0;

  document.getElementById("balance").innerText = balance.toFixed(2);
  document.getElementById("btc").innerText = (balance / btcRate).toFixed(6);
  document.getElementById("eth").innerText = (balance / ethRate).toFixed(4);
  document.getElementById("planType").innerText = user.plan || "None";

  let pendingTotal = deposits
    .filter(d => d.user === currentUser && d.status === "pending")
    .reduce((sum, d) => sum + d.amount, 0);

  document.getElementById("pending").innerText = pendingTotal;

  document.getElementById("dashAvatar").src =
    user.image || "https://via.placeholder.com/80";

  updateInvestmentStatus();
}

/* =========================
   INVEST
========================= */
function goInvest(plan) {

  if (user.plan && user.plan !== "None") {
    alert("Already invested");
    return;
  }

  let amount = 0;

  if (plan === "Starter") amount = 100;
  if (plan === "Pro") amount = 1000;
  if (plan === "Premium") amount = 5000;

  if ((user.balance || 0) < amount) {
    alert("Not enough balance");
    return;
  }

  user.balance -= amount;
  user.plan = plan;
  user.invested = amount;

  // IMPORTANT: set investment time
  user.investStart = Date.now();
  user.lastProfit = 0;

  users[userIndex] = user;
  localStorage.setItem("users", JSON.stringify(users));

  updateUI();
  alert(`Invested ${amount} USDT`);
}

/* =========================
   PROFIT SYSTEM (FIXED)
========================= */

function getProfitRate(amount) {
  if (amount >= 50 && amount <= 999) return 0.10;
  if (amount >= 1000 && amount <= 4999) return 0.20;
  if (amount >= 5000) return 0.40;
  return 0;
}

function getDuration(rate) {
  if (rate === 0.10) return 48 * 60 * 60 * 1000;
  if (rate === 0.20) return 96 * 60 * 60 * 1000;
  if (rate === 0.40) return 120 * 60 * 60 * 1000;
  return 0;
}

function runAutoProfit() {

  if (!user.invested) return;

  let rate = getProfitRate(user.invested);
  let duration = getDuration(rate);

  let now = Date.now();

  if (!user.investStart) user.investStart = now;

  let elapsed = now - user.investStart;

  // prevent multiple profit stacking
  if (user.lastProfit && elapsed - user.lastProfit < duration) return;

  if (elapsed >= duration) {

    let profit = user.invested * rate;

    user.balance += profit;

    // reset cycle
    user.investStart = now;
    user.lastProfit = now;

    users[userIndex] = user;
    localStorage.setItem("users", JSON.stringify(users));

    updateUI();
  }
}

setInterval(runAutoProfit, 60000);

/* =========================
   STATUS
========================= */
function updateInvestmentStatus() {
  let el = document.getElementById("investStatus");

  if (user.plan && user.plan !== "None") {
    el.innerText = "🟢 Active (" + user.plan + ")";
    el.style.color = "green";
  } else {
    el.innerText = "🔴 No Investment";
    el.style.color = "red";
  }
}

/* =========================
   NAV
========================= */
function goDeposit() { window.location.href = "deposit.html"; }
function goWithdraw() { window.location.href = "withdraw.html"; }
function goHome() { window.location.href = "index.html"; }
function goProfile() { window.location.href = "profile.html"; }
function goHistory() { window.location.href = "history.html"; }

function logout() {
  localStorage.removeItem("loggedInUser");
  window.location.href = "login.html";
}

updateUI();

</script>

</body>
</html>
